function PapernestModal({lead, user, onClose, addToast}){
  const [called,setCalled]=useState(false);
  const [rdv,setRdv]=useState("");
  const [adresse,setAdresse]=useState(lead.adresseBien||"");
  const [sending,setSending]=useState(false);
  const hasEmail=!!(lead.email||"").trim();
  const prenom=prenomOf(lead);

  const fmtRdv=(dtl)=>{
    if(!dtl) return "";
    const d=new Date(dtl);
    const jours=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
    const mois=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    const mn=d.getMinutes();
    return jours[d.getDay()]+" "+d.getDate()+" "+mois[d.getMonth()]+" à "+d.getHours()+"h"+(mn<10?"0"+mn:mn);
  };

  const confirm=()=>{
    if(!called){ addToast("Confirme d'abord l'appel pour l'annonce","error"); return; }
    if(!rdv){ addToast("Saisis la date et l'heure du RDV Papernest","error"); return; }
    if(!adresse.trim()){ addToast("Saisis l'adresse du bien loué","error"); return; }
    const rdvLabel=fmtRdv(rdv);
    setSending(true);
    // RDV + adresse enregistrés tout de suite ; « mail envoyé » seulement si le script ne renvoie pas d'erreur
    const base={ papernestRdv:{iso:rdv,label:rdvLabel}, papernestSender:roleOfEmail(user.email), adresseBien:adresse.trim() };
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),base).catch(()=>{});
    const done=(msg)=>{ fsUpdateDoc(fsDocRef(db,"leads",lead.id),{papernestEnvoye:true}).catch(()=>{}); setSending(false); addToast(msg); onClose(); };
    if(!VALIDATION_WEBAPP_URL||!hasEmail){ done(hasEmail?"Dossier validé (envoi non configuré)":"Dossier validé (pas d'email, mail non envoyé)"); return; }
    fetchTimeout(VALIDATION_WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({ email:lead.email||"", prenom:prenom, nom:lead.name||"", phone:lead.phone||"", rdvLabel:rdvLabel, adresse:adresse.trim(), sender:roleOfEmail(user.email) })},20000)
      .then(r=>r.text())
      .then(txt=>{
        const t=String(txt).trim();
        if(/^ERREUR/i.test(t)){ setSending(false); addToast("✗ Mail de validation NON envoyé — "+t.replace(/^ERREUR\s*:?\s*/i,""),"error"); return; }
        if(/^OK_SANS_RECAP/i.test(t)){ done("✓ Mail envoyé au client"); addToast("⚠ Récap hello@ NON envoyé — "+t.replace(/^OK_SANS_RECAP\s*:?\s*/i,""),"error"); return; }
        if(/<html|accounts\.google/i.test(t)){ setSending(false); addToast("✗ Mail de validation NON envoyé — script Google inaccessible (droits d'accès)","error"); return; }
        done("✓ Dossier validé, mail envoyé au client");
      })
      .catch(()=>done("Dossier validé — mail transmis (confirmation indisponible)"));
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Dossier validé 🎉</div>
        <div className="modal-sub">{lead.name} passe en Validé. Dernière étape avant le mail de félicitations au client.</div>
        <label style={{display:"flex",alignItems:"flex-start",gap:9,padding:"11px 13px",border:"1.5px solid",borderColor:called?"var(--green)":"var(--border2)",borderRadius:10,margin:"12px 0",cursor:"pointer",background:called?"var(--green-bg)":"var(--surface)"}}>
          <input type="checkbox" checked={called} onChange={e=>setCalled(e.target.checked)} style={{marginTop:2}}/>
          <span style={{fontSize:13,fontWeight:600,color:"var(--text2)"}}>J'ai bien appelé le client pour l'annonce.</span>
        </label>
        <div className="fg">
          <label className="fl">Date et heure du RDV Papernest *</label>
          <input className="fi" type="datetime-local" value={rdv} onChange={e=>setRdv(e.target.value)}/>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Le mail rappellera ce RDV au client (souscription énergie et internet en 30 min).</div>
        </div>
        <div className="fg">
          <label className="fl">Adresse du bien loué *</label>
          <input className="fi" placeholder="N°, rue, code postal, ville" value={adresse} onChange={e=>setAdresse(e.target.value)}/>
        </div>
        {!hasEmail&&<div style={{fontSize:12,color:"var(--red)",fontWeight:700,marginTop:8}}>⚠ Pas d'email sur la fiche : le mail ne pourra pas partir. Ajoute-le d'abord si tu veux l'envoyer.</div>}
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Plus tard</button>
          <button className="btn btn-p" onClick={confirm} disabled={sending}><Ic n="check" s={13}/>{sending?"Envoi…":"Valider & envoyer"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── REGISTRE DES LETTRES DE MISSION ─────────────────────────────────────
function generateLettrePDF(lt){
  try {
    var A="#C1614F", D="#2C3E50", CR="#FBF7F0", BD="#E5D9C6", G="#9AA7B2", T2="#5A6B7B";
    var montant=(lt.montant||"—")+" € TTC";
    var titre=(lt.titre||"").toUpperCase();
    var art=function(h,txt){ return '<div style="font-size:12px;font-weight:800;color:'+D+';text-decoration:underline;margin:14px 0 5px;">'+h+'</div><div style="font-size:11.5px;color:#3C4A5A;line-height:1.55;margin-bottom:8px;">'+txt+'</div>'; };
    var css="@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Inter',Arial,sans-serif;background:#fff;color:"+D+";font-size:13px;}.page{max-width:800px;margin:0 auto;}.header{background:"+D+";padding:20px 30px;display:flex;align-items:center;justify-content:space-between;}.htitle{font-family:'Sora',sans-serif;color:#fff;font-size:18px;font-weight:800;letter-spacing:.08em;}.hsub{color:"+A+";font-size:12px;font-weight:700;letter-spacing:.05em;margin-top:3px;}.logo{width:42px;height:42px;background:"+A+";border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:21px;font-family:'Sora',sans-serif;}.body{padding:22px 30px;}.montant{background:#F5E2DD;color:#A14E3F;padding:1px 6px;border-radius:4px;font-weight:800;}.sign{border-top:2px solid "+A+";margin-top:20px;padding-top:16px;}.footer{background:"+D+";padding:12px 30px;text-align:center;color:rgba(255,255,255,.6);font-size:10px;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}";
    var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><title>Lettre '+(lt.numero||"")+'</title><style>'+css+'</style></head><body><div class="page">';
    html+='<div class="header"><div><div class="htitle">LETTRE DE MISSION</div><div class="hsub">'+titre+'</div></div><div class="logo">S</div></div>';
    html+='<div class="body">';
    html+='<div style="text-align:right;font-size:11px;color:'+G+';margin-bottom:6px;">Réf. <b style="color:'+A+';">'+(lt.numero||"—")+'</b></div>';
    html+=art("Préambule – Identification des parties","La présente lettre de mission est conclue entre le Prestataire : <b>soloc'</b>, entreprise immatriculée sous le SIREN 920049541, ci-après dénommé « le Prestataire », et le Client : la personne physique signataire de la présente lettre de mission, ci-après dénommée « le Client ».");
    html+=art("1 – Détails de la prestation","Dans le cadre de la présente mission, le Prestataire s'engage à réaliser pour le Client : élaboration, vérification et optimisation du dossier locatif ; attribution d'un interlocuteur dédié avec un premier contact sous 24 heures ouvrées ; recherche et sélection ciblée de logements correspondant aux critères définis ; organisation des visites en présentiel et/ou virtuel ; accompagnement personnalisé et conseil continu jusqu'à la signature d'un bail de location.");
    html+=art("2 – Montant de la prestation et conditions de règlement","Le montant de la prestation est fixé à <span class=\"montant\">"+montant+"</span>. Le règlement est exigible uniquement en cas de réussite de la mission, c'est-à-dire à la signature par le Client d'un bail de location portant sur un logement présenté et validé par l'intermédiaire du Prestataire. Le paiement devra intervenir dans un délai maximal de 7 jours suivant ladite signature. La présente prestation n'inclut pas les éventuels honoraires d'agence immobilière, ni les frais liés à la conclusion du bail.");
    html+=art("3 – Durée et résiliation","La présente mission prend effet à compter de la signature de la présente lettre de mission. Elle se poursuit jusqu'à la signature par le Client d'un bail portant sur un logement présenté par le Prestataire, ou la résiliation de la mission par l'une ou l'autre des parties. La résiliation peut intervenir à tout moment, sous réserve des dispositions de l'article 4.");

    html+='<div style="font-size:12px;color:'+T2+';">Signée électroniquement par <b style="color:'+D+';">'+(lt.signedNom||lt.nom||"—")+'</b> le '+(lt.signedDate||fmtDate(lt.signedAt))+'.</div>';

    html+='</div><script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script></body></html>';

}

function RegistrePage({lettres, isAdmin, addToast}){
  const signed=lettres.filter(l=>l.status==="signe").slice().sort((a,b)=>{

  const del=(lt)=>{
    if(!confirm("Supprimer cette lettre du registre ? Le numéro "+(lt.numero||"")+" pourra être réattribué.")) return;

// ─── ARCHIVES (réservé à Charles) ────────────────────────────────────────
function ArchivesPage({leads, lettres, addToast, isMobile}){
  const lettreById={}; (lettres||[]).forEach(lt=>{ lettreById[lt.id]=lt; });
  const archived=leads.filter(l=>l.archived);
  const byMonth={};
  archived.forEach(l=>{ const mk=archiveMonthOf(l); (byMonth[mk]=byMonth[mk]||[]).push(l); });
  const months=Object.keys(byMonth).sort().reverse();
  const [sel,setSel]=useState(null);
  const [editing,setEditing]=useState(null);
  const selMonth=(sel&&byMonth[sel])?sel:(months[0]||null);
  const idx=months.indexOf(selMonth);
  const rows=(byMonth[selMonth]||[]).slice().sort((a,b)=>new Date(validatedISO(a)||0)-new Date(validatedISO(b)||0));
  const caOf=(list)=>list.reduce((t,l)=>t+(montantTTCOf(l,lettreById[l.id])||0),0);
  const caTTC=caOf(rows);
  const attente=leads.filter(l=>l.column==="valide"&&!l.archived&&!l.paid&&archiveMonthOf(l)<localMonthKey()).length;

  const desarchiver=(l)=>{
    if(!confirm("Remettre "+l.name+" dans la colonne Validé ? La case Payé sera décochée (sinon il repartirait aussitôt en Archives).")) return;
    fsUpdateDoc(fsDocRef(db,"leads",l.id),{archived:false, archiveMonth:null, paid:false, lastActivity:nowISO(),
      history:[...(l.history||[]),mkEvent("↩️","Sorti des Archives")]}).then(()=>addToast(l.name+" remis en Validé")).catch(()=>addToast("Erreur","error"));
  };
  const exportCSV=()=>{
    const esc=(v)=>{ const s=String(v==null?"":v); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const head=["Nom","Prénom","Téléphone","Email","Montant TTC","Adresse du bien","Validé le"];
    const lines=rows.map(l=>{ const n=splitName(l); const m=montantTTCOf(l,lettreById[l.id]); return [n.nom,n.prenom,l.phone||"",l.email||"",m!=null?m:"",l.adresseBien||"",fmtDate(validatedISO(l))].map(esc).join(";"); });
    lines.push(["TOTAL","","","",caTTC,rows.length+" dossier"+(rows.length>1?"s":""),""].map(esc).join(";"));
    const blob=new Blob(["\ufeff"+[head.join(";")].concat(lines).join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="archives-"+selMonth+".csv"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const klab={fontSize:10,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".06em"};
  const kval={fontSize:22,fontWeight:800,marginTop:4};

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Archives</div>
          <div className="ps">Dossiers validés et payés, classés par mois de validation</div>
        </div>
        <div className="tb-right"><button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button></div>
      </div>
      <div className="main">
        {attente>0&&<div style={{background:"#FEF3C7",border:"1.5px solid #FCD34D",borderRadius:12,padding:"11px 14px",marginBottom:14,fontSize:13,color:"#92400e",fontWeight:600}}>
          ⏳ {attente} dossier{attente>1?"s":""} validé{attente>1?"s":""} d'un mois passé attend{attente>1?"ent":""} encore le paiement. Coche « Payé » dans le Pipeline pour l'archiver.
        </div>}
        {months.length===0
          ? <div className="empty-state"><div className="es-ic">🗄️</div><div className="es-t">Aucun dossier archivé</div><div>Chaque mois, les dossiers validés et payés des mois précédents arrivent ici.</div></div>
          : <>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8,opacity:idx<months.length-1?1:.35}} disabled={idx>=months.length-1} onClick={()=>setSel(months[idx+1])}><Ic n="chevL" s={15}/></button>
                <span style={{fontSize:14,fontWeight:700,minWidth:120,textAlign:"center"}}>{monthLabel(selMonth)}</span>
                <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8,opacity:idx>0?1:.35}} disabled={idx<=0} onClick={()=>setSel(months[idx-1])}><Ic n="chevR" s={15}/></button>
              </div>
              <button className="btn btn-g" onClick={exportCSV}><Ic n="upload" s={13}/>Exporter le mois (CSV)</button>
            </div>

            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"1fr 1fr 1fr 1fr",gap:10,marginBottom:18}}>
              <div style={{...card,background:"var(--ardoise)",borderColor:"var(--ardoise)"}}>

              </div>
              <div style={card}><div style={klab}>CA du mois TTC</div><div className="brand-font" style={{...kval,color:"var(--green)"}}>{eurFmt(caTTC)}</div></div>
              <div style={card}><div style={klab}>CA du mois HT</div><div className="brand-font" style={kval}>{eurFmt(caTTC/1.2)}</div></div>
              <div style={card}><div style={klab}>Panier moyen TTC</div><div className="brand-font" style={kval}>{rows.length?eurFmt(caTTC/rows.length):"—"}</div></div>
            </div>

            <div style={{overflowX:"auto"}}><table className="list-table">
              <thead><tr><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Email</th><th>Montant TTC</th><th>Adresse du bien</th><th>Validé le</th><th style={{width:70}}></th></tr></thead>
              <tbody>
                {rows.map(l=>{ const n=splitName(l); const m=montantTTCOf(l,lettreById[l.id]); return(
                  <tr key={l.id}>
                    <td className="td-name">{n.nom||"—"}</td>
                    <td>{n.prenom||"—"}</td>
                    <td style={{whiteSpace:"nowrap"}}>{l.phone?<a href={"tel:"+l.phone} style={{color:"inherit"}}>{l.phone}</a>:"—"}</td>
                    <td>{l.email?<a href={"mailto:"+l.email} style={{color:"var(--accent)",fontWeight:700,textDecoration:"none"}}>{l.email}</a>:"—"}</td>
                    <td style={{whiteSpace:"nowrap",fontWeight:700}}>{m!=null?eurFmt(m):"—"}</td>
                    <td style={{cursor:"pointer",minWidth:160}} onClick={()=>setEditing(l)} title="Modifier">{l.adresseBien||<span style={{color:"var(--red)",fontWeight:700,fontSize:12}}>+ Ajouter l'adresse</span>}</td>
                    <td style={{whiteSpace:"nowrap"}}>{fmtDate(validatedISO(l))}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className="ib" onClick={()=>setEditing(l)} title="Modifier"><Ic n="edit" s={14}/></button>
                      <button className="ib" onClick={()=>desarchiver(l)} title="Remettre en Validé"><Ic n="x" s={14}/></button>
                    </td>
                  </tr>);})}
              </tbody>
            </table></div>

            <div style={{fontSize:11,fontWeight:800,color:"var(--accent)",letterSpacing:".06em",textTransform:"uppercase",margin:"22px 0 10px"}}>Récapitulatif par mois</div>
            <div style={{overflowX:"auto"}}><table className="list-table">
              <thead><tr><th>Mois</th><th>Dossiers</th><th>CA TTC</th><th>CA HT</th></tr></thead>
              <tbody>
                {months.map(mk=>{ const ca=caOf(byMonth[mk]); return(
                  <tr key={mk} style={{cursor:"pointer",background:mk===selMonth?"var(--accent-l)":undefined}} onClick={()=>setSel(mk)}>
                    <td className="td-name">{monthLabel(mk)}</td>
                    <td>{byMonth[mk].length}</td>
                    <td style={{fontWeight:700}}>{eurFmt(ca)}</td>
                    <td>{eurFmt(ca/1.2)}</td>
                  </tr>);})}
              </tbody>
            </table></div>
          </>}
      </div>
      {editing&&<ArchiveEditModal lead={editing} montant={montantTTCOf(editing,lettreById[editing.id])} onClose={()=>setEditing(null)} addToast={addToast}/>}
    </>
  );
}

// ─── PILOTAGE (réservé à Charles) ────────────────────────────────────────
function PilotagePage({user, leads}){
  const [selMonth,setSelMonth]=useState(todayKey().slice(0,7));
  const [funnelMode,setFunnelMode]=useState("total");
  const [teamMode,setTeamMode]=useState("month");
  const mkOf=(iso)=>iso?String(iso).slice(0,7):"";
  const objOf=(mk)=>OBJECTIFS_MENSUELS[mk.slice(5,7)]||0;
  const mLabel=(mk)=>{ if(!mk) return "—"; const p=mk.split("-"); return MOIS_FR[(+p[1])-1]+" "+p[0]; };
  const eur=(n)=>Math.round(n).toLocaleString("fr-FR")+" €";

  const valides=leads.filter(l=>l.column==="valide");
  const signesMois=(mk)=>valides.filter(l=>mkOf(l.validatedAt||l.lastActivity)===mk).length;
  const recusMois=(mk)=>leads.filter(l=>mkOf(l.createdAt)===mk).length;

  const totalLeads=leads.length;
  const signesTotal=valides.length;
  const tauxConv=totalLeads>0?(signesTotal/totalLeads):0;
  const enCours=leads.filter(l=>l.column!=="valide"&&l.column!=="sans_suite").length;

  const sigCur=signesMois(selMonth);
  const objCur=objOf(selMonth);
  const recusCur=recusMois(selMonth);
  const prevMk=(()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const recusPrev=recusMois(prevMk);
  const leadsNeeded=tauxConv>0?Math.round(objCur/tauxConv):null;
  const gapLeads=leadsNeeded!=null?(leadsNeeded-recusCur):null;

  const caReal=sigCur*PANIER_MOYEN_TTC;
  const caObj=objCur*PANIER_MOYEN_TTC;

  const funnelLeads = funnelMode==="month" ? leads.filter(l=>mkOf(l.createdAt)===selMonth) : leads;
  const funnel=PIPELINE_COLS.map(c=>({...c,n:funnelLeads.filter(l=>l.column===c.id).length}));
  const maxF=Math.max(1,...funnel.map(f=>f.n));

  const CYCLE_START = "2026-09-01T00:00:00";
  const afterStart=(iso)=>iso && new Date(iso)>=new Date(CYCLE_START);
  const months12=["2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07","2027-08"];
  const sigByMonth=months12.map(mk=>({mk,n:signesMois(mk),obj:objOf(mk)}));
  const maxSig=Math.max(1,...sigByMonth.map(s=>Math.max(s.n,s.obj)));

  // Performance équipe : mois sélectionné (« Ce mois ») ou depuis le début du cycle (« Total »)
  const inTeam=(iso)=> teamMode==="month" ? mkOf(iso)===selMonth : afterStart(iso);
  const perf=(role)=>({sig:valides.filter(l=>asArray(l.assignedTo).includes(role) && inTeam(l.validatedAt||l.lastActivity)).length, tot:leads.filter(l=>asArray(l.assignedTo).includes(role) && inTeam(l.createdAt)).length});
  const emmyP=perf("emmy"), ayaP=perf("aya");
  const envoyesOf=(role)=>leads.filter(l=>asArray(l.assignedTo).includes(role) && l.envoyeAt && inTeam(l.envoyeAt)).length;
  const emmyEnv=envoyesOf("emmy"), ayaEnv=envoyesOf("aya");
  const totalEnv=leads.filter(l=>l.envoyeAt && inTeam(l.envoyeAt)).length;
  const maxTeam=Math.max(1,emmyP.tot,ayaP.tot);
  const durations=valides.filter(l=>l.validatedAt && inTeam(l.validatedAt)).map(l=>{ if(!l.createdAt||!l.validatedAt) return null; return (new Date(l.validatedAt)-new Date(l.createdAt))/86400000; }).filter(x=>x!=null&&x>=0);
  const avgDays=durations.length?Math.round(durations.reduce((s,x)=>s+x,0)/durations.length):null;

  const prevMonth=()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()-1); setSelMonth(d.toISOString().slice(0,7)); };
  const nextMonth=()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()+1); setSelMonth(d.toISOString().slice(0,7)); };

  const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const klab={fontSize:9,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".05em"};
  const kval={fontSize:24,fontWeight:800,marginTop:3};

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Pilotage</div>
          <div className="ps">Objectifs internes · panier moyen {PANIER_MOYEN_TTC} € TTC</div>
        </div>
        <div className="tb-right">
          <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={prevMonth}><Ic n="chevL" s={15}/></button>
          <span style={{fontSize:13,fontWeight:700,minWidth:120,textAlign:"center"}}>{mLabel(selMonth)}</span>
          <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={nextMonth}><Ic n="chevR" s={15}/></button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
          <div style={{...card,background:"var(--ardoise)",borderColor:"var(--ardoise)"}}>
            <div style={{...klab,color:"rgba(255,255,255,.55)"}}>Signés ce mois</div>
            <div className="brand-font" style={{...kval,color:"#fff"}}>{sigCur}<span style={{fontSize:15,color:"rgba(255,255,255,.5)"}}>/{objCur}</span></div>
            <div style={{height:5,background:"rgba(255,255,255,.15)",borderRadius:20,marginTop:6,overflow:"hidden"}}><div style={{width:Math.min(100,objCur?sigCur/objCur*100:0)+"%",height:"100%",background:"var(--green)"}}/></div>
          </div>
          <div style={card}><div style={klab}>Taux de conversion</div><div className="brand-font" style={{...kval,color:"var(--accent)"}}>{Math.round(tauxConv*100)}%</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>signés ÷ total leads</div></div>
          <div style={card}><div style={klab}>Leads reçus (mois)</div><div className="brand-font" style={kval}>{recusCur}</div><div style={{fontSize:10,color:recusCur>=recusPrev?"var(--green)":"var(--red)",marginTop:2}}>{recusCur>=recusPrev?"+":""}{recusCur-recusPrev} vs {mLabel(prevMk).split(" ")[0]}</div></div>
          <div style={card}><div style={klab}>En cours (pipeline)</div><div className="brand-font" style={kval}>{enCours}</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>leads actifs</div></div>
        </div>

        {/* INSIGHT leads nécessaires */}
        <div style={{background:"var(--accent-l)",border:"1.5px solid var(--accent-l2)",borderRadius:12,padding:"14px 16px",marginTop:14,display:"flex",alignItems:"center",gap:14}}>
          <div style={{fontSize:26}}>🎯</div>
          <div style={{fontSize:13,color:"var(--accent-d)",lineHeight:1.5}}>
            {tauxConv>0
              ? <>À <b>{Math.round(tauxConv*100)}% de conversion</b>, pour atteindre <b>{objCur} signé{objCur>1?"s":""}</b> en {mLabel(selMonth).split(" ")[0]} il te faut <b>~{leadsNeeded} leads</b>. Tu en as reçu <b>{recusCur}</b> → {gapLeads>0?<span style={{fontWeight:700}}>il t'en manque ~{gapLeads}.</span>:<span style={{fontWeight:700,color:"var(--green)"}}>objectif de volume atteint ✓</span>}</>
              : <>Pas encore assez de données pour calculer le taux de conversion. Il se précisera à mesure que des dossiers se signent.</>}
          </div>
        </div>

        {/* ENTONNOIR */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,margin:"18px 0 10px"}}>
          <div style={{fontSize:11,fontWeight:800,color:"var(--accent)",letterSpacing:".06em",textTransform:"uppercase"}}>Entonnoir — {funnelMode==="month"?("leads reçus en "+mLabel(selMonth).split(" ")[0]):"où sont les leads"}</div>
          <div className="seg" style={{flexShrink:0}}>
            <button type="button" className={"seg-btn"+(funnelMode==="month"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>setFunnelMode("month")}>Ce mois</button>
            <button type="button" className={"seg-btn"+(funnelMode==="total"?" active":"")} onClick={()=>setFunnelMode("total")}>Total</button>
          </div>
        </div>
        <div style={card}>
          {funnel.map(f=>(
            <div key={f.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:14}}>
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",marginBottom:12}}>Signatures par mois (obj. en clair)</div>

              {sigByMonth.map(s=>(

                  <div style={{position:"relative",height:60,display:"flex",alignItems:"flex-end",justifyContent:"center",marginTop:3}}>
                    <div style={{position:"absolute",bottom:0,width:20,height:Math.max(3,s.obj/maxSig*60),background:"var(--accent-l)",borderRadius:"4px 4px 0 0"}}/>
                    <div style={{position:"relative",width:20,height:Math.max(3,s.n/maxSig*60),background:s.mk===selMonth?"var(--accent)":"var(--accent-l2)",borderRadius:"4px 4px 0 0"}}/>
                  </div>
                  <div style={{fontSize:8,color:"var(--text3)",marginTop:3}}>{MOIS_FR[(+s.mk.split("-")[1])-1].slice(0,3)}</div>

          <div style={card}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text2)"}}>Performance équipe — {teamMode==="month"?mLabel(selMonth):"depuis sept. 2026"}</div>
              <div className="seg" style={{flexShrink:0}}>
                <button type="button" className={"seg-btn"+(teamMode==="month"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>setTeamMode("month")}>Ce mois</button>
                <button type="button" className={"seg-btn"+(teamMode==="total"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>setTeamMode("total")}>Total</button>

            </div>
            <div style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{fontWeight:700,color:ASSIGNEES.emmy.color}}>Emmy</span><span style={{color:"var(--text2)"}}>{emmyP.sig} signés · {emmyEnv} envoyés · {emmyP.tot} leads</span></div>
              <div style={{height:6,background:"var(--surface2)",borderRadius:20,overflow:"hidden"}}><div style={{width:(emmyP.tot/maxTeam*100)+"%",height:"100%",background:ASSIGNEES.emmy.color}}/></div>
            </div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{fontWeight:700,color:ASSIGNEES.aya.color}}>Aya</span><span style={{color:"var(--text2)"}}>{ayaP.sig} signés · {ayaEnv} envoyés · {ayaP.tot} leads</span></div>
              <div style={{height:6,background:"var(--surface2)",borderRadius:20,overflow:"hidden"}}><div style={{width:(ayaP.tot/maxTeam*100)+"%",height:"100%",background:ASSIGNEES.aya.color}}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12,paddingTop:10,borderTop:"1px solid var(--border)"}}>
              <span style={{fontSize:11,fontWeight:700,color:"var(--text2)"}}>Dossiers envoyés {teamMode==="month"?"(mois)":"(total)"}</span>
              <span className="brand-font" style={{fontSize:16,fontWeight:800,color:"var(--accent)"}}>{totalEnv}</span>

            <div style={{fontSize:10,color:"var(--text3)",marginTop:8}}>Temps moyen contact → signé : <b style={{color:"var(--text)"}}>{avgDays!=null?avgDays+" jours":"—"}</b></div>

// ─── STATISTIQUES (réservé à Charles) : provenance des leads du site solocimmo.fr ─────
// Le site écrit : leads.origine = { bouton, provenance, campagne } (anciens leads : « Bouton cliqué : … » dans les notes)
// et compte les clics dans la collection « clics » : un document par jour × bouton × provenance { date, bouton, provenance, n }.
const BOUTONS_SITE = {
  hero:"Haut de page", bulle:"Bulle flottante", etudiant:"Pack Étudiant", salarie:"Pack Salarié", surmesure:"Pack Sur-mesure",
  exclu:"Biens exclusifs", methode:"Section Méthode", faq:"FAQ", final:"Bas de page", quiz:"Questionnaire 30 s", blog:"Articles du blog"
};
const PROVENANCES_SITE = { tiktok:"TikTok", instagram:"Instagram", facebook:"Facebook", google:"Google", snapchat:"Snapchat", linkedin:"LinkedIn", direct:"Direct" };
const cleStat = (v) => String(v||"").trim().toLowerCase();
// Origine d'un lead venu du site (null si le lead ne vient pas du site)
const origineOf = (l) => {
  const o = l.origine;
  if(o && (o.bouton || o.provenance)) return { bouton:cleStat(o.bouton)||"inconnu", provenance:cleStat(o.provenance)||"direct" };
  const n = String(l.notes||"");
  const b = n.match(/Bouton cliqu[ée]\s*:\s*([^\n]+)/i);
  if(!b) return l.source==="tiktok" ? { bouton:"formulaire", provenance:"tiktok" } : null; // anciens leads du formulaire TikTok
  const pr = n.match(/Provenance\s*:\s*([^\n/]+)/i);
  return { bouton:cleStat(b[1])||"inconnu", provenance:(pr&&cleStat(pr[1]))||"direct" };
};
const libBouton = (k) => k.indexOf("formulaire:")===0 ? "Formulaire "+libProvenance(k.slice(11)) : (BOUTONS_SITE[k] || (k==="inconnu"?"Inconnu":k));
const libProvenance = (k) => PROVENANCES_SITE[k] || (k ? k.charAt(0).toUpperCase()+k.slice(1) : "Direct");

function StatsPage({leads}){
  const [clics,setClics]=useState([]);
  const [clicsErr,setClicsErr]=useState(false);
  // Période : un mois calendaire (remis à zéro chaque mois, navigation ‹ ›) ou vue globale
  const [mode,setMode]=useState("month");
  const [selMonth,setSelMonth]=useState(todayKey().slice(0,7));
  const moisLabel=(mk)=>{ const p=mk.split("-"); return MOIS_FR[(+p[1])-1]+" "+p[0]; };
  const decaleMois=(n)=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()+n); setSelMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); };
  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"clics"),snap=>{ setClics(snap.docs.map(d=>({id:d.id,...d.data()}))); setClicsErr(false); },()=>setClicsErr(true));
    return unsub;
  },[]);

  // Période : 7 jours / 30 jours (aujourd'hui compris) / tout
  const jourLocal = (iso) => { if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const dansPeriode = (jour) => mode==="total" || (!!jour && jour.slice(0,7)===selMonth);

  const clicsP = clics.filter(c=>dansPeriode(String(c.date||"")));
  const leadsP = leads.filter(l=>dansPeriode(jourLocal(l.createdAt)));
  const siteLeads = leadsP.map(l=>({l,o:origineOf(l)})).filter(x=>x.o);

  // Le formulaire (tiktok.html) compte comme un bouton à part : « Formulaire TikTok », « Formulaire Instagram »…
  const normO = (o) => ({ bouton:cleStat(o.bouton)||"inconnu", provenance:cleStat(o.provenance)||"direct" });
  const cleBouton = (o) => o.bouton==="formulaire" ? "formulaire:"+o.provenance : o.bouton;
  const sousCanal = (o) => o.bouton==="formulaire" ? "formulaire" : "site";
  const agg = (cleFn, sousFn) => {
    const m = {};
    const get = (o) => { const k=cleFn(o); const r=(m[k] = m[k] || { k, clics:0, leads:0, sous:{} }); if(sousFn){ const sk=sousFn(o); r.sous[sk]=r.sous[sk]||{k:sk,clics:0,leads:0}; return [r,r.sous[sk]]; } return [r]; };
    clicsP.forEach(c=>{ get(normO(c)).forEach(r=>{ r.clics += (+c.n||0); }); });
    siteLeads.forEach(x=>{ get(x.o).forEach(r=>{ r.leads += 1; }); });
    return Object.values(m).sort((a,b)=>(b.leads-a.leads)||(b.clics-a.clics));
  };
  const parBouton = agg(cleBouton);
  const parProv = agg(o=>o.provenance, sousCanal);
  const LIB_SOUS = { site:"Lien en bio (site)", formulaire:"Formulaire" };
  const totClics = clicsP.reduce((s,c)=>s+(+c.n||0),0);
  const totSite = siteLeads.length;

  // Tous les leads de la période, par canal d'arrivée
  const canalOf = (l) => { const o=origineOf(l); return o ? (o.bouton==="formulaire" ? "formulaire:"+o.provenance : "site") : (l.source || (l.calendlyRdv?"calendly":(l.whatsappContact?"whatsapp":"manuel"))); };
  const CANAUX = { site:"🌐 Site solocimmo.fr", "formulaire:tiktok":"📱 Formulaire TikTok", "formulaire:instagram":"📸 Formulaire Instagram", calendly:"📅 Calendly", whatsapp:"💬 WhatsApp", manuel:"✍️ Manuel" };
  const parCanal = Object.entries(leadsP.reduce((m,l)=>{ const k=canalOf(l); m[k]=(m[k]||0)+1; return m; },{})).sort((a,b)=>b[1]-a[1]);

  const pct = (r) => r.clics>0 ? Math.round(r.leads/r.clics*100)+" %" : "—";
  const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const klab={fontSize:9,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".05em"};
  const kval={fontSize:24,fontWeight:800,marginTop:3};
  const titre=(t)=><div style={{fontSize:11,fontWeight:800,color:"var(--accent)",letterSpacing:".06em",textTransform:"uppercase",margin:"20px 0 10px"}}>{t}</div>;
  const Table=({rows,lib,taux})=>{
    // Barre = taux de conversion (leads ÷ clics), sur une échelle de 0 à 100 %
    const barre=(r)=> r.clics>0 ? Math.min(100, r.leads/r.clics*100) : 0;
    return rows.length===0
      ? <div style={{...card,fontSize:12.5,color:"var(--text3)",fontStyle:"italic"}}>Aucune donnée sur la période.</div>
      : <div style={{overflowX:"auto"}}><table className="list-table">
          <thead><tr><th></th><th style={{textAlign:"right"}}>Clics</th><th style={{textAlign:"right"}}>Leads</th><th style={{textAlign:"right"}}>Taux</th><th style={{width:"35%",fontSize:10,color:"var(--text3)",fontWeight:600,textAlign:"left"}}>taux de conversion (0 → 100 %)</th></tr></thead>
          <tbody>{rows.map(r=>{
            const sous = (r.sous && r.sous.formulaire) ? ["site","formulaire"].map(k=>r.sous[k]).filter(Boolean) : [];
            return <React.Fragment key={r.k}>
            <tr>
              <td className="td-name">{lib(r.k)}</td>
              <td style={{textAlign:"right"}}>{r.clics}</td>
              <td style={{textAlign:"right",fontWeight:700}}>{r.leads}</td>
              <td style={{textAlign:"right",fontWeight:700,color:"var(--accent)"}}>{pct(r)}</td>
              <td><div style={{background:"var(--surface2)",borderRadius:6,height:10,overflow:"hidden"}}><div style={{width:barre(r)+"%",height:"100%",background:"var(--accent)",borderRadius:6}}/></div></td>
            </tr>
            {sous.map((x,i)=>(
              <tr key={r.k+"_"+x.k} style={{background:"var(--surface2)"}}>
                <td style={{paddingLeft:22,fontSize:12,color:"var(--text2)"}}>{i===sous.length-1?"└":"├"} {LIB_SOUS[x.k]||x.k}</td>
                <td style={{textAlign:"right",fontSize:12}}>{x.clics}</td>
                <td style={{textAlign:"right",fontSize:12,fontWeight:700}}>{x.leads}</td>
                <td style={{textAlign:"right",fontSize:12,color:"var(--accent)"}}>{pct(x)}</td>
                <td><div style={{background:"var(--surface)",borderRadius:6,height:6,overflow:"hidden"}}><div style={{width:barre(x)+"%",height:"100%",background:"var(--accent-l2)",borderRadius:6}}/></div></td>
              </tr>))}
            </React.Fragment>;})}</tbody>
        </table></div>;
  };

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Statistiques</div>
          <div className="ps">D'où viennent les leads · {mode==="month"?moisLabel(selMonth):"vue globale"}</div>
        </div>
        <div className="tb-right">
          {mode==="month"&&<>
            <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={()=>decaleMois(-1)}><Ic n="chevL" s={15}/></button>
            <span style={{fontSize:13,fontWeight:700,minWidth:120,textAlign:"center"}}>{moisLabel(selMonth)}</span>
            <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={()=>decaleMois(1)}><Ic n="chevR" s={15}/></button>
          </>}
          <div className="seg" style={{flexShrink:0}}>
            <button type="button" className={"seg-btn"+(mode==="month"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>setMode("month")}>Ce mois</button>
            <button type="button" className={"seg-btn"+(mode==="total"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>setMode("total")}>Total</button>
          </div>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
          <div style={{...card,background:"var(--ardoise)",borderColor:"var(--ardoise)"}}>
            <div style={{...klab,color:"rgba(255,255,255,.55)"}}>Leads site + formulaires</div>
            <div className="brand-font" style={{...kval,color:"#fff"}}>{totSite}</div>
          </div>
          <div style={card}><div style={klab}>Clics site + formulaires</div><div className="brand-font" style={kval}>{totClics}</div></div>
          <div style={card}><div style={klab}>Taux de conversion</div><div className="brand-font" style={{...kval,color:"var(--accent)"}}>{totClics>0?Math.round(totSite/totClics*100)+" %":"—"}</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>leads ÷ clics</div></div>
          <div style={card}><div style={klab}>Tous les leads</div><div className="brand-font" style={kval}>{leadsP.length}</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>tous canaux</div></div>
        </div>
        {clicsErr&&<div style={{fontSize:12,color:"var(--red)",fontWeight:700,marginTop:10}}>⚠ Compteur de clics illisible : vérifie les règles Firestore de la collection « clics ».</div>}

        {titre("Par bouton (site + formulaires)")}
        <Table rows={parBouton} lib={libBouton} taux/>
        {titre("Par provenance")}
        <Table rows={parProv} lib={libProvenance} taux/>

        {titre("Tous les leads par canal")}
        <div style={card}>
          {parCanal.length===0&&<div style={{fontSize:12.5,color:"var(--text3)",fontStyle:"italic"}}>Aucun lead sur la période.</div>}
          {parCanal.map(([k,n])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
              <div style={{width:170,fontSize:12,color:"var(--text2)",fontWeight:600,flexShrink:0}}>{CANAUX[k]||(k.indexOf("formulaire:")===0?"📝 "+libBouton(k):k)}</div>
              <div style={{flex:1,background:"var(--surface2)",borderRadius:6,height:18,overflow:"hidden"}}><div style={{width:(n/Math.max(1,leadsP.length)*100)+"%",height:"100%",background:"var(--ardoise)",borderRadius:6}}/></div>
              <div style={{width:30,fontSize:12,fontWeight:800,textAlign:"right"}}>{n}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:10.5,color:"var(--text3)",marginTop:12,lineHeight:1.5}}>Les clics sont comptés depuis la mise en place du compteur sur le site (pas d'historique avant). Le taux = leads ÷ clics sur la période. « Ce mois » repart de zéro le 1er de chaque mois.</div>
      </div>
    </>
  );
}

// ─── RELEVÉ PURPLE → SOLOC' (PDF, réservé à Charles) ─────────────────────
// Tous les mouvements de l'onglet Finance, en HT : entrées encaissées par Purple pour Soloc',
// sorties réglées par Purple pour le compte de Soloc', et solde dû par Purple à Soloc'.
function generateRelevePurple(finance, leads){
  try {
    var A="#C1614F", D="#2C3E50", CR="#FBF7F0", BD="#E5D9C6", G="#9AA7B2", T2="#5A6B7B", VERT="#15803d", ROUGE="#b91c1c";
    var esc=function(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
    var eur=function(n){ return (Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; };
    var dte=function(iso){ if(!iso) return "—"; var d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("fr-FR"); };
    var mOf=function(f){ return f.monthKey||String(f.createdAt||"").slice(0,7); };
    var byDate=function(a,b){ return String(a.createdAt||"").localeCompare(String(b.createdAt||"")); };
    var leadById={}; (leads||[]).forEach(function(l){ leadById[l.id]=l; });
    var ins=finance.filter(function(f){ return f.type==="in" && !f.pending; }).sort(byDate);
    var outs=finance.filter(function(f){ return f.type==="out"; }).sort(byDate);
    var pend=finance.filter(function(f){ return f.type==="in" && f.pending; }).sort(byDate);
    var tIn=ins.reduce(function(s,f){return s+(f.amount||0);},0), tOut=outs.reduce(function(s,f){return s+(f.amount||0);},0), solde=tIn-tOut;
    var months=Array.from(new Set(finance.map(mOf))).filter(Boolean).sort();
    var first=months[0], last=months[months.length-1];
    var today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    var origine=function(f){ return f.source==="auto" ? "Dossier validé (CRM)" : "Saisie manuelle"; };
    var css="@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Poppins',Arial,sans-serif;color:"+D+";font-size:11px;background:#fff;}.page{max-width:800px;margin:0 auto;padding:28px 34px;}h2{font-size:13px;font-weight:800;color:"+A+";letter-spacing:.06em;text-transform:uppercase;margin:24px 0 8px;}table{width:100%;border-collapse:collapse;}th{background:"+CR+";color:"+T2+";font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:7px 8px;border-bottom:1.5px solid "+BD+";}td{padding:6px 8px;border-bottom:1px solid "+BD+";vertical-align:top;}td.r,th.r{text-align:right;white-space:nowrap;}tr.tot td{font-weight:800;background:"+CR+";border-top:1.5px solid "+D+";}.kpis{display:flex;gap:10px;margin-top:14px;}.kpi{flex:1;border:1px solid "+BD+";border-radius:10px;padding:10px 12px;}.kl{font-size:9px;font-weight:700;color:"+G+";text-transform:uppercase;letter-spacing:.06em;}.kv{font-size:18px;font-weight:800;margin-top:3px;}.due{background:"+D+";color:#fff;border-color:"+D+";}.due .kl{color:rgba(255,255,255,.6);}.note{font-size:10px;color:"+T2+";line-height:1.55;margin-top:8px;}.box{background:"+CR+";border:1px solid "+BD+";border-radius:10px;padding:12px 14px;line-height:1.6;font-size:11px;}tr{page-break-inside:avoid;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.page{padding:0;}}@page{margin:16mm 14mm;}";
    var h='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><title>Relevé Purple - Soloc\' - '+esc(today)+'</title><style>'+css+'</style></head><body><div class="page">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid '+A+';padding-bottom:14px;">'
      +'<div><img src="'+CLIENT_BASE_URL+'logo-soloc-couleur.svg" style="height:34px;display:block" alt="Soloc\'"/>'
      +'<div style="font-size:18px;font-weight:800;margin-top:12px;">Relevé des encaissements Soloc\' perçus par Purple</div>'
      +'<div style="font-size:11px;color:'+T2+';margin-top:2px;">Période : '+esc(monthLabel(first))+(last&&last!==first?' → '+esc(monthLabel(last)):'')+' · Montants hors taxes (HT)</div></div>'
      +'<div style="text-align:right;font-size:10.5px;color:'+T2+';line-height:1.6;">Établi le '+esc(today)+'<br/>À l\'attention de <b style="color:'+D+'">Rodolphe</b><br/>Directeur — Purple</div></div>';
    h+='<div class="box" style="margin-top:16px;">Depuis le lancement de Soloc\', les règlements des clients Soloc\' ont été <b>encaissés par Purple</b>. Ce relevé reprend <b>tous les mouvements</b> enregistrés dans le CRM Soloc\' (onglet Finance) afin de rapatrier ces sommes : chaque <b>entrée</b> (honoraires encaissés pour Soloc\') et chaque <b>sortie</b> (dépense réglée pour le compte de Soloc\'), mois par mois. Le <b>solde dû par Purple à Soloc\'</b> = total des entrées − total des sorties.</div>';
    h+='<div class="kpis"><div class="kpi"><div class="kl">Entrées encaissées (HT)</div><div class="kv" style="color:'+VERT+'">'+eur(tIn)+'</div><div class="note" style="margin-top:2px">'+ins.length+' encaissement'+(ins.length>1?'s':'')+'</div></div>'
      +'<div class="kpi"><div class="kl">Sorties réglées (HT)</div><div class="kv" style="color:'+ROUGE+'">'+eur(tOut)+'</div><div class="note" style="margin-top:2px">'+outs.length+' dépense'+(outs.length>1?'s':'')+'</div></div>'
      +'<div class="kpi due"><div class="kl">Solde dû par Purple à Soloc\' (HT)</div><div class="kv">'+eur(solde)+'</div><div class="note" style="margin-top:2px;color:rgba(255,255,255,.7)">entrées − sorties</div></div></div>';
    // Récap mensuel
    h+='<h2>1. Récapitulatif par mois</h2><table><thead><tr><th>Mois</th><th class="r">Entrées HT</th><th class="r">Sorties HT</th><th class="r">Solde du mois</th><th class="r">Cumul dû</th></tr></thead><tbody>';
    var cumul=0;
    months.forEach(function(mk){
      var i=ins.filter(function(f){return mOf(f)===mk;}).reduce(function(s,f){return s+(f.amount||0);},0);
      var o=outs.filter(function(f){return mOf(f)===mk;}).reduce(function(s,f){return s+(f.amount||0);},0);
      cumul+=i-o;
      h+='<tr><td><b>'+esc(monthLabel(mk))+'</b></td><td class="r" style="color:'+VERT+'">'+eur(i)+'</td><td class="r" style="color:'+ROUGE+'">'+eur(o)+'</td><td class="r"><b>'+eur(i-o)+'</b></td><td class="r">'+eur(cumul)+'</td></tr>';
    });
    h+='<tr class="tot"><td>TOTAL</td><td class="r">'+eur(tIn)+'</td><td class="r">'+eur(tOut)+'</td><td class="r">'+eur(solde)+'</td><td class="r">'+eur(solde)+'</td></tr></tbody></table>';
    // Détail par mois
    h+='<h2>2. Détail de tous les mouvements</h2>';
    months.forEach(function(mk){
      var mi=ins.filter(function(f){return mOf(f)===mk;}), mo=outs.filter(function(f){return mOf(f)===mk;});
      if(!mi.length && !mo.length) return;
      h+='<div style="font-size:12px;font-weight:800;margin:14px 0 6px;">'+esc(monthLabel(mk))+'</div>';
      h+='<table><thead><tr><th style="width:70px">Date</th><th>Libellé</th><th>Nature</th><th class="r">Entrée HT</th><th class="r">Sortie HT</th><th class="r">TTC encaissé</th></tr></thead><tbody>';
      mi.concat(mo).sort(byDate).forEach(function(f){
        var l=f.leadId?leadById[f.leadId]:null;
        var lib=esc(f.label||"—")+(l&&l.adresseBien?'<div style="font-size:9.5px;color:'+G+'">Bien : '+esc(l.adresseBien)+'</div>':'');
        h+='<tr><td>'+dte(f.createdAt)+'</td><td>'+lib+'</td><td style="color:'+T2+'">'+(f.type==="in"?origine(f):'Dépense')+'</td>'
          +'<td class="r" style="color:'+VERT+'">'+(f.type==="in"?eur(f.amount):'')+'</td><td class="r" style="color:'+ROUGE+'">'+(f.type==="out"?eur(f.amount):'')+'</td>'
          +'<td class="r" style="color:'+G+'">'+(f.type==="in"&&f.ttc?eur(f.ttc):'')+'</td></tr>';
      });
      var si=mi.reduce(function(s,f){return s+(f.amount||0);},0), so=mo.reduce(function(s,f){return s+(f.amount||0);},0);
      h+='<tr class="tot"><td colspan="3">Sous-total '+esc(monthLabel(mk))+' — solde '+eur(si-so)+'</td><td class="r">'+eur(si)+'</td><td class="r">'+eur(so)+'</td><td></td></tr></tbody></table>';
    });
    if(pend.length){
      h+='<h2>3. Dossiers validés au montant non renseigné (non inclus)</h2><table><thead><tr><th style="width:70px">Date</th><th>Libellé</th></tr></thead><tbody>';
      pend.forEach(function(f){ h+='<tr><td>'+dte(f.createdAt)+'</td><td>'+esc(f.label||"—")+'</td></tr>'; });
      h+='</tbody></table><div class="note">Ces dossiers sont validés mais leur montant n\'est pas encore saisi dans le CRM : ils ne sont pas comptés dans le solde ci-dessus.</div>';
    }
    h+='<div class="note" style="margin-top:22px;border-top:1px solid '+BD+';padding-top:10px;">Tous les montants sont exprimés <b>hors taxes</b>. La colonne « TTC encaissé » est indicative (TVA 20 %). Les sorties sont des dépenses réglées pour le compte de Soloc\' et viennent en déduction des entrées. Document généré depuis le CRM Soloc\' le '+esc(today)+'.</div>';
    h+='</div><script>window.onload=function(){setTimeout(function(){window.print();},700);}<\/script></body></html>';
    var w=window.open("","_blank");
    if(w){ w.document.write(h); w.document.close(); } else alert("Autorise les fenêtres pop-up pour générer le relevé.");
  } catch(err){ alert("Erreur : "+err.message); }
}

// ─── FINANCE PAGE (réservée à Charles) ───────────────────────────────────
function FinancePage({user, leads, addToast, isMobile}){
  const [financeRaw,setFinance]=useState([]);
  const [espace,setEspace]=useState("soloc"); // "soloc" | "purple"
  const [loading,setLoading]=useState(true);
  const [curMonth,setCurMonth]=useState(null);
  const [globalView,setGlobalView]=useState(false);
  const [formType,setFormType]=useState(null);
  const [fLabel,setFLabel]=useState("");
  const [fAmount,setFAmount]=useState("");
  const [fTtc,setFTtc]=useState(false);
  const [fDate,setFDate]=useState("");
  const [editId,setEditId]=useState(null);
  const creatingRef=useRef(new Set());
  const seededRef=useRef(false);

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"finance"),snap=>{
      setFinance(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>addToast("Erreur chargement finance","error"));
    return unsub;
  },[]);

  // Import auto des dossiers validés (une seule fois par lead via financeLogged)
  useEffect(()=>{
    if(loading) return;
    leads.filter(l=>l.column==="valide" && !l.financeLogged).forEach(l=>{
      if(creatingRef.current.has(l.id)) return;
      creatingRef.current.add(l.id);
      const info=prestationFromLead(l);
      const iso=l.validatedAt||nowISO();
      const entry={
        type:"in",
        label:"Client logé - "+l.name,
        amount:info.pending?0:round2(info.ttc/1.2),
        ttc:info.pending?null:info.ttc,
        pending:info.pending,
        source:"auto",
        leadId:l.id,
        createdAt:iso,
        monthKey:monthKeyFromISO(iso)
      };
      fsAddDoc(fsCollection(db,"finance"),entry)
        .then(()=>fsUpdateDoc(fsDocRef(db,"leads",l.id),{financeLogged:true}))
        .catch(()=>{creatingRef.current.delete(l.id);});
    });
  },[leads,loading]);

  // Seed unique des mouvements de juin 2026 (antérieurs à SOLOC) — ne s'exécute qu'une fois
  useEffect(()=>{
    if(loading || seededRef.current) return;
    if(financeRaw.some(f=>f.seedTag==="june2026")){ seededRef.current=true; return; }
    seededRef.current=true;
    const juneISO="2026-06-15T12:00:00.000Z";
    const base={ pending:false, source:"manuel", leadId:null, createdAt:juneISO, monthKey:"2026-06", seedTag:"june2026" };
    const items=[
      {...base, type:"in",  label:"Client logé - Juline MALEYSSON", amount:round2(890/1.2), ttc:890},
      {...base, type:"in",  label:"Client logé - Inès CHAMBON",     amount:round2(890/1.2), ttc:890},
      {...base, type:"out", label:"Commission Kevin (due)",      amount:889.98, ttc:null},
      {...base, type:"out", label:"Google Ads juin",             amount:365,    ttc:null},
      {...base, type:"out", label:"Flyers écoles",               amount:33.99,  ttc:null}
    ];
    Promise.all(items.map(it=>fsAddDoc(fsCollection(db,"finance"),it))).catch(()=>{seededRef.current=false;});
  },[loading,financeRaw]);

  // ── Soloc' (entité juridique depuis le 06/10/2026) / période Purple (avant) ──
  // Paramètres stockés dans finance/_parametres : début Soloc', créance Purple, régime TVA, charges fixes.
  const params = financeRaw.find(f=>f.id==="_parametres") || null;
  const paramsSeedRef=useRef(false);
  useEffect(()=>{
    if(loading || params || paramsSeedRef.current) return;
    paramsSeedRef.current=true;
    const debut="2026-10-06";
    // Dossiers validés mais pas encore payés : encaissés par Soloc' (même si validés avant)
    const aSoloc=financeRaw.filter(f=>f.type==="in" && f.leadId && leads.some(l=>l.id===f.leadId && !l.paid));
    aSoloc.forEach(f=>fsUpdateDoc(fsDocRef(db,"finance",f.id),{entite:"soloc"}).catch(()=>{}));
    fsSetDoc(fsDocRef(db,"finance","_parametres"),{
      type:"parametres", debutSoloc:debut,
      creancePurple:{montant:10818.34, recu:false, recuLe:null},
      tva:{regime:"franchise", depuis:null},
      chargesFixes:[
        {id:"comptable", label:"Expert-comptable", ttc:96,   taux:20, debut:"2026-10", fin:null},
        {id:"qonto",     label:"Banque Qonto",     ttc:13.2, taux:20, debut:"2026-10", fin:null}
      ]
    }).catch(()=>{paramsSeedRef.current=false;});
  },[loading,params,financeRaw,leads]);
  const P = params || {debutSoloc:"2026-10-06", creancePurple:{montant:10818.34,recu:false}, tva:{regime:"franchise"}, chargesFixes:[]};
  const saveParams=(upd)=>fsUpdateDoc(fsDocRef(db,"finance","_parametres"),upd).then(()=>addToast("✓ Enregistré")).catch(()=>addToast("Erreur","error"));
  const mouvements = financeRaw.filter(f=>f.type==="in"||f.type==="out");
  const entiteOf=(f)=> f.entite || (String(f.createdAt||"").slice(0,10) >= P.debutSoloc ? "soloc" : "purple");
  // Franchise de TVA : pas de TVA, on compte les montants réellement encaissés / payés (TTC).
  // Une fois assujetti (à partir de tva.depuis), les montants redeviennent HT.
  const enFranchise=(iso)=> (P.tva||{}).regime!=="assujetti" || (P.tva.depuis && String(iso||"").slice(0,10) < P.tva.depuis);
  const valeurSoloc=(f)=> enFranchise(f.createdAt) ? (f.ttc!=null ? f.ttc : (f.amount||0)) : (f.amount||0);
  const cash=(f)=> f.ttc!=null ? f.ttc : (f.amount||0);
  const curMK=todayKey().slice(0,7);
  const addMonth=(mk,n)=>{ const d=new Date(mk+"-01T12:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,7); };
  const chargesVirtuelles=[];
  asArray(P.chargesFixes).forEach(c=>{
    let mk=c.debut||P.debutSoloc.slice(0,7);
    const last=c.fin && c.fin<curMK ? c.fin : curMK;
    for(let i=0; mk<=last && i<120; i++, mk=addMonth(mk,1)){
      const iso=mk+"-01T08:00:00.000Z";
      const ttc=parseFloat(c.ttc)||0;
      chargesVirtuelles.push({id:"fx_"+c.id+"_"+mk, type:"out", label:c.label+" — charge fixe", ttc:ttc,
        amount:enFranchise(iso)?ttc:round2(ttc/(1+(parseFloat(c.taux)||0)/100)), createdAt:iso, monthKey:mk, source:"fixe", virtual:true});
    }
  });
  const solocMouv = mouvements.filter(f=>entiteOf(f)==="soloc");
  const finance = espace==="purple"
    ? mouvements.filter(f=>entiteOf(f)==="purple")
    : solocMouv.map(f=>({...f, amount:valeurSoloc(f)})).concat(chargesVirtuelles);
  const unite = espace==="soloc" && enFranchise(nowISO()) ? "" : " HT";
  // Trésorerie Soloc' : créance Purple reçue + encaissements − dépenses − charges fixes (montants réellement payés)
  const creance=P.creancePurple||{};
  const tresorerie=(creance.recu?(parseFloat(creance.montant)||0):0)
    + solocMouv.filter(f=>f.type==="in"&&!f.pending).reduce((x,f)=>x+cash(f),0)
    - solocMouv.filter(f=>f.type==="out").reduce((x,f)=>x+cash(f),0)
    - chargesVirtuelles.reduce((x,f)=>x+f.ttc,0);
  // Franchise en base de TVA (prestations de services) : 37 500 € (seuil), 41 250 € (seuil majoré)
  const SEUIL_TVA=37500, SEUIL_TVA_MAJ=41250;
  const annee=String(new Date().getFullYear());
  const caAnnee=solocMouv.filter(f=>f.type==="in"&&!f.pending&&String(f.createdAt||"").slice(0,4)===annee).reduce((x,f)=>x+cash(f),0);
  const pctTva=Math.min(100,caAnnee/SEUIL_TVA_MAJ*100);
  const chargesActives=asArray(P.chargesFixes).filter(c=>!c.fin||c.fin>=curMK);
  const totalFixes=chargesActives.reduce((x,c)=>x+(parseFloat(c.ttc)||0),0);
  const seuilDossiers=totalFixes>0?Math.ceil(totalFixes/PANIER_MOYEN_TTC):0;
  const recevoirPurple=()=>{
    const d=prompt("Date de réception du paiement de Purple (AAAA-MM-JJ) :",todayKey());
    if(d===null) return;
    saveParams({creancePurple:{...creance, recu:true, recuLe:d||todayKey()}});
  };
  const ajouterCharge=()=>{
    const label=prompt("Nom de la charge fixe (ex. Assurance RC Pro) :"); if(!label) return;
    const v=parseFloat(String(prompt("Montant TTC par mois (€) :")||"").replace(",","."));
    if(!v) return;
    saveParams({chargesFixes:[...asArray(P.chargesFixes),{id:"c"+Date.now(), label:label.trim(), ttc:v, taux:20, debut:curMK, fin:null}]});
  };
  const modifierCharge=(c)=>{
    const v=prompt("Nouveau montant TTC par mois pour « "+c.label+" » (€) :",String(c.ttc));
    if(v===null) return; const n=parseFloat(String(v).replace(",",".")); if(isNaN(n)) return;
    saveParams({chargesFixes:asArray(P.chargesFixes).map(x=>x.id===c.id?{...x,ttc:n}:x)});
  };
  const arreterCharge=(c)=>{
    if(!confirm("Arrêter « "+c.label+" » ? Elle ne sera plus comptée à partir du mois prochain (l'historique reste).")) return;
    saveParams({chargesFixes:asArray(P.chargesFixes).map(x=>x.id===c.id?{...x,fin:curMK}:x)});
  };
  const passerTva=()=>{
    const d=prompt("Date à partir de laquelle Soloc' facture la TVA (AAAA-MM-JJ) :",todayKey());
    if(!d) return;
    saveParams({tva:{regime:"assujetti", depuis:d}});
  };

  const fMonth=(f)=>f.monthKey||monthKeyFromISO(f.createdAt);
  const sumIn=(arr)=>arr.filter(f=>f.type==="in").reduce((s,f)=>s+(f.amount||0),0);
  const sumOut=(arr)=>arr.filter(f=>f.type==="out").reduce((s,f)=>s+(f.amount||0),0);

  const currentMK=todayKey().slice(0,7);
  const monthsPresent=Array.from(new Set(finance.map(fMonth)));
  const months=Array.from(new Set(monthsPresent.concat([currentMK]))).sort();
  useEffect(()=>{ if(curMonth===null && months.length) setCurMonth(months[months.length-1]); },[months,curMonth]);
  const activeMonth=curMonth||currentMK;

  const view=globalView?finance:finance.filter(f=>fMonth(f)===activeMonth);
  const globIn=sumIn(finance), globOut=sumOut(finance);
  const vin=sumIn(view), vout=sumOut(view);
  const maxNet=Math.max.apply(null,months.map(mk=>Math.abs(sumIn(finance.filter(f=>fMonth(f)===mk))-sumOut(finance.filter(f=>fMonth(f)===mk)))).concat([1]));

  const prevMonth=()=>{ const i=months.indexOf(activeMonth); if(i>0){setGlobalView(false);setCurMonth(months[i-1]);} };
  const nextMonth=()=>{ const i=months.indexOf(activeMonth); if(i<months.length-1){setGlobalView(false);setCurMonth(months[i+1]);} };

  const openForm=(type)=>{ setEditId(null); setFormType(type); setFTtc(type==="in"); setFLabel(""); setFAmount(""); setFDate(""); };
  const openEdit=(f)=>{ setEditId(f.id); setFormType(f.type); setFLabel(f.label||""); setFAmount(String(f.amount||0)); setFTtc(false); setFDate(f.createdAt?String(f.createdAt).slice(0,10):""); };
  const closeForm=()=>{ setFormType(null); setEditId(null); };
  const save=()=>{
    const lbl=fLabel.trim(); const v=parseFloat(fAmount)||0;
    if(!lbl||!v){ addToast("Renseigne un libellé et un montant","error"); return; }
    const amountHT = fTtc ? round2(v/1.2) : round2(v);
    const iso = fDate ? new Date(fDate+"T12:00:00").toISOString() : nowISO();
    const payload = { type:formType, label:lbl, amount:amountHT, ttc:fTtc?v:null, pending:false, createdAt:iso, monthKey:monthKeyFromISO(iso) };
    if(editId){
      fsUpdateDoc(fsDocRef(db,"finance",editId), payload)
        .then(()=>{ closeForm(); addToast("✓ Mouvement modifié"); })
        .catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"finance"), {...payload, source:"manuel", leadId:null})
        .then(()=>{ closeForm(); addToast("✓ Mouvement ajouté"); })
        .catch(()=>addToast("Erreur d'ajout","error"));
    }
  };
  const del=(f)=>{
    if(!confirm("Supprimer ce mouvement ?")) return;
    fsDeleteDoc(fsDocRef(db,"finance",f.id)).then(()=>addToast("Mouvement supprimé")).catch(()=>addToast("Erreur","error"));
  };
  const complete=(f)=>{
    const raw=prompt("Montant de la prestation en TTC ? (converti en HT ÷1,2)");
    if(raw===null) return;
    const v=parseFloat(String(raw).replace(",","."))||0;
    if(!v) return;
    fsUpdateDoc(fsDocRef(db,"finance",f.id),{amount:Math.round(v/1.2), ttc:v, pending:false})
      .then(()=>addToast("✓ Montant renseigné")).catch(()=>addToast("Erreur","error"));
  };

  const cardStyle={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const htPreview = (fTtc&&fAmount) ? ("= "+eurFmt((parseFloat(fAmount)||0)/1.2)+" HT") : "";

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Finance</div>
          <div className="ps">{espace==="purple"?"Période Purple (avant le "+fmtDate(P.debutSoloc)+") — montants HT":(enFranchise(nowISO())?"Soloc' — franchise de TVA : montants réellement encaissés / payés (pas de TVA)":"Soloc' — montants HT")}</div>
        </div>
        <div className="tb-right">
          <div className="seg" style={{flexShrink:0}}>
            <button type="button" className={"seg-btn"+(espace==="soloc"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>{setEspace("soloc");setCurMonth(null);}}>Soloc'</button>
            <button type="button" className={"seg-btn"+(espace==="purple"?" active":"")} style={{whiteSpace:"nowrap"}} onClick={()=>{setEspace("purple");setCurMonth(null);}}>Période Purple</button>
          </div>
          {espace==="purple"&&<button className="btn btn-g" disabled={loading} onClick={()=>generateRelevePurple(finance,leads)} title="Relevé détaillé HT de tout ce que Purple a encaissé pour Soloc'"><Ic n="fileText" s={13}/>Relevé Purple (PDF)</button>}
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading?(
          <div className="empty-state"><div className="es-t">Chargement…</div></div>
        ):(
          <>
            {espace==="soloc"&&(
              <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:12,marginBottom:18}}>
                {/* Trésorerie + créance Purple */}
                <div style={{...cardStyle,background:"var(--ardoise)",borderColor:"var(--ardoise)",color:"#fff"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.55)",textTransform:"uppercase",letterSpacing:".06em"}}>Trésorerie Soloc'</div>
                  <div className="brand-font" style={{fontSize:28,fontWeight:800,marginTop:4}}>{eurFmt(tresorerie)}</div>
                  <div style={{fontSize:10.5,color:"rgba(255,255,255,.6)",marginTop:2}}>créance Purple reçue + encaissements − dépenses − charges fixes</div>
                  <div style={{marginTop:12,background:"rgba(255,255,255,.08)",borderRadius:10,padding:"10px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                    <div>
                      <div style={{fontSize:11,fontWeight:700}}>Paiement de Purple : {eurFmt(creance.montant||0)} TTC</div>
                      <div style={{fontSize:10.5,color:creance.recu?"#86efac":"#fcd34d",marginTop:2}}>{creance.recu?"✓ Reçu le "+fmtDate(creance.recuLe):"⏳ En attente de paiement — non compté dans la trésorerie"}</div>
                    </div>
                    {!creance.recu&&<button className="btn btn-p btn-sm" onClick={recevoirPurple}>Marquer reçu</button>}
                  </div>
                </div>
                {/* Franchise de TVA */}
                <div style={cardStyle}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                    <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".06em"}}>Franchise de TVA {annee}</div>
                    <div style={{fontSize:10,color:"var(--text3)"}}>{enFranchise(nowISO())?"en franchise":"assujetti depuis le "+fmtDate(P.tva.depuis)}</div>
                  </div>
                  <div className="brand-font" style={{fontSize:22,fontWeight:800,marginTop:4,color:caAnnee>=SEUIL_TVA_MAJ?"var(--red)":caAnnee>=SEUIL_TVA?"#c2410c":"var(--text)"}}>{eurFmt(caAnnee)} <span style={{fontSize:12,color:"var(--text3)",fontWeight:600}}>/ {eurFmt(SEUIL_TVA)}</span></div>
                  <div style={{position:"relative",height:12,background:"var(--surface2)",borderRadius:20,marginTop:8,overflow:"hidden"}}>
                    <div style={{width:pctTva+"%",height:"100%",borderRadius:20,background:caAnnee>=SEUIL_TVA_MAJ?"var(--red)":caAnnee>=SEUIL_TVA*0.8?"#f59e0b":"var(--green)"}}/>
                    <div style={{position:"absolute",top:0,bottom:0,left:(SEUIL_TVA/SEUIL_TVA_MAJ*100)+"%",width:2,background:"var(--ardoise)"}} title="Seuil 37 500 €"/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:9.5,color:"var(--text3)",marginTop:3}}><span>0 €</span><span>seuil 37 500 €</span><span>41 250 €</span></div>
                  <div style={{fontSize:11,color:"var(--text2)",marginTop:8,lineHeight:1.5}}>
                    {caAnnee<SEUIL_TVA
                      ? <>Encore <b>{eurFmt(SEUIL_TVA-caAnnee)}</b> d'encaissements avant le seuil. Pas de TVA à facturer.</>
                      : caAnnee<SEUIL_TVA_MAJ
                      ? <><b>Seuil de 37 500 € dépassé</b> : franchise conservée cette année tant que tu restes sous 41 250 €, TVA à facturer à partir du 1er janvier.</>
                      : <><b style={{color:"var(--red)"}}>41 250 € dépassés</b> : TVA à facturer dès le jour du dépassement.</>}
                  </div>

function NewsletterModal({entry, onSave, onClose}){
  const [form,setForm]=useState(()=>({
    firstName:entry&&entry.firstName||"", lastName:entry&&entry.lastName||"",
    email:entry&&entry.email||"", phone:entry&&entry.phone||"",
    typologie:asArray(entry&&entry.typologie), budgetMax:entry&&entry.budgetMax||"",
    surfaceMin:entry&&entry.surfaceMin||"", secteur:entry&&entry.secteur||"",
    statutClient:entry&&entry.statutClient||"", periodeEssaiValidee:entry&&entry.periodeEssaiValidee!==undefined?entry.periodeEssaiValidee:null, nbColoc:entry&&entry.nbColoc||2
  }));
  const [err,setErr]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const toggleTypo=(t)=>setForm(p=>{ const cur=asArray(p.typologie); return {...p,typologie:cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]}; });
  const submit=()=>{
    if(!form.firstName.trim()&&!form.lastName.trim()){setErr("Renseigne un prénom ou un nom.");return;}
    if(!form.phone.trim()&&!form.email.trim()){setErr("Renseigne un téléphone ou un email.");return;}
    if(!form.statutClient){setErr("Choisis le profil (il détermine les honoraires).");return;}
    onSave(form);
  };
  const hono=form.statutClient?honoForProfile(form.statutClient,form):null;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{entry?"Modifier le contact":"Ajouter à la newsletter"}</div>
        {err&&<div className="ferr">{err}</div>}
        <div className="fr">
          <div className="fg"><label className="fl">Prénom</label><input className="fi" autoFocus value={form.firstName} onChange={e=>set("firstName",e.target.value)}/></div>
          <div className="fg"><label className="fl">NOM</label><input className="fi" value={form.lastName} onChange={e=>set("lastName",e.target.value)}/></div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
          <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>
        </div>
        <div className="modal-section">Profil — détermine les honoraires *</div>
        <div className="fg">
          <select className="fi" value={form.statutClient} onChange={e=>set("statutClient",e.target.value)}>
            <option value="">— Choisir un profil —</option>
            {STATUTS.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        {form.statutClient==="CDI"&&(
          <div className="fg">
            <label className="fl">Période d'essai validée ?</label>
            <div className="seg">
              <button type="button" className={"seg-btn"+(form.periodeEssaiValidee===true?" active":"")} onClick={()=>set("periodeEssaiValidee",true)}>Oui (990 €)</button>
              <button type="button" className={"seg-btn"+(form.periodeEssaiValidee===false?" active":"")} onClick={()=>set("periodeEssaiValidee",false)}>Non (1090 €)</button>
            </div>
          </div>
        )}
        {form.statutClient==="Colocation"&&(
          <div className="fg"><label className="fl">Nombre de colocataires</label><input className="fi" type="number" min="2" value={form.nbColoc} onChange={e=>set("nbColoc",e.target.value)}/></div>
        )}
        {hono!==null&&<div style={{fontSize:12,fontWeight:700,color:"var(--accent)",marginBottom:10}}>Honoraires SOLOC' pour ce profil : {hono.toLocaleString("fr-FR")} €</div>}
        <div className="modal-section">Critères de recherche</div>
        <div className="fg">
          <label className="fl">Typologie — plusieurs possibles</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {TYPOLOGIES.map(t=>{
              const active=asArray(form.typologie).includes(t);
              return <button key={t} type="button" onClick={()=>toggleTypo(t)}
                style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:active?"var(--accent)":"var(--border2)",background:active?"var(--accent-l)":"var(--surface2)",color:active?"var(--accent-d)":"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>{t}</button>;
            })}
          </div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Budget max (€)</label><input className="fi" type="number" value={form.budgetMax} onChange={e=>set("budgetMax",e.target.value)}/></div>
          <div className="fg"><label className="fl">Surface min (m²)</label><input className="fi" type="number" value={form.surfaceMin} onChange={e=>set("surfaceMin",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Secteur</label><input className="fi" value={form.secteur} onChange={e=>set("secteur",e.target.value)}/></div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={submit}><Ic n="check" s={13}/>{entry?"Enregistrer":"Ajouter"}</button>
        </div>
      </div>
    </div>
  );
}

function NewsletterPage({user, rows, addToast}){
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);

  const save=(form)=>{
    const name=[form.firstName.trim(),form.lastName.trim()].filter(Boolean).join(" ");
    const data={ firstName:form.firstName, lastName:form.lastName, name, email:form.email, phone:form.phone,
      typologie:asArray(form.typologie), budgetMax:form.budgetMax, surfaceMin:form.surfaceMin, secteur:form.secteur,
      statutClient:form.statutClient||"", periodeEssaiValidee:(form.periodeEssaiValidee!=null?form.periodeEssaiValidee:null), nbColoc:form.nbColoc||2 };
    if(modal&&modal.type==="edit"){
      fsUpdateDoc(fsDocRef(db,"newsletter",modal.entry.id),data).then(()=>{addToast("✓ Contact mis à jour");setModal(null);}).catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"newsletter"),{...data,createdAt:nowISO()}).then(()=>{addToast("✓ Ajouté à la newsletter");setModal(null);}).catch(()=>addToast("Erreur","error"));
    }
  };
  const del=(entry)=>{
    if(!confirm("Supprimer "+entry.name+" de la newsletter ?")) return;
    fsDeleteDoc(fsDocRef(db,"newsletter",entry.id)).then(()=>addToast("Contact supprimé")).catch(()=>addToast("Erreur","error"));
  };

  const q=search.toLowerCase();
  const filtered=(rows||[]).filter(r=>!q||(r.name||"").toLowerCase().includes(q)||(r.email||"").toLowerCase().includes(q)||(r.phone||"").includes(q)||asArray(r.typologie).join(",").toLowerCase().includes(q)||(r.secteur||"").toLowerCase().includes(q));

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Newsletter</div>
          <div className="ps">{(rows||[]).length} contact{(rows||[]).length!==1?"s":""} — base de diffusion des biens</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {filtered.length===0?(
          <div className="empty-state">
            <div className="es-ic">📣</div>
            <div className="es-t">Aucun contact newsletter</div>
            <div>Ajoute des contacts ici, ou depuis la fiche d'un lead avec « Ajouter à la newsletter ».</div>
          </div>
        ):(
          <div style={{overflowX:"auto"}}>
          <table className="list-table">
            <thead><tr>
              <th>Nom</th><th>Profil</th><th>Téléphone</th><th>Email</th><th>Typologie</th><th>Budget max</th><th>Surface min</th><th>Secteur</th><th style={{width:80}}></th>
            </tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td className="td-name">{r.name}</td>
                  <td>{r.statutClient?<span style={{fontSize:12}}>{r.statutClient} · <b style={{color:"var(--accent)"}}>{honoForProfile(r.statutClient,r)} €</b></span>:<span style={{color:"var(--text3)",fontSize:11}}>—</span>}</td>
                  <td>{r.phone||"—"}</td>
                  <td>{r.email||"—"}</td>
                  <td>{asArray(r.typologie).join(", ")||"—"}</td>
                  <td>{r.budgetMax?r.budgetMax+"€":"—"}</td>
                  <td>{r.surfaceMin?r.surfaceMin+"m²":"—"}</td>
                  <td>{r.secteur||"—"}</td>
                  <td style={{whiteSpace:"nowrap"}}>
                    <button className="ib" onClick={()=>setModal({type:"edit",entry:r})} title="Modifier"><Ic n="edit" s={14}/></button>
                    <button className="ib" style={{color:"var(--text3)"}} onClick={()=>del(r)} title="Supprimer"><Ic n="trash" s={14}/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
      {modal&&<NewsletterModal entry={modal.type==="edit"?modal.entry:null} onSave={save} onClose={()=>setModal(null)}/>}
    </>
  );
}
