// ─── TODO PAGE (v3 — priorités + envoi Emmy) ─────────────────────────────
function TodoPage({user,addToast}){
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [newText,setNewText]=useState("");
  const [newPri,setNewPri]=useState("normale");
  const [showDone,setShowDone]=useState(false);
  const [sending,setSending]=useState(false);

  const myName = displayNameFromEmail(user.email);
  const isCharles = user.email===FINANCE_EMAIL;

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"todos"),snap=>{
      setTasks(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>addToast("Erreur chargement to-do","error"));
    return unsub;
  },[]);

  const isToday=(iso)=>{ if(!iso) return false; const d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); };

  const openTasks = tasks.filter(t=>!t.done).sort((a,b)=>{
    const r=priOf(a).rank-priOf(b).rank;
    return r!==0 ? r : new Date(a.createdAt||0)-new Date(b.createdAt||0);
  });
  const doneTasks = tasks.filter(t=>t.done).sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  const doneCount = doneTasks.length;
  const doneToday = tasks.filter(t=>t.done && isToday(t.doneAt)).length;

  const counts={urgent:0,prioritaire:0,normale:0,basse:0};
  openTasks.forEach(t=>{ counts[(t.priority)||"normale"]=(counts[(t.priority)||"normale"]||0)+1; });

  const addTask=()=>{
    const text=newText.trim();
    if(!text) return;
    fsAddDoc(fsCollection(db,"todos"),{
      text, done:false, priority:newPri, createdBy:myName, createdAt:nowISO(), doneAt:null
    }).then(()=>{setNewText("");}).catch(()=>addToast("Erreur d'ajout","error"));
  };

  const toggleTask=(t)=>{
    const willDone=!t.done;
    fsUpdateDoc(fsDocRef(db,"todos",t.id),{done:willDone, doneAt:willDone?nowISO():null})
      .catch(()=>addToast("Erreur","error"));
  };

  const cyclePriority=(t)=>{
    const i=PRIORITY_ORDER.indexOf((t.priority)||"normale");
    const next=PRIORITY_ORDER[(i+1)%PRIORITY_ORDER.length];
    fsUpdateDoc(fsDocRef(db,"todos",t.id),{priority:next}).catch(()=>addToast("Erreur","error"));
  };

  const deleteTask=(t)=>{
    if(!confirm("Supprimer cette tâche ?")) return;
    fsDeleteDoc(fsDocRef(db,"todos",t.id))
      .then(()=>addToast("Tâche supprimée"))
      .catch(()=>addToast("Erreur de suppression","error"));
  };

  const sendToEmmy=()=>{
    if(!EMMY_MAIL_WEBAPP_URL){ addToast("Envoi non configuré (URL manquante)","error"); return; }
    if(openTasks.length===0){ addToast("Aucune tâche à envoyer","error"); return; }
    setSending(true);
    addToast("Envoi de la to-do à Emmy…");
    fetch(EMMY_MAIL_WEBAPP_URL,{method:"POST",mode:"no-cors"})
      .then(()=>{ setTimeout(()=>{ setSending(false); addToast("✓ To-do envoyée à Emmy"); },700); })
      .catch(()=>{ setSending(false); addToast("Erreur d'envoi","error"); });
  };

  const OpenRow=({t})=>{
    const pr=priOf(t);
    const overdue=Math.floor(daysSince(t.createdAt))>=3;
    const showBorder = t.priority==="urgent"||t.priority==="prioritaire";
    const showChip = t.priority==="urgent"||t.priority==="prioritaire"||t.priority==="basse";
    return(
      <div className="todo-item" style={showBorder?{borderLeft:"3px solid "+pr.color}:{}}>
        <div className="todo-checkbox" onClick={()=>toggleTask(t)}></div>
        <button className="ib" style={{color:pr.color,padding:2,flexShrink:0}} title="Changer la priorité" onClick={()=>cyclePriority(t)}><Ic n="flag" s={16}/></button>
        <div className="todo-item-body">
          <div className="todo-item-text">{t.text}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {overdue&&<span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:"var(--orange-bg)",color:"#92400e",whiteSpace:"nowrap"}}>depuis {Math.floor(daysSince(t.createdAt))}j</span>}
          {showChip&&<span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:pr.bg,color:pr.fg,whiteSpace:"nowrap"}}>{pr.label}</span>}
          <button className="todo-item-del" onClick={()=>deleteTask(t)} title="Supprimer"><Ic n="trash" s={14}/></button>
        </div>
      </div>
    );
  };

  const DoneRow=({t})=>(
    <div className="todo-item done">
      <div className="todo-checkbox checked" onClick={()=>toggleTask(t)}><Ic n="check" s={13}/></div>
      <div className="todo-item-body">
        <div className="todo-item-text">{t.text}</div>
      </div>
      <button className="todo-item-del" onClick={()=>deleteTask(t)} title="Supprimer"><Ic n="trash" s={14}/></button>
    </div>
  );

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">To-do</div>
          <div className="ps">Les tâches restent affichées tant qu'elles ne sont pas cochées</div>
        </div>
        <div className="tb-right">
          {isCharles&&<button className="btn btn-p" onClick={sendToEmmy} disabled={sending}><Ic n="mail" s={14}/>{sending?"Envoi…":"Envoyer à Emmy"}</button>}
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading?(
          <div className="empty-state"><div className="es-t">Chargement…</div></div>
        ):(
          <>
            <div className="todo-progress-card">
              <div className="todo-progress-top">
                <span className="todo-progress-label">{openTasks.length} tâche{openTasks.length!==1?"s":""} à faire</span>
                <span style={{fontSize:11,color:"var(--green)",fontWeight:700}}>{doneToday} terminée{doneToday!==1?"s":""} aujourd'hui</span>
              </div>
              <div style={{display:"flex",height:10,borderRadius:20,overflow:"hidden",background:"var(--surface2)"}}>
                {openTasks.length===0
                  ? <div style={{flex:1,background:"var(--green)"}}/>
                  : PRIORITY_ORDER.map(k=> counts[k]>0 ? <div key={k} style={{flex:counts[k],background:PRIORITIES[k].color}}/> : null)}
              </div>
              <div style={{display:"flex",gap:14,marginTop:8,fontSize:10,color:"var(--text3)",fontWeight:600,flexWrap:"wrap"}}>
                {PRIORITY_ORDER.map(k=>(
                  <span key={k}><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:PRIORITIES[k].color,marginRight:4}}/>{PRIORITIES[k].label}</span>
                ))}
              </div>
            </div>

            <div className="todo-add-row">
              <input className="fi" placeholder="Nouvelle tâche…" value={newText}
                onChange={e=>setNewText(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")addTask();}}/>
              <button className="btn btn-p" onClick={addTask}><Ic n="plus" s={13}/>Ajouter</button>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:"var(--text3)",fontWeight:600}}>Priorité :</span>
              {PRIORITY_ORDER.map(k=>{
                const on=newPri===k;
                return <button key={k} type="button" onClick={()=>setNewPri(k)} style={{padding:"5px 11px",borderRadius:8,border:"1.5px solid",borderColor:on?PRIORITIES[k].color:"var(--border2)",background:on?PRIORITIES[k].color:"var(--surface2)",color:on?"#fff":"var(--text2)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>{PRIORITIES[k].label}</button>;
              })}
            </div>

            <div style={{fontSize:10,fontWeight:800,color:"var(--accent)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:10}}>À faire</div>
            {openTasks.length===0?(
              <div className="todo-empty">Tout est fait. Rien à faire pour le moment.</div>
            ):(
              <div className="todo-list">
                {openTasks.map(t=><OpenRow key={t.id} t={t}/>)}
              </div>
            )}

            <div className="todo-history-toggle" onClick={()=>setShowDone(s=>!s)}>
              <Ic n={showDone?"chevDown":"chevR"} s={13}/>
              Terminées ({doneCount})
            </div>
            {showDone&&(
              doneCount===0?(
                <div className="todo-empty">Aucune tâche terminée.</div>
              ):(
                <div className="todo-list">
                  {doneTasks.map(t=><DoneRow key={t.id} t={t}/>)}
                </div>
              )
            )}
          </>
        )}
      </div>
    </>
  );
}

// ─── PILOTAGE (réservé à Charles) ────────────────────────────────────────
function PilotagePage({user, leads}){
  const [selMonth,setSelMonth]=useState(todayKey().slice(0,7));
  const mkOf=(iso)=>iso?String(iso).slice(0,7):"";
  const objOf=(mk)=>OBJECTIFS_MENSUELS[mk.slice(5,7)]||0;
  const mLabel=(mk)=>{ if(!mk) return "—"; const p=mk.split("-"); return MOIS_FR[(+p[1])-1]+" "+p[0]; };
  const eur=(n)=>Math.round(n).toLocaleString("fr-FR")+" €";

  const valides=leads.filter(l=>l.column==="valide");
  const signesMois=(mk)=>valides.filter(l=>mkOf(l.validatedAt||l.lastActivity)===mk).length;
  const recusMois=(mk)=>leads.filter(l=>mkOf(l.createdAt)===mk).length;

  const totalLeads=leads.length;
  const signesTotal=valides.length;
  const tauxConv=totalLeads>0?(signesTotal/totalLeads):0;
  const enCours=leads.filter(l=>l.column!=="valide"&&l.column!=="sans_suite").length;

  const sigCur=signesMois(selMonth);
  const objCur=objOf(selMonth);
  const recusCur=recusMois(selMonth);
  const prevMk=(()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const recusPrev=recusMois(prevMk);
  const leadsNeeded=tauxConv>0?Math.round(objCur/tauxConv):null;
  const gapLeads=leadsNeeded!=null?(leadsNeeded-recusCur):null;

  const caReal=sigCur*PANIER_MOYEN_TTC;
  const caObj=objCur*PANIER_MOYEN_TTC;

  const funnel=PIPELINE_COLS.map(c=>({...c,n:leads.filter(l=>l.column===c.id).length}));
  const maxF=Math.max(1,...funnel.map(f=>f.n));

  const CYCLE_START = "2026-09-01T00:00:00";
  const afterStart=(iso)=>iso && new Date(iso)>=new Date(CYCLE_START);
  const months12=["2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07","2027-08"];
  const sigByMonth=months12.map(mk=>({mk,n:signesMois(mk),obj:objOf(mk)}));
  const maxSig=Math.max(1,...sigByMonth.map(s=>Math.max(s.n,s.obj)));

  const perf=(role)=>({sig:valides.filter(l=>l.assignedTo===role && afterStart(l.validatedAt||l.lastActivity)).length, tot:leads.filter(l=>l.assignedTo===role && afterStart(l.createdAt)).length});
  const emmyP=perf("emmy"), ayaP=perf("aya");
  const maxTeam=Math.max(1,emmyP.tot,ayaP.tot);
  const durations=valides.filter(l=>afterStart(l.validatedAt)).map(l=>{ if(!l.createdAt||!l.validatedAt) return null; return (new Date(l.validatedAt)-new Date(l.createdAt))/86400000; }).filter(x=>x!=null&&x>=0);
  const avgDays=durations.length?Math.round(durations.reduce((s,x)=>s+x,0)/durations.length):null;

  const prevMonth=()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()-1); setSelMonth(d.toISOString().slice(0,7)); };
  const nextMonth=()=>{ const d=new Date(selMonth+"-01T12:00:00"); d.setMonth(d.getMonth()+1); setSelMonth(d.toISOString().slice(0,7)); };

  const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const klab={fontSize:9,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".05em"};
  const kval={fontSize:24,fontWeight:800,marginTop:3};

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Pilotage</div>
          <div className="ps">Objectifs internes · panier moyen {PANIER_MOYEN_TTC} € TTC</div>
        </div>
        <div className="tb-right">
          <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={prevMonth}><Ic n="chevL" s={15}/></button>
          <span style={{fontSize:13,fontWeight:700,minWidth:120,textAlign:"center"}}>{mLabel(selMonth)}</span>
          <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={nextMonth}><Ic n="chevR" s={15}/></button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
          <div style={{...card,background:"var(--ardoise)",borderColor:"var(--ardoise)"}}>
            <div style={{...klab,color:"rgba(255,255,255,.55)"}}>Signés ce mois</div>
            <div className="brand-font" style={{...kval,color:"#fff"}}>{sigCur}<span style={{fontSize:15,color:"rgba(255,255,255,.5)"}}>/{objCur}</span></div>
            <div style={{height:5,background:"rgba(255,255,255,.15)",borderRadius:20,marginTop:6,overflow:"hidden"}}><div style={{width:Math.min(100,objCur?sigCur/objCur*100:0)+"%",height:"100%",background:"var(--green)"}}/></div>
          </div>
          <div style={card}><div style={klab}>Taux de conversion</div><div className="brand-font" style={{...kval,color:"var(--accent)"}}>{Math.round(tauxConv*100)}%</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>signés ÷ total leads</div></div>
          <div style={card}><div style={klab}>Leads reçus (mois)</div><div className="brand-font" style={kval}>{recusCur}</div><div style={{fontSize:10,color:recusCur>=recusPrev?"var(--green)":"var(--red)",marginTop:2}}>{recusCur>=recusPrev?"+":""}{recusCur-recusPrev} vs {mLabel(prevMk).split(" ")[0]}</div></div>
          <div style={card}><div style={klab}>En cours (pipeline)</div><div className="brand-font" style={kval}>{enCours}</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>leads actifs</div></div>
        </div>

        {/* INSIGHT leads nécessaires */}
        <div style={{background:"var(--accent-l)",border:"1.5px solid var(--accent-l2)",borderRadius:12,padding:"14px 16px",marginTop:14,display:"flex",alignItems:"center",gap:14}}>
          <div style={{fontSize:26}}>🎯</div>
          <div style={{fontSize:13,color:"var(--accent-d)",lineHeight:1.5}}>
            {tauxConv>0
              ? <>À <b>{Math.round(tauxConv*100)}% de conversion</b>, pour atteindre <b>{objCur} signé{objCur>1?"s":""}</b> en {mLabel(selMonth).split(" ")[0]} il te faut <b>~{leadsNeeded} leads</b>. Tu en as reçu <b>{recusCur}</b> → {gapLeads>0?<span style={{fontWeight:700}}>il t'en manque ~{gapLeads}.</span>:<span style={{fontWeight:700,color:"var(--green)"}}>objectif de volume atteint ✓</span>}</>
              : <>Pas encore assez de données pour calculer le taux de conversion. Il se précisera à mesure que des dossiers se signent.</>}
          </div>
        </div>

        {/* ENTONNOIR */}
        <div style={{fontSize:11,fontWeight:800,color:"var(--accent)",letterSpacing:".06em",textTransform:"uppercase",margin:"18px 0 10px"}}>Entonnoir — où sont les leads</div>
        <div style={card}>
          {funnel.map(f=>(
            <div key={f.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
              <div style={{width:110,fontSize:11,color:"var(--text2)",fontWeight:600,textAlign:"right",flexShrink:0}}>{f.label}</div>
              <div style={{flex:1,background:"var(--surface2)",borderRadius:6,height:22,overflow:"hidden"}}><div style={{width:(f.n/maxF*100)+"%",height:"100%",background:f.color,borderRadius:6}}/></div>
              <div style={{width:24,fontSize:12,fontWeight:800}}>{f.n}</div>
            </div>
          ))}
        </div>

        {/* 2 colonnes : signatures/mois + équipe */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:14}}>
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",marginBottom:12}}>Signatures par mois (obj. en clair)</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:6,height:90,overflowX:"auto"}}>
              {sigByMonth.map(s=>(
                <div key={s.mk} style={{flex:"1 0 auto",minWidth:26,textAlign:"center"}}>
                  <div style={{fontSize:11,fontWeight:800,color:s.mk===selMonth?"var(--accent)":"var(--text2)"}}>{s.n}</div>
                  <div style={{position:"relative",height:60,display:"flex",alignItems:"flex-end",justifyContent:"center",marginTop:3}}>
                    <div style={{position:"absolute",bottom:0,width:20,height:Math.max(3,s.obj/maxSig*60),background:"var(--accent-l)",borderRadius:"4px 4px 0 0"}}/>
                    <div style={{position:"relative",width:20,height:Math.max(3,s.n/maxSig*60),background:s.mk===selMonth?"var(--accent)":"var(--accent-l2)",borderRadius:"4px 4px 0 0"}}/>
                  </div>
                  <div style={{fontSize:8,color:"var(--text3)",marginTop:3}}>{MOIS_FR[(+s.mk.split("-")[1])-1].slice(0,3)}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",marginBottom:12}}>Performance équipe</div>
            <div style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{fontWeight:700,color:ASSIGNEES.emmy.color}}>Emmy</span><span style={{color:"var(--text2)"}}>{emmyP.sig} signés · {emmyP.tot} leads</span></div>
              <div style={{height:6,background:"var(--surface2)",borderRadius:20,overflow:"hidden"}}><div style={{width:(emmyP.tot/maxTeam*100)+"%",height:"100%",background:ASSIGNEES.emmy.color}}/></div>
            </div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{fontWeight:700,color:ASSIGNEES.aya.color}}>Aya</span><span style={{color:"var(--text2)"}}>{ayaP.sig} signés · {ayaP.tot} leads</span></div>
              <div style={{height:6,background:"var(--surface2)",borderRadius:20,overflow:"hidden"}}><div style={{width:(ayaP.tot/maxTeam*100)+"%",height:"100%",background:ASSIGNEES.aya.color}}/></div>
            </div>
            <div style={{fontSize:10,color:"var(--text3)",marginTop:12}}>Temps moyen contact → signé : <b style={{color:"var(--text)"}}>{avgDays!=null?avgDays+" jours":"—"}</b></div>
          </div>
        </div>
      </div>
    </>
  );
}

// ─── FINANCE PAGE (réservée à Charles) ───────────────────────────────────
function FinancePage({user, leads, addToast, isMobile}){
  const [finance,setFinance]=useState([]);
  const [loading,setLoading]=useState(true);
  const [curMonth,setCurMonth]=useState(null);
  const [globalView,setGlobalView]=useState(false);
  const [formType,setFormType]=useState(null);
  const [fLabel,setFLabel]=useState("");
  const [fAmount,setFAmount]=useState("");
  const [fTtc,setFTtc]=useState(false);
  const [fDate,setFDate]=useState("");
  const [editId,setEditId]=useState(null);
  const creatingRef=useRef(new Set());
  const seededRef=useRef(false);

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"finance"),snap=>{
      setFinance(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>addToast("Erreur chargement finance","error"));
    return unsub;
  },[]);

  // Import auto des dossiers validés (une seule fois par lead via financeLogged)
  useEffect(()=>{
    if(loading) return;
    leads.filter(l=>l.column==="valide" && !l.financeLogged).forEach(l=>{
      if(creatingRef.current.has(l.id)) return;
      creatingRef.current.add(l.id);
      const info=prestationFromLead(l);
      const iso=l.validatedAt||nowISO();
      const entry={
        type:"in",
        label:"Client logé - "+l.name,
        amount:info.pending?0:round2(info.ttc/1.2),
        ttc:info.pending?null:info.ttc,
        pending:info.pending,
        source:"auto",
        leadId:l.id,
        createdAt:iso,
        monthKey:monthKeyFromISO(iso)
      };
      fsAddDoc(fsCollection(db,"finance"),entry)
        .then(()=>fsUpdateDoc(fsDocRef(db,"leads",l.id),{financeLogged:true}))
        .catch(()=>{creatingRef.current.delete(l.id);});
    });
  },[leads,loading]);

  // Seed unique des mouvements de juin 2026 (antérieurs à SOLOC) — ne s'exécute qu'une fois
  useEffect(()=>{
    if(loading || seededRef.current) return;
    if(finance.some(f=>f.seedTag==="june2026")){ seededRef.current=true; return; }
    seededRef.current=true;
    const juneISO="2026-06-15T12:00:00.000Z";
    const base={ pending:false, source:"manuel", leadId:null, createdAt:juneISO, monthKey:"2026-06", seedTag:"june2026" };
    const items=[
      {...base, type:"in",  label:"Client logé - Juline MALEYSSON", amount:round2(890/1.2), ttc:890},
      {...base, type:"in",  label:"Client logé - Inès CHAMBON",     amount:round2(890/1.2), ttc:890},
      {...base, type:"out", label:"Commission Kevin (due)",      amount:889.98, ttc:null},
      {...base, type:"out", label:"Google Ads juin",             amount:365,    ttc:null},
      {...base, type:"out", label:"Flyers écoles",               amount:33.99,  ttc:null}
    ];
    Promise.all(items.map(it=>fsAddDoc(fsCollection(db,"finance"),it))).catch(()=>{seededRef.current=false;});
  },[loading,finance]);

  const fMonth=(f)=>f.monthKey||monthKeyFromISO(f.createdAt);
  const sumIn=(arr)=>arr.filter(f=>f.type==="in").reduce((s,f)=>s+(f.amount||0),0);
  const sumOut=(arr)=>arr.filter(f=>f.type==="out").reduce((s,f)=>s+(f.amount||0),0);

  const currentMK=todayKey().slice(0,7);
  const monthsPresent=Array.from(new Set(finance.map(fMonth)));
  const months=Array.from(new Set(monthsPresent.concat([currentMK]))).sort();
  useEffect(()=>{ if(curMonth===null && months.length) setCurMonth(months[months.length-1]); },[months,curMonth]);
  const activeMonth=curMonth||currentMK;

  const view=globalView?finance:finance.filter(f=>fMonth(f)===activeMonth);
  const globIn=sumIn(finance), globOut=sumOut(finance);
  const vin=sumIn(view), vout=sumOut(view);
  const maxNet=Math.max.apply(null,months.map(mk=>Math.abs(sumIn(finance.filter(f=>fMonth(f)===mk))-sumOut(finance.filter(f=>fMonth(f)===mk)))).concat([1]));

  const prevMonth=()=>{ const i=months.indexOf(activeMonth); if(i>0){setGlobalView(false);setCurMonth(months[i-1]);} };
  const nextMonth=()=>{ const i=months.indexOf(activeMonth); if(i<months.length-1){setGlobalView(false);setCurMonth(months[i+1]);} };

  const openForm=(type)=>{ setEditId(null); setFormType(type); setFTtc(type==="in"); setFLabel(""); setFAmount(""); setFDate(""); };
  const openEdit=(f)=>{ setEditId(f.id); setFormType(f.type); setFLabel(f.label||""); setFAmount(String(f.amount||0)); setFTtc(false); setFDate(f.createdAt?String(f.createdAt).slice(0,10):""); };
  const closeForm=()=>{ setFormType(null); setEditId(null); };
  const save=()=>{
    const lbl=fLabel.trim(); const v=parseFloat(fAmount)||0;
    if(!lbl||!v){ addToast("Renseigne un libellé et un montant","error"); return; }
    const amountHT = fTtc ? round2(v/1.2) : round2(v);
    const iso = fDate ? new Date(fDate+"T12:00:00").toISOString() : nowISO();
    const payload = { type:formType, label:lbl, amount:amountHT, ttc:fTtc?v:null, pending:false, createdAt:iso, monthKey:monthKeyFromISO(iso) };
    if(editId){
      fsUpdateDoc(fsDocRef(db,"finance",editId), payload)
        .then(()=>{ closeForm(); addToast("✓ Mouvement modifié"); })
        .catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"finance"), {...payload, source:"manuel", leadId:null})
        .then(()=>{ closeForm(); addToast("✓ Mouvement ajouté"); })
        .catch(()=>addToast("Erreur d'ajout","error"));
    }
  };
  const del=(f)=>{
    if(!confirm("Supprimer ce mouvement ?")) return;
    fsDeleteDoc(fsDocRef(db,"finance",f.id)).then(()=>addToast("Mouvement supprimé")).catch(()=>addToast("Erreur","error"));
  };
  const complete=(f)=>{
    const raw=prompt("Montant de la prestation en TTC ? (converti en HT ÷1,2)");
    if(raw===null) return;
    const v=parseFloat(String(raw).replace(",","."))||0;
    if(!v) return;
    fsUpdateDoc(fsDocRef(db,"finance",f.id),{amount:Math.round(v/1.2), ttc:v, pending:false})
      .then(()=>addToast("✓ Montant renseigné")).catch(()=>addToast("Erreur","error"));
  };

  const cardStyle={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"};
  const htPreview = (fTtc&&fAmount) ? ("= "+eurFmt((parseFloat(fAmount)||0)/1.2)+" HT") : "";

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Finance</div>
          <div className="ps">Montants en HT — entrées auto depuis les dossiers validés</div>
        </div>
        <div className="tb-right"><button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button></div>
      </div>
      <div className="main">
        {loading?(
          <div className="empty-state"><div className="es-t">Chargement…</div></div>
        ):(
          <>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:8,opacity:globalView?.4:1,pointerEvents:globalView?"none":"auto"}}>
                <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={prevMonth}><Ic n="chevL" s={15}/></button>
                <span style={{fontSize:14,fontWeight:700,minWidth:120,textAlign:"center"}}>{monthLabel(activeMonth)}</span>
                <button className="ib" style={{border:"1.5px solid var(--border2)",borderRadius:8}} onClick={nextMonth}><Ic n="chevR" s={15}/></button>
              </div>
              <button className="btn btn-g" style={globalView?{background:"var(--ardoise)",color:"#fff",borderColor:"var(--ardoise)"}:{}} onClick={()=>setGlobalView(g=>!g)}>Global</button>
            </div>

            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"1.3fr 1fr 1fr 1fr",gap:10,marginBottom:18}}>
              <div style={{background:"var(--ardoise)",borderRadius:12,padding:"13px 15px"}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.55)",textTransform:"uppercase",letterSpacing:".06em"}}>Solde global HT</div>
                <div className="brand-font" style={{fontSize:24,fontWeight:800,color:"#fff",marginTop:4}}>{eurFmt(globIn-globOut)}</div>
              </div>
              <div style={cardStyle}>
                <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".06em"}}>{globalView?"Tout l'historique":"Net du mois"}</div>
                <div className="brand-font" style={{fontSize:22,fontWeight:800,marginTop:4,color:(vin-vout)>=0?"var(--text)":"var(--red)"}}>{eurFmt(vin-vout)}</div>
                <div style={{fontSize:10,color:"var(--text3)",marginTop:1}}>Net HT</div>
              </div>
              <div style={cardStyle}>
                <div style={{fontSize:10,fontWeight:700,color:"var(--green)",textTransform:"uppercase",letterSpacing:".06em"}}>Entrées</div>
                <div className="brand-font" style={{fontSize:22,fontWeight:800,marginTop:4,color:"var(--green)"}}>{eurFmt(vin)}</div>
              </div>
              <div style={cardStyle}>
                <div style={{fontSize:10,fontWeight:700,color:"var(--red)",textTransform:"uppercase",letterSpacing:".06em"}}>Sorties</div>
                <div className="brand-font" style={{fontSize:22,fontWeight:800,marginTop:4,color:"var(--red)"}}>{eurFmt(vout)}</div>
              </div>
            </div>

            <div style={{...cardStyle,marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",marginBottom:12}}>Net HT par mois</div>
              <div style={{display:"flex",alignItems:"flex-end",gap:18,height:90,paddingLeft:4,overflowX:"auto"}}>
                {months.map(mk=>{
                  const net=sumIn(finance.filter(f=>fMonth(f)===mk))-sumOut(finance.filter(f=>fMonth(f)===mk));
                  const h=Math.max(6,Math.round(Math.abs(net)/maxNet*70));
                  const active=!globalView&&mk===activeMonth;
                  return(
                    <div key={mk} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,cursor:"pointer",flexShrink:0}} onClick={()=>{setGlobalView(false);setCurMonth(mk);}}>
                      <div style={{fontSize:11,fontWeight:700,color:active?"var(--accent)":"var(--text2)",whiteSpace:"nowrap"}}>{eurFmt(net)}</div>
                      <div style={{width:46,height:h,borderRadius:"6px 6px 0 0",background:active?"var(--accent)":"var(--accent-l2)"}}></div>
                      <div style={{fontSize:10,color:"var(--text3)",fontWeight:600}}>{monthLabel(mk).split(" ")[0].slice(0,4)}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{display:"flex",gap:10,marginBottom:8}}>
              <button className="btn btn-block" style={{background:"var(--green)",color:"#fff"}} onClick={()=>openForm("in")}><Ic n="plus" s={13}/>Entrée</button>
              <button className="btn btn-block" style={{background:"var(--red)",color:"#fff"}} onClick={()=>openForm("out")}><Ic n="minus" s={13}/>Dépense</button>
            </div>

            {formType&&(
              <div style={{background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:12,padding:14,marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>{editId?"Modifier le mouvement":(formType==="in"?"Nouvelle entrée":"Nouvelle dépense")}</div>
                {editId&&(
                  <div className="seg" style={{marginBottom:10}}>
                    <button type="button" className="seg-btn" style={formType==="in"?{background:"var(--accent)",borderColor:"var(--accent)",color:"#fff"}:{}} onClick={()=>setFormType("in")}>Entrée</button>
                    <button type="button" className="seg-btn" style={formType==="out"?{background:"var(--accent)",borderColor:"var(--accent)",color:"#fff"}:{}} onClick={()=>setFormType("out")}>Dépense</button>
                  </div>
                )}
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  <input className="fi" style={{flex:2}} placeholder="Libellé" value={fLabel} onChange={e=>setFLabel(e.target.value)} autoFocus/>
                  <input className="fi" style={{flex:1}} type="number" placeholder="Montant €" value={fAmount} onChange={e=>setFAmount(e.target.value)}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <input className="fi" style={{flex:1}} type="date" value={fDate} onChange={e=>setFDate(e.target.value)}/>
                  <span style={{fontSize:10,color:"var(--text3)",whiteSpace:"nowrap"}}>vide = aujourd'hui</span>
                </div>
                <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:"var(--text2)",marginBottom:10,cursor:"pointer"}}>
                  <input type="checkbox" checked={fTtc} onChange={e=>setFTtc(e.target.checked)}/> C'est un montant TTC → convertir en HT (÷1,2)
                  <span style={{marginLeft:"auto",fontWeight:700,color:"var(--accent)"}}>{htPreview}</span>
                </label>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button className="btn btn-g" onClick={closeForm}>Annuler</button>
                  <button className="btn btn-p" onClick={save}><Ic n="check" s={13}/>Ajouter</button>
                </div>
              </div>
            )}

            <div style={{fontSize:10,fontWeight:800,color:"var(--accent)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>{globalView?"Mouvements — tout l'historique":"Mouvements — "+monthLabel(activeMonth)}</div>
            <div style={{...cardStyle,padding:0}}>
              {view.length===0?(
                <div style={{padding:22,textAlign:"center",color:"var(--text3)",fontSize:12,fontStyle:"italic"}}>Aucun mouvement sur cette période.</div>
              ):(
                view.slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0)).map((f,idx,arr)=>{
                  const isIn=f.type==="in";
                  return(
                    <div key={f.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 13px",borderBottom:idx<arr.length-1?"1px solid var(--border)":"none"}}>
                      <div style={{width:30,height:30,borderRadius:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:isIn?"var(--green-bg)":"var(--red-bg)",color:isIn?"var(--green)":"var(--red)"}}><Ic n={isIn?"arrowUp":"arrowDown"} s={15}/></div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600}}>{f.label}</div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                          <span style={{fontSize:10,color:"var(--text3)"}}>{fmtDate(f.createdAt)}</span>
                          {f.source==="auto"
                            ?<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:20,background:"#EFF6FF",color:"#1d4ed8"}}>AUTO · validé</span>
                            :<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:20,background:"var(--surface2)",color:"var(--text2)"}}>MANUEL</span>}
                          {f.pending&&<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:20,background:"var(--orange-bg)",color:"#92400e"}}>à compléter</span>}
                        </div>
                      </div>
                      {f.pending
                        ?<button className="btn btn-g btn-sm" onClick={()=>complete(f)}>Compléter</button>
                        :<div className="brand-font" style={{fontSize:15,fontWeight:800,color:isIn?"var(--green)":"var(--red)",whiteSpace:"nowrap"}}>{(isIn?"+":"−")+eurFmt(f.amount||0)}</div>}
                      <button className="ib" onClick={()=>openEdit(f)} title="Modifier"><Ic n="edit" s={14}/></button>
                      <button className="ib" style={{color:"var(--text3)"}} onClick={()=>del(f)} title="Supprimer"><Ic n="trash" s={14}/></button>
                    </div>
                  );
                })
              )}
            </div>
          </>
        )}
      </div>
    </>
  );
}

// ─── NEWSLETTER ──────────────────────────────────────────────────────────
function NewsletterModal({entry, onSave, onClose}){
  const [form,setForm]=useState(()=>({
    firstName:entry&&entry.firstName||"", lastName:entry&&entry.lastName||"",
    email:entry&&entry.email||"", phone:entry&&entry.phone||"",
    typologie:asArray(entry&&entry.typologie), budgetMax:entry&&entry.budgetMax||"",
    surfaceMin:entry&&entry.surfaceMin||"", secteur:entry&&entry.secteur||"",
    statutClient:entry&&entry.statutClient||"", periodeEssaiValidee:entry&&entry.periodeEssaiValidee!==undefined?entry.periodeEssaiValidee:null, nbColoc:entry&&entry.nbColoc||2
  }));
  const [err,setErr]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const toggleTypo=(t)=>setForm(p=>{ const cur=asArray(p.typologie); return {...p,typologie:cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]}; });
  const submit=()=>{
    if(!form.firstName.trim()&&!form.lastName.trim()){setErr("Renseigne un prénom ou un nom.");return;}
    if(!form.phone.trim()&&!form.email.trim()){setErr("Renseigne un téléphone ou un email.");return;}
    if(!form.statutClient){setErr("Choisis le profil (il détermine les honoraires).");return;}
    onSave(form);
  };
  const hono=form.statutClient?honoForProfile(form.statutClient,form):null;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{entry?"Modifier le contact":"Ajouter à la newsletter"}</div>
        {err&&<div className="ferr">{err}</div>}
        <div className="fr">
          <div className="fg"><label className="fl">Prénom</label><input className="fi" autoFocus value={form.firstName} onChange={e=>set("firstName",e.target.value)}/></div>
          <div className="fg"><label className="fl">NOM</label><input className="fi" value={form.lastName} onChange={e=>set("lastName",e.target.value)}/></div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
          <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>
        </div>
        <div className="modal-section">Profil — détermine les honoraires *</div>
        <div className="fg">
          <select className="fi" value={form.statutClient} onChange={e=>set("statutClient",e.target.value)}>
            <option value="">— Choisir un profil —</option>
            {STATUTS.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        {form.statutClient==="CDI"&&(
          <div className="fg">
            <label className="fl">Période d'essai validée ?</label>
            <div className="seg">
              <button type="button" className={"seg-btn"+(form.periodeEssaiValidee===true?" active":"")} onClick={()=>set("periodeEssaiValidee",true)}>Oui (990 €)</button>
              <button type="button" className={"seg-btn"+(form.periodeEssaiValidee===false?" active":"")} onClick={()=>set("periodeEssaiValidee",false)}>Non (1090 €)</button>
            </div>
          </div>
        )}
        {form.statutClient==="Colocation"&&(
          <div className="fg"><label className="fl">Nombre de colocataires</label><input className="fi" type="number" min="2" value={form.nbColoc} onChange={e=>set("nbColoc",e.target.value)}/></div>
        )}
        {hono!==null&&<div style={{fontSize:12,fontWeight:700,color:"var(--accent)",marginBottom:10}}>Honoraires SOLOC' pour ce profil : {hono.toLocaleString("fr-FR")} €</div>}
        <div className="modal-section">Critères de recherche</div>
        <div className="fg">
          <label className="fl">Typologie — plusieurs possibles</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {TYPOLOGIES.map(t=>{
              const active=asArray(form.typologie).includes(t);
              return <button key={t} type="button" onClick={()=>toggleTypo(t)}
                style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:active?"var(--accent)":"var(--border2)",background:active?"var(--accent-l)":"var(--surface2)",color:active?"var(--accent-d)":"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>{t}</button>;
            })}
          </div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Budget max (€)</label><input className="fi" type="number" value={form.budgetMax} onChange={e=>set("budgetMax",e.target.value)}/></div>
          <div className="fg"><label className="fl">Surface min (m²)</label><input className="fi" type="number" value={form.surfaceMin} onChange={e=>set("surfaceMin",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Secteur</label><input className="fi" value={form.secteur} onChange={e=>set("secteur",e.target.value)}/></div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={submit}><Ic n="check" s={13}/>{entry?"Enregistrer":"Ajouter"}</button>
        </div>
      </div>
    </div>
  );
}

function NewsletterPage({user, rows, addToast}){
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);

  const save=(form)=>{
    const name=[form.firstName.trim(),form.lastName.trim()].filter(Boolean).join(" ");
    const data={ firstName:form.firstName, lastName:form.lastName, name, email:form.email, phone:form.phone,
      typologie:asArray(form.typologie), budgetMax:form.budgetMax, surfaceMin:form.surfaceMin, secteur:form.secteur,
      statutClient:form.statutClient||"", periodeEssaiValidee:(form.periodeEssaiValidee!=null?form.periodeEssaiValidee:null), nbColoc:form.nbColoc||2 };
    if(modal&&modal.type==="edit"){
      fsUpdateDoc(fsDocRef(db,"newsletter",modal.entry.id),data).then(()=>{addToast("✓ Contact mis à jour");setModal(null);}).catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"newsletter"),{...data,createdAt:nowISO()}).then(()=>{addToast("✓ Ajouté à la newsletter");setModal(null);}).catch(()=>addToast("Erreur","error"));
    }
  };
  const del=(entry)=>{
    if(!confirm("Supprimer "+entry.name+" de la newsletter ?")) return;
    fsDeleteDoc(fsDocRef(db,"newsletter",entry.id)).then(()=>addToast("Contact supprimé")).catch(()=>addToast("Erreur","error"));
  };

  const q=search.toLowerCase();
  const filtered=(rows||[]).filter(r=>!q||(r.name||"").toLowerCase().includes(q)||(r.email||"").toLowerCase().includes(q)||(r.phone||"").includes(q)||asArray(r.typologie).join(",").toLowerCase().includes(q)||(r.secteur||"").toLowerCase().includes(q));

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Newsletter</div>
          <div className="ps">{(rows||[]).length} contact{(rows||[]).length!==1?"s":""} — base de diffusion des biens</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {filtered.length===0?(
          <div className="empty-state">
            <div className="es-ic">📣</div>
            <div className="es-t">Aucun contact newsletter</div>
            <div>Ajoute des contacts ici, ou depuis la fiche d'un lead avec « Ajouter à la newsletter ».</div>
          </div>
        ):(
          <div style={{overflowX:"auto"}}>
          <table className="list-table">
            <thead><tr>
              <th>Nom</th><th>Profil</th><th>Téléphone</th><th>Email</th><th>Typologie</th><th>Budget max</th><th>Surface min</th><th>Secteur</th><th style={{width:80}}></th>
            </tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td className="td-name">{r.name}</td>
                  <td>{r.statutClient?<span style={{fontSize:12}}>{r.statutClient} · <b style={{color:"var(--accent)"}}>{honoForProfile(r.statutClient,r)} €</b></span>:<span style={{color:"var(--text3)",fontSize:11}}>—</span>}</td>
                  <td>{r.phone||"—"}</td>
                  <td>{r.email||"—"}</td>
                  <td>{asArray(r.typologie).join(", ")||"—"}</td>
                  <td>{r.budgetMax?r.budgetMax+"€":"—"}</td>
                  <td>{r.surfaceMin?r.surfaceMin+"m²":"—"}</td>
                  <td>{r.secteur||"—"}</td>
                  <td style={{whiteSpace:"nowrap"}}>
                    <button className="ib" onClick={()=>setModal({type:"edit",entry:r})} title="Modifier"><Ic n="edit" s={14}/></button>
                    <button className="ib" style={{color:"var(--text3)"}} onClick={()=>del(r)} title="Supprimer"><Ic n="trash" s={14}/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
      {modal&&<NewsletterModal entry={modal.type==="edit"?modal.entry:null} onSave={save} onClose={()=>setModal(null)}/>}
    </>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(undefined);
  const [leads,setLeads]=useState([]);
  const [newsletter,setNewsletter]=useState([]);
  const [tab,setTab]=useState("pipeline");
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null); // {type:'add'} | {type:'detail',lead} | {type:'gate',lead}
  const [toasts,addToast]=useToasts();
  const isMobile=useIsMobile();
  const [pipeFilter,setPipeFilter]=useState("all");

  useEffect(()=>{
    const unsub=fsOnAuthStateChanged(auth,u=>setUser(u));
    return unsub;
  },[]);

  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"leads"),snap=>{
      setLeads(snap.docs.map(d=>({id:d.id,...d.data()})));
    },err=>addToast("Erreur de synchronisation","error"));
    return unsub;
  },[user]);

  const cleanupRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const toDelete=leads.filter(l=>!cleanupRef.current.has(l.id) && (
      (l.column==="sans_suite" && daysSince(l.sansSuiteAt||l.lastActivity)>SANS_SUITE_TTL_DAYS) ||
      (l.column==="envoye" && daysSince(l.envoyeAt||l.lastActivity)>ENVOYE_TTL_DAYS)
    ));
    if(toDelete.length===0) return;
    toDelete.forEach(l=>{ cleanupRef.current.add(l.id); fsDeleteDoc(fsDocRef(db,"leads",l.id)).catch(()=>cleanupRef.current.delete(l.id)); });
    addToast(toDelete.length+" fiche"+(toDelete.length>1?"s":"")+" supprimée"+(toDelete.length>1?"s":"")+" automatiquement (délai dépassé)");
  },[leads,user]);

  // Auto-répartition des leads non assignés (Calendly = jour du RDV, WhatsApp = jour de réception).
  // Les leads manuels arrivent déjà assignés (choix obligatoire à l'ajout), donc ne passent pas ici.
  const assignRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    leads.forEach(l=>{
      if(l.assignedTo || l.assignTouched) return;
      if(assignRef.current.has(l.id)) return;
      const dateRef = (l.calendlyRdv && l.calendlyRdv.startTime) || l.createdAt;
      const who = assigneeFromDate(dateRef);
      if(!who) return;
      assignRef.current.add(l.id);
      fsUpdateDoc(fsDocRef(db,"leads",l.id),{assignedTo:who, assignTouched:true}).catch(()=>assignRef.current.delete(l.id));
    });
  },[leads,user]);

  // Newsletter : base de diffusion (accessible à toute l'équipe)
  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"newsletter"),snap=>{
      setNewsletter(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return unsub;
  },[user]);

  // Dédoublonnage auto : si un contact newsletter est aussi En recherche (même tél/email),
  // il a signé la lettre de mission → on retire son entrée newsletter.
  const nlDedupRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const enRecherche=leads.filter(l=>l.column==="en_recherche");
    if(enRecherche.length===0||newsletter.length===0) return;
    newsletter.forEach(n=>{
      if(nlDedupRef.current.has(n.id)) return;
      const np=normPhone(n.phone), ne=normEmail(n.email);
      const match=enRecherche.some(l=>(np&&normPhone(l.phone)===np)||(ne&&normEmail(l.email)===ne));
      if(match){
        nlDedupRef.current.add(n.id);
        fsDeleteDoc(fsDocRef(db,"newsletter",n.id)).catch(()=>nlDedupRef.current.delete(n.id));
      }
    });
  },[leads,newsletter,user]);

  const addToNewsletter=(lead)=>{
    const np=normPhone(lead.phone), ne=normEmail(lead.email);
    if(newsletter.some(n=>(np&&normPhone(n.phone)===np)||(ne&&normEmail(n.email)===ne))){ addToast("Déjà dans la newsletter","error"); return; }
    const c=lead.criteria||{};
    fsAddDoc(fsCollection(db,"newsletter"),{
      firstName:lead.firstName||"", lastName:lead.lastName||"", name:lead.name,
      email:lead.email||"", phone:lead.phone||"",
      typologie:asArray(c.typologie), budgetMax:c.loyer||"", surfaceMin:c.surface||"", secteur:c.secteur||"",
      statutClient:c.statutClient||"", periodeEssaiValidee:(c.periodeEssaiValidee!=null?c.periodeEssaiValidee:null), nbColoc:c.nbColoc||2,
      createdAt:nowISO(), fromLead:true
    }).then(()=>addToast("✓ Ajouté à la newsletter")).catch(()=>addToast("Erreur","error"));
  };

  if(user===undefined) return <div style={{minHeight:"100vh",background:"var(--ardoise)"}}/>;
  if(user===null) return (<><style>{CSS}</style><LoginScreen/></>);

  const eventLabel=(col)=>({
    sans_suite:"❌ Passé en Sans suite",
    premier_contact:"↩️ Remis en Premier contact",
    relance:"📞 Passé en Relance",
    envoye:"✉️ Dossier envoyé",
    en_traitement:"🔍 Passé en traitement",
    en_recherche:"🏠 Critères validés — recherche démarrée",
    en_commission:"📑 Passé en commission",
    valide:"✅ Bail validé",
  }[col]||"Statut mis à jour");

  const addLead=(form)=>{
    const fullName=[form.firstName.trim(),form.lastName.trim()].filter(Boolean).join(" ");
    const doc={
      firstName:form.firstName, lastName:form.lastName, name:fullName,
      phone:form.phone, email:form.email,
      column:"premier_contact", relanceCount:0, paid:false, notes:"",
      criteria:blankCriteria, assignedTo:form.assignedTo||"", assignTouched:true, source:"manuel",
      createdAt:nowISO(), lastActivity:nowISO(),
      history:[mkEvent("🌱","Lead créé")]
    };
    fsAddDoc(fsCollection(db,"leads"),doc).then(()=>addToast("✓ "+fullName+" ajouté")).catch(()=>addToast("Erreur d'ajout","error"));
    setModal(null);
  };

  const moveLead=(id,col)=>{
    const lead=leads.find(l=>l.id===id);
    if(!lead||lead.column===col) return;
    if(col==="en_recherche"&&!criteriaComplete(lead.criteria)){
      setModal({type:"gate",lead});
      return;
    }
    const moveExtra = col==="valide" ? {validatedAt:nowISO()} : (col==="sans_suite" ? {sansSuiteAt:nowISO()} : (col==="envoye" ? {envoyeAt:nowISO()} : {}));
    fsUpdateDoc(fsDocRef(db,"leads",id),{
      column:col, lastActivity:nowISO(), ...moveExtra,
      history:[...(lead.history||[]),mkEvent("",eventLabel(col))]
    }).then(()=>addToast(PIPELINE_COLS.find(c=>c.id===col)?.label+" — "+lead.name));
  };

  const relanceAction=(lead)=>{
    const newCount=(lead.relanceCount||0)+1;
    if(newCount>=3){
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
        column:"sans_suite", relanceCount:newCount, lastActivity:nowISO(), sansSuiteAt:nowISO(),
        history:[...(lead.history||[]),mkEvent("❌","3 relances sans réponse — passé en Sans suite")]
      }).then(()=>addToast(lead.name+" passé en Sans suite","error"));
    } else {
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
        relanceCount:newCount, lastActivity:nowISO(),
        history:[...(lead.history||[]),mkEvent("📵",`Relance ${newCount}/3 — pas de réponse`)]
      }).then(()=>addToast("Relance "+newCount+"/3 — "+lead.name));
    }
  };

  const togglePaid=(lead)=>{
    const paid=!lead.paid;
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
      paid, lastActivity:nowISO(),
      history:[...(lead.history||[]),mkEvent(paid?"💶":"↩️",paid?"Marqué payé":"Paiement annulé")]
    }).then(()=>addToast(paid?"✓ Marqué payé":"Paiement annulé"));
  };

  const saveDetail=(lead,form,targetCol)=>{
    const colChanged = targetCol!==lead.column;
    const hist=[...(lead.history||[])];
    if(colChanged) hist.push(mkEvent("",eventLabel(targetCol)));
    const valExtra = (targetCol==="valide" && lead.column!=="valide") ? {validatedAt:nowISO()} : {};
    const ssExtra = (targetCol==="sans_suite" && lead.column!=="sans_suite") ? {sansSuiteAt:nowISO()} : {};
    const evExtra = (targetCol==="envoye" && lead.column!=="envoye") ? {envoyeAt:nowISO()} : {};
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
      name:(form.name||"").trim()||lead.name, phone:form.phone, email:form.email, notes:form.notes,
      criteria:form.criteria, column:targetCol, assignedTo:form.assignedTo||"", assignTouched:true, ...valExtra, ...ssExtra, ...evExtra,
      lastActivity:nowISO(), history:hist
    }).then(()=>{addToast("✓ "+lead.name+" mis à jour");setModal(null);});
  };

  const deleteLead=(lead)=>{
    if(!confirm("Supprimer "+lead.name+" ?")) return;
    fsDeleteDoc(fsDocRef(db,"leads",lead.id)).then(()=>{addToast(lead.name+" supprimé");setModal(null);});
  };

  const mergeLeads=(keep,drop)=>{
    if(!keep||!drop) return;
    const hist=[...(keep.history||[]),...(drop.history||[]),mkEvent("🔗","Fusionnée avec le doublon « "+drop.name+" »")].sort((a,b)=>new Date(a.at||0)-new Date(b.at||0));
    const notes=[keep.notes,drop.notes].filter(Boolean).join("\n— — —\n");
    fsUpdateDoc(fsDocRef(db,"leads",keep.id),{
      phone:keep.phone||drop.phone||"",
      email:keep.email||drop.email||"",
      criteria:mergeCriteria(keep.criteria,drop.criteria),
      calendlyRdv:keep.calendlyRdv||drop.calendlyRdv||null,
      whatsappContact:keep.whatsappContact||drop.whatsappContact||null,
      calendlyEventUri:keep.calendlyEventUri||drop.calendlyEventUri||null,
      notes:notes, history:hist, lastActivity:nowISO()
    }).then(()=>fsDeleteDoc(fsDocRef(db,"leads",drop.id)))
      .then(()=>{addToast("✓ Fiches fusionnées");setModal(null);})
      .catch(()=>addToast("Erreur de fusion","error"));
  };

  const q=search.toLowerCase();
  const filteredLeads = leads.filter(l=>!q||l.name.toLowerCase().includes(q)||(l.phone||"").includes(q)||(l.email||"").toLowerCase().includes(q));

  // Vue par rôle : admin (Charles) voit tout le pipeline ; Emmy/Aya seulement leurs leads.
  // L'onglet "En recherche" reste commun à tout le monde (non filtré).
  const myRole = roleOfEmail(user.email);
  const isAdmin = myRole==="admin";
  const pipelineLeads = isAdmin
    ? (pipeFilter==="all" ? filteredLeads : filteredLeads.filter(l=>l.assignedTo===pipeFilter))
    : filteredLeads.filter(l=>l.assignedTo===myRole);

  const partnersOf=(lead)=>{ if(!lead) return []; const ph=normPhone(lead.phone); const em=normEmail(lead.email); return leads.filter(o=>o.id!==lead.id && ((ph&&normPhone(o.phone)===ph)||(em&&normEmail(o.email)===em))); };
  const dupeIds=new Set();
  leads.forEach(l=>{ if(partnersOf(l).length>0) dupeIds.add(l.id); });

  return(
    <>
      <style>{CSS}</style>
      <div className="app">
        <aside className="sb">
          <div className="sb-brand">
            <div className="sb-logo">S</div>
            <div><div className="sb-name">soloc'</div><div className="sb-sub">ESPACE PRO</div></div>
          </div>
          <div className="sb-nav">
            <div className={"nav-item"+(tab==="pipeline"?" active":"")} onClick={()=>setTab("pipeline")}><Ic n="trendUp" s={16}/>Pipeline</div>
            <div className={"nav-item"+(tab==="recherche"?" active":"")} onClick={()=>setTab("recherche")}><Ic n="table" s={16}/>Recherche</div>
            <div className={"nav-item"+(tab==="newsletter"?" active":"")} onClick={()=>setTab("newsletter")}><Ic n="mail" s={16}/>Newsletter</div>
            <div className={"nav-item"+(tab==="biens"?" active":"")} onClick={()=>setTab("biens")}><Ic n="home" s={16}/>Biens</div>
            <div className={"nav-item"+(tab==="partenaires"?" active":"")} onClick={()=>setTab("partenaires")}><Ic n="users" s={16}/>Partenaires</div>
            <div className={"nav-item"+(tab==="todo"?" active":"")} onClick={()=>setTab("todo")}><Ic n="listCheck" s={16}/>To-do</div>
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="pilotage"?" active":"")} onClick={()=>setTab("pilotage")}><Ic n="trendUp" s={16}/>Pilotage</div>}
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="finance"?" active":"")} onClick={()=>setTab("finance")}><Ic n="wallet" s={16}/>Finance</div>}
          </div>
          <div className="sb-footer">
            <div className="sb-user">{displayNameFromEmail(user.email)}</div>
            <button className="logout-btn" onClick={()=>fsSignOut(auth)}><Ic n="logout" s={14}/>Se déconnecter</button>
          </div>
        </aside>

        <div className="content">
          {(tab==="pilotage"&&user.email===FINANCE_EMAIL)
            ? <PilotagePage user={user} leads={leads}/>
            : (tab==="finance"&&user.email===FINANCE_EMAIL)
            ? <FinancePage user={user} leads={leads} addToast={addToast} isMobile={isMobile}/>
            : tab==="partenaires"
            ? <PartenairesPage user={user} addToast={addToast}/>
            : tab==="biens"
            ? <BiensPage user={user} newsletter={newsletter} leads={leads} addToast={addToast}/>
            : tab==="todo"
            ? <TodoPage user={user} addToast={addToast}/>
            : tab==="newsletter"
            ? <NewsletterPage user={user} rows={newsletter} addToast={addToast}/>
            : (<>
              <div className="topbar">
                <div>
                  <div className="pt">{tab==="pipeline"?"Pipeline":"Recherche"}</div>
                  <div className="ps">{tab==="pipeline"?pipelineLeads.length+" lead"+(pipelineLeads.length!==1?"s":"")+" au total":"Recherches en cours en un coup d'œil"}</div>
                </div>
                <div className="tb-right">
                  <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
                  {tab==="pipeline"&&isAdmin&&(
                    <div className="seg" style={{flexShrink:0}}>
                      <button type="button" className={"seg-btn"+(pipeFilter==="all"?" active":"")} onClick={()=>setPipeFilter("all")}>Tous</button>
                      <button type="button" className={"seg-btn"+(pipeFilter==="emmy"?" active":"")} style={pipeFilter==="emmy"?{background:ASSIGNEES.emmy.color,borderColor:ASSIGNEES.emmy.color,color:"#fff"}:{}} onClick={()=>setPipeFilter("emmy")}>Emmy</button>
                      <button type="button" className={"seg-btn"+(pipeFilter==="aya"?" active":"")} style={pipeFilter==="aya"?{background:ASSIGNEES.aya.color,borderColor:ASSIGNEES.aya.color,color:"#fff"}:{}} onClick={()=>setPipeFilter("aya")}>Aya</button>
                    </div>
                  )}
                  {tab==="pipeline"&&<button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un lead</button>}
                  <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
                </div>
              </div>
              <div className="main">
                {tab==="pipeline"
                  ? <KanbanBoard leads={pipelineLeads} onOpen={lead=>setModal({type:"detail",lead})} onMove={moveLead} onRelanceAction={relanceAction} onTogglePaid={togglePaid} isMobile={isMobile} dupeIds={dupeIds}/>
                  : <RechercheTable leads={filteredLeads} search={search}/>}
              </div>
            </>)}
        </div>

        <nav className="bottom-nav">
          <button className={"bn-item"+(tab==="pipeline"?" active":"")} onClick={()=>setTab("pipeline")}><Ic n="trendUp" s={21}/>Pipeline</button>
          <button className={"bn-item"+(tab==="recherche"?" active":"")} onClick={()=>setTab("recherche")}><Ic n="table" s={21}/>Recherche</button>
          <button className={"bn-item"+(tab==="newsletter"?" active":"")} onClick={()=>setTab("newsletter")}><Ic n="mail" s={21}/>News</button>
          <button className={"bn-item"+(tab==="biens"?" active":"")} onClick={()=>setTab("biens")}><Ic n="home" s={21}/>Biens</button>
          <button className={"bn-item"+(tab==="partenaires"?" active":"")} onClick={()=>setTab("partenaires")}><Ic n="users" s={21}/>Agents</button>
          <button className={"bn-item"+(tab==="todo"?" active":"")} onClick={()=>setTab("todo")}><Ic n="listCheck" s={21}/>To-do</button>
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="pilotage"?" active":"")} onClick={()=>setTab("pilotage")}><Ic n="trendUp" s={21}/>Pilotage</button>}
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="finance"?" active":"")} onClick={()=>setTab("finance")}><Ic n="wallet" s={21}/>Finance</button>}
        </nav>
      </div>

      {modal?.type==="add"&&<AddLeadModal onSave={addLead} onClose={()=>setModal(null)}/>}
      {(modal?.type==="detail"||modal?.type==="gate")&&
        <LeadDetailModal lead={modal.lead} gateTarget={modal.type==="gate"} onClose={()=>setModal(null)} onSave={saveDetail} onDelete={deleteLead}
          dupePartners={partnersOf(modal.lead)} onMerge={(p)=>setModal({type:"merge",a:modal.lead,b:p})} isAdmin={isAdmin} onAddNewsletter={addToNewsletter}/>}
      {modal?.type==="merge"&&
        <MergeModal leadA={modal.a} leadB={modal.b} onClose={()=>setModal(null)} onConfirm={mergeLeads}/>}

      <div className="toast-wrap">
        {toasts.map(t=><div key={t.id} className={"toast"+(t.type==="error"?" error":"")}>{t.text}</div>)}
      </div>
    </>
  );
}

function boot(){
  const fb = window.__fb;
  auth = fb.auth; db = fb.db;
  fsOnAuthStateChanged = fb.onAuthStateChanged;
  fsSignIn = fb.signInWithEmailAndPassword;
  fsSignOut = fb.signOut;
  fsCollection = fb.collection;
  fsOnSnapshot = fb.onSnapshot;
  fsAddDoc = fb.addDoc;
  fsDocRef = fb.doc;
  fsUpdateDoc = fb.updateDoc;
  fsDeleteDoc = fb.deleteDoc;
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
}
if(window.__fb) boot(); else window.addEventListener("fbready", boot, {once:true});
</script>
