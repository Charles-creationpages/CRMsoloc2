function App(){
  const [user,setUser]=useState(undefined);
  const [leads,setLeads]=useState([]);
  const [newsletter,setNewsletter]=useState([]);
  const [soumissions,setSoumissions]=useState([]);
  const [lettres,setLettres]=useState([]);
  const [captures,setCaptures]=useState([]);
  const [tab,setTab]=useState("pipeline");
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null); // {type:'add'} | {type:'detail',lead} | {type:'gate',lead}
  const [toasts,addToast]=useToasts();
  const isMobile=useIsMobile();
  const [pipeFilter,setPipeFilter]=useState("all");

  useEffect(()=>{
    const unsub=fsOnAuthStateChanged(auth,u=>setUser(u));
    return unsub;
  },[]);

  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"leads"),snap=>{
      setLeads(snap.docs.map(d=>({id:d.id,...d.data()})));
    },err=>addToast("Erreur de synchronisation","error"));
    return unsub;
  },[user]);

  const cleanupRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const toDelete=leads.filter(l=>!cleanupRef.current.has(l.id) &&
      l.column==="sans_suite" && daysSince(l.sansSuiteAt||l.lastActivity)>SANS_SUITE_TTL_DAYS
    );
    if(toDelete.length===0) return;
    toDelete.forEach(l=>{ cleanupRef.current.add(l.id); fsDeleteDoc(fsDocRef(db,"leads",l.id)).catch(()=>cleanupRef.current.delete(l.id)); });
    addToast(toDelete.length+" fiche"+(toDelete.length>1?"s":"")+" en sans suite supprimée"+(toDelete.length>1?"s":"")+" (+15j)");
  },[leads,user]);

  // Doublons Calendly : l'outil externe qui crée les leads Calendly en crée parfois 2 ou 3 pour le même client.
  // Fiches encore en Premier contact, avec un RDV Calendly et le même téléphone ou email → fusion automatique
  // dans la plus ancienne (elle garde son historique, le RDV le plus récent est conservé), les autres sont supprimées.
  // Transaction : si plusieurs CRM sont ouverts, la fusion n'est faite qu'une fois.
  const calDupRef=useRef(new Set());
  useEffect(()=>{
    if(!user||!fsRunTransaction) return;
    const cands=leads.filter(l=>!l.archived && l.column==="premier_contact" && l.calendlyRdv);
    const groups={};
    cands.forEach(l=>{
      const k=normPhone(l.phone)||normEmail(l.email);
      if(!k) return;
      (groups[k]=groups[k]||[]).push(l);
    });
    Object.values(groups).forEach(g=>{
      if(g.length<2) return;
      const byAge=[...g].sort((a,b)=>(new Date(a.createdAt||0)-new Date(b.createdAt||0))||String(a.id).localeCompare(String(b.id)));
      const keep=byAge[0];
      const newest=byAge[byAge.length-1];
      byAge.slice(1).forEach(drop=>{
        if(calDupRef.current.has(drop.id)) return;
        calDupRef.current.add(drop.id);
        const keepRef=fsDocRef(db,"leads",keep.id), dropRef=fsDocRef(db,"leads",drop.id);
        fsRunTransaction(db, async tx=>{
          const k=await tx.get(keepRef), d=await tx.get(dropRef);
          if(!k.exists()||!d.exists()) return false;
          const kd=k.data(), dd=d.data();
          const notes=[kd.notes,dd.notes].filter(Boolean).filter((n,i,a)=>a.indexOf(n)===i).join("\n— — —\n");
          tx.update(keepRef,{
            firstName:kd.firstName||dd.firstName||"", lastName:kd.lastName||dd.lastName||"", name:kd.name||dd.name||"",
            phone:kd.phone||dd.phone||"", email:kd.email||dd.email||"",
            criteria:mergeCriteria(kd.criteria,dd.criteria),
            calendlyRdv:(drop.id===newest.id?dd.calendlyRdv:null)||kd.calendlyRdv||dd.calendlyRdv||null,
            calendlyEventUri:(drop.id===newest.id?dd.calendlyEventUri:null)||kd.calendlyEventUri||dd.calendlyEventUri||null,
            whatsappContact:kd.whatsappContact||dd.whatsappContact||null,
            notes:notes,
            history:[...(kd.history||[]),mkEvent("🔗","Doublon Calendly fusionné automatiquement")]
          });
          tx.delete(dropRef);
          return true;
        }).catch(()=>calDupRef.current.delete(drop.id));
      });
    });
  },[leads,user]);

  // Auto-répartition des leads non assignés (Calendly = jour du RDV, WhatsApp = jour de réception).
  // Les leads manuels arrivent déjà assignés (choix obligatoire à l'ajout), donc ne passent pas ici.
  const assignRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    leads.forEach(l=>{
      if(asArray(l.assignedTo).length>0 || l.assignTouched) return;
      if(assignRef.current.has(l.id)) return;
      const dateRef = (l.calendlyRdv && l.calendlyRdv.startTime) || l.createdAt;
      const who = assigneeFromDate(dateRef);
      if(!who) return;
      assignRef.current.add(l.id);
      fsUpdateDoc(fsDocRef(db,"leads",l.id),{assignedTo:[who], assignTouched:true}).catch(()=>assignRef.current.delete(l.id));
    });
  },[leads,user]);

  // Archivage mensuel : Validé + payé d'un mois passé → Archives (re-vérifié chaque heure pour le passage de mois)
  const archiveRef=useRef(new Set());
  const [monthTick,setMonthTick]=useState(localMonthKey());
  useEffect(()=>{ const t=setInterval(()=>setMonthTick(localMonthKey()),3600000); return ()=>clearInterval(t); },[]);
  useEffect(()=>{
    if(!user) return;
    const toArchive=leads.filter(l=>!archiveRef.current.has(l.id) && readyToArchive(l));
    if(toArchive.length===0) return;
    toArchive.forEach(l=>{
      const mk=archiveMonthOf(l);
      archiveRef.current.add(l.id);
      fsUpdateDoc(fsDocRef(db,"leads",l.id),{
        archived:true, archivedAt:nowISO(), archiveMonth:mk,
        history:[...(l.history||[]),mkEvent("🗄️","Archivé — "+monthLabel(mk))]
      }).catch(()=>archiveRef.current.delete(l.id));
    });
    if(user.email===FINANCE_EMAIL) addToast(toArchive.length+" dossier"+(toArchive.length>1?"s":"")+" archivé"+(toArchive.length>1?"s":""));
  },[leads,user,monthTick]);

  // Prénom / NOM : fiches où le nom complet est rangé dans le prénom (ou prénom vide) → on sépare.
  // Ne touche que ces fiches ; les autres restent telles quelles.
  const nameFixRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const fix=(coll,list)=>list.forEach(o=>{
      if(nameFixRef.current.has(coll+o.id) || !badFirstName(o)) return;
      const src=(o.firstName && /\s/.test(String(o.firstName).trim())) ? o.firstName : o.name;
      const sp=splitFullName(src);
      if(!sp.prenom || (sp.prenom===o.firstName && sp.nom===(o.lastName||""))) return;
      nameFixRef.current.add(coll+o.id);
      fsUpdateDoc(fsDocRef(db,coll,o.id),{firstName:sp.prenom, lastName:sp.nom}).catch(()=>nameFixRef.current.delete(coll+o.id));
    });
    fix("leads",leads); fix("newsletter",newsletter);
  },[leads,newsletter,user]);

  // Newsletter : base de diffusion (accessible à toute l'équipe)
  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"newsletter"),snap=>{
      setNewsletter(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return unsub;
  },[user]);

  // Soumissions du formulaire client (collection publique alimentée par formulaire.html)
  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"soumissions"),snap=>{
      setSoumissions(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return unsub;
  },[user]);

  // Captures TikTok (collection publique alimentée par tiktok.html)
  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"captures"),snap=>{
      setCaptures(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return unsub;
  },[user]);

  // Import auto : chaque capture TikTok crée un lead en Premier contact, source TikTok, auto-assigné.
  const captureRef=useRef(new Set());
  useEffect(()=>{
    if(!user||captures.length===0) return;
    const STATUT_MAP={"Étudiant":"Étudiant","Salarié CDI":"CDI","CDD":"CDD","Indépendant":"Indépendant"};
    captures.forEach(cap=>{
      if(cap.traite===true || captureRef.current.has(cap.id)) return;
      captureRef.current.add(cap.id);
      const statut=STATUT_MAP[cap.statut]||"";
      const notesArr=[];
      if(statut==="") notesArr.push("Statut déclaré : "+(cap.statut||"—")+" (à qualifier)");
      if(cap.dispos) notesArr.push("Disponibilités : "+cap.dispos);
      const who=assigneeFromDate(cap.createdAt||nowISO());
      const prov=String(cap.provenance||cap.source||"tiktok").toLowerCase().replace(/[^a-z0-9]/g,"")||"tiktok";
      // Plusieurs navigateurs ouverts (Charles, Emmy, Aya) voient la même capture en même temps :
      // le lead a un identifiant fixe lié à la capture et n'est créé que s'il n'existe pas encore → jamais de doublon.
      const leadData={
        name:((cap.prenom||"")+" "+(cap.nom||"")).trim(), firstName:cap.prenom||"", lastName:cap.nom||"",
        phone:cap.phone||"", email:cap.email||"",
        criteria:{...blankCriteria, statutClient:statut},
        assignedTo:[who], assignTouched:true, source:prov,
        origine:{bouton:"formulaire", provenance:prov, campagne:""},
        column:"premier_contact", relanceCount:0, paid:false,
        notes:notesArr.join("\n"),
        createdAt:cap.createdAt||nowISO(), lastActivity:nowISO(),
        history:[mkEvent("🌱","Lead créé — Formulaire "+libProvenance(prov))]
      };
      const leadRef=fsDocRef(db,"leads","tiktok_"+cap.id);
      const creer = fsRunTransaction
        ? fsRunTransaction(db, async tx=>{ const ex=await tx.get(leadRef); if(ex.exists()) return false; tx.set(leadRef,leadData); return true; })
        : fsAddDoc(fsCollection(db,"leads"),leadData).then(()=>true);
      creer.then(created=>{
        fsUpdateDoc(fsDocRef(db,"captures",cap.id),{traite:true,leadId:leadRef.id}).catch(()=>{});
        if(created) addToast("✓ Nouveau lead "+libProvenance(prov)+" : "+((cap.prenom||"")+" "+(cap.nom||"")).trim());
      }).catch(()=>captureRef.current.delete(cap.id));
    });
  },[captures,user]);

  // Lettres de mission (config + signatures) — alimente le Registre et les pastilles
  useEffect(()=>{
    if(!user) return;
    const unsub=fsOnSnapshot(fsCollection(db,"lettres"),snap=>{
      setLettres(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return unsub;
  },[user]);

  // Numérotation des lettres signées (LM-AAAA-XXX, réutilise les trous) + marquage du lead
  const numRef=useRef(new Set());
  const leadMarkRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const signed=lettres.filter(l=>l.status==="signe");
    // 1) attribuer un numéro à la première lettre signée sans numéro (une à la fois pour éviter les collisions)
    const toNumber=signed.find(l=>!l.numero && !numRef.current.has(l.id));
    if(toNumber){
      const year=(toNumber.signedAt||nowISO()).slice(0,4);
      const used=new Set(lettres.filter(x=>x.numeroYear===year&&x.numeroSeq).map(x=>x.numeroSeq));
      let seq=1; while(used.has(seq)) seq++;
      const numero="LM-"+year+"-"+String(seq).padStart(3,"0");
      numRef.current.add(toNumber.id);
      fsUpdateDoc(fsDocRef(db,"lettres",toNumber.id),{numero:numero,numeroYear:year,numeroSeq:seq}).catch(()=>numRef.current.delete(toNumber.id));
    }
    // 2) marquer le lead correspondant (pastille "lettre signée" + numéro)
    signed.forEach(lt=>{
      const lead=leads.find(l=>l.id===lt.id);
      if(!lead) return;
      if(lead.lettreSignee && lead.lettreNumero===(lt.numero||"")) return;
      const key=lt.id+"|"+(lt.numero||"");
      if(leadMarkRef.current.has(key)) return;
      leadMarkRef.current.add(key);
      fsUpdateDoc(fsDocRef(db,"leads",lt.id),{lettreSignee:lt.signedAt||nowISO(), lettreNumero:lt.numero||""}).catch(()=>leadMarkRef.current.delete(key));
    });
  },[lettres,leads,user]);

  // Import auto : une soumission écrase la fiche du lead correspondant (le client donne les bonnes infos).
  const importRef=useRef(new Set());
  useEffect(()=>{
    if(!user||soumissions.length===0) return;
    soumissions.forEach(sub=>{
      if(sub.traite===true || importRef.current.has(sub.id)) return;
      const lead=leads.find(l=>l.id===(sub.leadId||sub.id));
      if(!lead) return;
      importRef.current.add(sub.id);
      const c=lead.criteria||{};
      const newCrit={
        ...c,
        typologie: asArray(sub.typologie),
        loyer: sub.budgetMax||"",
        surface: sub.surfaceMin||"",
        secteur: sub.localisation||"",
        etatLogement: sub.meuble ? [sub.meuble] : [],
        etatBien: asArray(sub.etatBien),
        dateAsap: !!sub.dateAsap,
        dateEntreeSouhaitee: sub.dateEntree||"",
        prestationsSupp: asArray(sub.prestations).join(", ")
      };
      const extra=[];
      // Garants et personnes supplémentaires → champs structurés de la fiche (plus dans les notes)
      const subGarants = Array.isArray(sub.garants) ? sub.garants
        : ((sub.garantNom||sub.garantTel||sub.garantMail) ? [{nom:sub.garantNom||"", tel:sub.garantTel||"", mail:sub.garantMail||"", lien:sub.garantLien||""}] : []);
      const subPersonnes = Array.isArray(sub.personnes) ? sub.personnes : [];
      if(sub.transports) extra.push("Transports : "+sub.transports);
      if(sub.rdc) extra.push("Rez-de-chaussée accepté : "+sub.rdc);
      if(sub.ascenseur) extra.push("Ascenseur obligatoire : "+sub.ascenseur);
      if(sub.prestationsIndispensables) extra.push("Prestations indispensables : "+sub.prestationsIndispensables);
      const block = extra.length ? ("— Formulaire client ("+fmtDate(sub.submittedAt)+") —\n"+extra.join("\n")) : "";
      const notes = lead.notes ? (lead.notes+(block?"\n\n"+block:"")) : block;
      const prenom=((sub.locataireNom||"").trim().split(/\s+/)[0])||lead.firstName||"";
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
        name: sub.locataireNom||lead.name, firstName: prenom,
        phone: sub.phone||lead.phone||"", email: sub.email||lead.email||"",
        criteria: newCrit, notes: notes,
        ...(subGarants.length?{garants:subGarants}:{}), ...(subPersonnes.length?{personnes:subPersonnes}:{}),
        formulaireRempli: sub.submittedAt||nowISO(), lastActivity: nowISO()
      }).then(()=>{
        fsUpdateDoc(fsDocRef(db,"soumissions",sub.id),{traite:true}).catch(()=>{});
        addToast("✓ Formulaire de "+(sub.locataireNom||lead.name)+" importé");
      }).catch(()=>importRef.current.delete(sub.id));
    });
  },[soumissions,leads,user]);

  // Dédoublonnage auto : si un contact newsletter est aussi En recherche (même tél/email),
  // il a signé la lettre de mission → on retire son entrée newsletter.
  const nlDedupRef=useRef(new Set());
  useEffect(()=>{
    if(!user) return;
    const enRecherche=leads.filter(l=>l.column==="en_recherche");
    if(enRecherche.length===0||newsletter.length===0) return;
    newsletter.forEach(n=>{
      if(nlDedupRef.current.has(n.id)) return;
      const np=normPhone(n.phone), ne=normEmail(n.email);
      const match=enRecherche.some(l=>(np&&normPhone(l.phone)===np)||(ne&&normEmail(l.email)===ne));
      if(match){
        nlDedupRef.current.add(n.id);
        fsDeleteDoc(fsDocRef(db,"newsletter",n.id)).catch(()=>nlDedupRef.current.delete(n.id));
      }
    });
  },[leads,newsletter,user]);

  // Copie un lead vers la Newsletter, une seule fois, au moment où il passe en "Envoyé".
  // Silencieux, et ne recrée jamais une entrée supprimée à la main (plus d'effet en boucle).
  const copyLeadToNewsletter=(lead)=>{
    if(!lead) return;
    const np=normPhone(lead.phone), ne=normEmail(lead.email);
    if(newsletter.some(n=>(np&&normPhone(n.phone)===np)||(ne&&normEmail(n.email)===ne))) return;
    const c=lead.criteria||{};
    fsAddDoc(fsCollection(db,"newsletter"),{
      firstName:lead.firstName||"", lastName:lead.lastName||"", name:lead.name,
      email:lead.email||"", phone:lead.phone||"",
      typologie:asArray(c.typologie), budgetMax:c.loyer||"", surfaceMin:c.surface||"", secteur:c.secteur||"",
      statutClient:c.statutClient||"", periodeEssaiValidee:(c.periodeEssaiValidee!=null?c.periodeEssaiValidee:null), nbColoc:c.nbColoc||2,
      createdAt:nowISO(), fromLead:true, fromEnvoye:true
    }).catch(()=>{});
  };

  const addToNewsletter=(lead)=>{
    const np=normPhone(lead.phone), ne=normEmail(lead.email);
    if(newsletter.some(n=>(np&&normPhone(n.phone)===np)||(ne&&normEmail(n.email)===ne))){ addToast("Déjà dans la newsletter","error"); return; }
    const c=lead.criteria||{};
    fsAddDoc(fsCollection(db,"newsletter"),{
      firstName:lead.firstName||"", lastName:lead.lastName||"", name:lead.name,
      email:lead.email||"", phone:lead.phone||"",
      typologie:asArray(c.typologie), budgetMax:c.loyer||"", surfaceMin:c.surface||"", secteur:c.secteur||"",
      statutClient:c.statutClient||"", periodeEssaiValidee:(c.periodeEssaiValidee!=null?c.periodeEssaiValidee:null), nbColoc:c.nbColoc||2,
      createdAt:nowISO(), fromLead:true
    }).then(()=>addToast("✓ Ajouté à la newsletter")).catch(()=>addToast("Erreur","error"));
  };

  if(user===undefined) return <div style={{minHeight:"100vh",background:"var(--ardoise)"}}/>;
  if(user===null) return (<><style>{CSS}</style><LoginScreen/></>);

  const eventLabel=(col)=>({
    sans_suite:"❌ Passé en Sans suite",
    premier_contact:"↩️ Remis en Premier contact",
    relance:"📞 Passé en Relance",
    envoye:"✉️ Dossier envoyé",
    en_attente:"⏸️ Mis en attente",
    en_recherche:"🏠 Critères validés — recherche démarrée",
    en_commission:"📑 Passé en commission",
    valide:"✅ Bail validé",
  }[col]||"Statut mis à jour");

  const addLead=(form)=>{
    const fullName=[form.firstName.trim(),form.lastName.trim()].filter(Boolean).join(" ");
    const doc={
      firstName:form.firstName, lastName:form.lastName, name:fullName,
      phone:form.phone, email:form.email,
      column:"premier_contact", relanceCount:0, paid:false, notes:"",
      criteria:blankCriteria, assignedTo:asArray(form.assignedTo), assignTouched:true, source:"manuel",
      createdAt:nowISO(), lastActivity:nowISO(),
      history:[mkEvent("🌱","Lead créé")]
    };
    fsAddDoc(fsCollection(db,"leads"),doc).then(()=>addToast("✓ "+fullName+" ajouté")).catch(()=>addToast("Erreur d'ajout","error"));
    setModal(null);
  };

  const newsletterEntryOf=(lead)=>{
    const np=normPhone(lead.phone), ne=normEmail(lead.email);
    return newsletter.find(n=>(np&&normPhone(n.phone)===np)||(ne&&normEmail(n.email)===ne))||null;
  };

  const moveLead=(id,col)=>{
    const lead=leads.find(l=>l.id===id);
    if(!lead||lead.column===col) return;
    if(col==="envoye"&&!envoyeReady(lead)){
      addToast("Pour passer en Envoyé : statut, typologie, téléphone et email requis","error");
      setModal({type:"detail",lead});
      return;
    }
    if(col==="envoye"&&!lead.envoiEnvoye){
      setModal({type:"envoi",lead}); // le déplacement se fera à l'envoi du mail
      return;
    }
    if(col==="en_recherche"&&!criteriaComplete(lead.criteria)){
      setModal({type:"gate",lead});
      return;
    }
    const moveExtra = col==="valide" ? {validatedAt:nowISO()} : (col==="sans_suite" ? {sansSuiteAt:nowISO()} : (col==="envoye" ? {envoyeAt:nowISO()} : (col==="en_recherche" ? {partage:true} : {})));
    fsUpdateDoc(fsDocRef(db,"leads",id),{
      column:col, lastActivity:nowISO(), ...moveExtra,
      history:[...(lead.history||[]),mkEvent("",eventLabel(col))]
    }).then(()=>{
      addToast(PIPELINE_COLS.find(c=>c.id===col)?.label+" — "+lead.name);
      if(col==="envoye") copyLeadToNewsletter(lead);
      if(col==="valide" && !lead.papernestEnvoye) setModal({type:"papernest",lead});
      if(col==="sans_suite"){ const nl=newsletterEntryOf(lead); if(nl) setModal({type:"nlkeep",lead,nlId:nl.id}); }
    });
  };

  const relanceAction=(lead)=>{
    const newCount=(lead.relanceCount||0)+1;
    if(newCount>=3){
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
        column:"sans_suite", relanceCount:newCount, lastActivity:nowISO(), sansSuiteAt:nowISO(),
        history:[...(lead.history||[]),mkEvent("❌","3 relances sans réponse — passé en Sans suite")]
      }).then(()=>addToast(lead.name+" passé en Sans suite","error"));
    } else {
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
        relanceCount:newCount, lastActivity:nowISO(),
        history:[...(lead.history||[]),mkEvent("📵",`Relance ${newCount}/3 — pas de réponse`)]
      }).then(()=>addToast("Relance "+newCount+"/3 — "+lead.name));
    }
  };

  const markTodoDone=(lead,g)=>{
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
      todoSnooze:{key:todoSnoozeKey(lead,g.key), until:todoSnoozeUntil(g.key)}, lastActivity:nowISO(),
      history:[...(lead.history||[]),mkEvent("✓","Tâche faite : "+g.label)]
    }).then(()=>addToast("✓ "+lead.name+" — "+g.label)).catch(()=>addToast("Erreur","error"));
  };

  const togglePaid=(lead)=>{
    const paid=!lead.paid;
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
      paid, lastActivity:nowISO(),
      history:[...(lead.history||[]),mkEvent(paid?"💶":"↩️",paid?"Marqué payé":"Paiement annulé")]
    }).then(()=>addToast(paid?"✓ Marqué payé":"Paiement annulé"));
  };

  const saveDetail=(lead,form,targetCol)=>{
    // Barrière Envoyé : on sauve les éditions mais on ne déplace en Envoyé qu'à l'envoi du mail (via le popup).
    const gateEnvoi = targetCol==="envoye" && lead.column!=="envoye" && !lead.envoiEnvoye;
    const effTarget = gateEnvoi ? lead.column : targetCol;
    const colChanged = effTarget!==lead.column;
    const hist=[...(lead.history||[])];
    if(colChanged) hist.push(mkEvent("",eventLabel(effTarget)));
    const valExtra = (effTarget==="valide" && lead.column!=="valide") ? {validatedAt:nowISO()} : {};
    const ssExtra = (effTarget==="sans_suite" && lead.column!=="sans_suite") ? {sansSuiteAt:nowISO()} : {};
    const evExtra = (effTarget==="envoye" && lead.column!=="envoye") ? {envoyeAt:nowISO()} : {};
    const partageExtra = (effTarget==="en_recherche") ? {partage:true} : {};
    // Prénom et NOM séparés ; le nom complet affiché = « Prénom NOM ». La newsletter suit.
    const newFirst=(form.firstName||"").trim(), newLast=(form.lastName||"").trim();
    const newName=[newFirst,newLast].filter(Boolean).join(" ")||lead.name;
    if(newFirst!==(lead.firstName||"") || newLast!==(lead.lastName||"") || newName!==lead.name){
      const nl=newsletterEntryOf({...lead,phone:form.phone,email:form.email});
      if(nl && (nl.firstName!==newFirst || nl.lastName!==newLast || nl.name!==newName)) fsUpdateDoc(fsDocRef(db,"newsletter",nl.id),{firstName:newFirst, lastName:newLast, name:newName}).catch(()=>{});
    }
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),{
      name:newName, firstName:newFirst, lastName:newLast, phone:form.phone, email:form.email, notes:form.notes, adresseBien:(form.adresseBien||"").trim(),
      personnes:cleanPeople(form.personnes), garants:cleanPeople(form.garants),
      criteria:form.criteria, column:effTarget, assignedTo:asArray(form.assignedTo), assignTouched:true, ...valExtra, ...ssExtra, ...evExtra, ...partageExtra,
      lastActivity:nowISO(), history:hist
    }).then(()=>{
      addToast("✓ "+lead.name+" mis à jour");
      if(gateEnvoi){ setModal({type:"envoi",lead:{...lead,email:form.email,name:newName,firstName:newFirst,criteria:form.criteria}}); return; }
      if(targetCol==="valide" && lead.column!=="valide" && !lead.papernestEnvoye){ setModal({type:"papernest",lead:{...lead,email:form.email,name:newName,firstName:newFirst}}); return; }
      if(effTarget==="sans_suite" && lead.column!=="sans_suite"){ const nl=newsletterEntryOf({...lead,phone:form.phone,email:form.email}); if(nl){ setModal({type:"nlkeep",lead:{...lead,name:newName},nlId:nl.id}); return; } }
      setModal(null);
    });
  };

  const deleteLead=(lead)=>{
    if(!confirm("Supprimer "+lead.name+" ?")) return;
    fsDeleteDoc(fsDocRef(db,"leads",lead.id)).then(()=>{addToast(lead.name+" supprimé");setModal(null);});
  };

  const mergeLeads=(keep,drop)=>{
    if(!keep||!drop) return;
    const hist=[...(keep.history||[]),...(drop.history||[]),mkEvent("🔗","Fusionnée avec le doublon « "+drop.name+" »")].sort((a,b)=>new Date(a.at||0)-new Date(b.at||0));
    const notes=[keep.notes,drop.notes].filter(Boolean).join("\n— — —\n");
    fsUpdateDoc(fsDocRef(db,"leads",keep.id),{
      phone:keep.phone||drop.phone||"",
      email:keep.email||drop.email||"",
      criteria:mergeCriteria(keep.criteria,drop.criteria),
      calendlyRdv:keep.calendlyRdv||drop.calendlyRdv||null,
      whatsappContact:keep.whatsappContact||drop.whatsappContact||null,
      calendlyEventUri:keep.calendlyEventUri||drop.calendlyEventUri||null,
      notes:notes, history:hist, lastActivity:nowISO()
    }).then(()=>fsDeleteDoc(fsDocRef(db,"leads",drop.id)))
      .then(()=>{addToast("✓ Fiches fusionnées");setModal(null);})
      .catch(()=>addToast("Erreur de fusion","error"));
  };

  const q=search.toLowerCase();
  const activeLeads = leads.filter(l=>!l.archived);
  const filteredLeads = activeLeads.filter(l=>!q||l.name.toLowerCase().includes(q)||(l.phone||"").includes(q)||(l.email||"").toLowerCase().includes(q));

  // Vue par rôle : admin (Charles) voit tout le pipeline ; Emmy/Aya seulement leurs leads.
  // L'onglet "En recherche" reste commun à tout le monde (non filtré).
  const myRole = roleOfEmail(user.email);
  const isAdmin = myRole==="admin";
  const pipelineLeads = isAdmin
    ? (pipeFilter==="all" ? filteredLeads : filteredLeads.filter(l=>asArray(l.assignedTo).includes(pipeFilter)))
    : filteredLeads.filter(l=>asArray(l.assignedTo).includes(myRole) || l.partage===true || l.envoiEnvoye===true || VISIBLE_PAR_TOUS.includes(l.column));

  const partnersOf=(lead)=>{ if(!lead) return []; const ph=normPhone(lead.phone); const em=normEmail(lead.email); return activeLeads.filter(o=>o.id!==lead.id && ((ph&&normPhone(o.phone)===ph)||(em&&normEmail(o.email)===em))); };
  const dupeIds=new Set();
  activeLeads.forEach(l=>{ if(partnersOf(l).length>0) dupeIds.add(l.id); });

  return(
    <>
      <style>{CSS}</style>
      <div className="app">
        <aside className="sb">
          <div className="sb-brand">
            <img src="logo-soloc-inverse.svg" alt="Soloc'" style={{height:30,display:"block"}}/>
          </div>
          <div className="sb-nav">
            <div className={"nav-item"+(tab==="pipeline"?" active":"")} onClick={()=>setTab("pipeline")}><Ic n="trendUp" s={16}/>Pipeline</div>
            <div className={"nav-item"+(tab==="recherche"?" active":"")} onClick={()=>setTab("recherche")}><Ic n="table" s={16}/>Recherche</div>
            <div className={"nav-item"+(tab==="newsletter"?" active":"")} onClick={()=>setTab("newsletter")}><Ic n="mail" s={16}/>Newsletter</div>
            <div className={"nav-item"+(tab==="biens"?" active":"")} onClick={()=>setTab("biens")}><Ic n="home" s={16}/>Biens</div>
            <div className={"nav-item"+(tab==="partenaires"?" active":"")} onClick={()=>setTab("partenaires")}><Ic n="users" s={16}/>Partenaires</div>
            <div className={"nav-item"+(tab==="registre"?" active":"")} onClick={()=>setTab("registre")}><Ic n="fileText" s={16}/>Registre</div>
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="pilotage"?" active":"")} onClick={()=>setTab("pilotage")}><Ic n="trendUp" s={16}/>Pilotage</div>}
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="stats"?" active":"")} onClick={()=>setTab("stats")}><Ic n="chart" s={16}/>Statistiques</div>}
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="finance"?" active":"")} onClick={()=>setTab("finance")}><Ic n="wallet" s={16}/>Finance</div>}
            {user.email===FINANCE_EMAIL&&<div className={"nav-item"+(tab==="archives"?" active":"")} onClick={()=>setTab("archives")}><Ic n="folder" s={16}/>Archives</div>}
          </div>
          <div className="sb-footer">
            <div className="sb-user">{displayNameFromEmail(user.email)}</div>
            <button className="logout-btn" onClick={()=>fsSignOut(auth)}><Ic n="logout" s={14}/>Se déconnecter</button>
          </div>
        </aside>

        <div className="content">
          {tab==="registre"
            ? <RegistrePage lettres={lettres} isAdmin={isAdmin} addToast={addToast}/>
            : (tab==="pilotage"&&user.email===FINANCE_EMAIL)
            ? <PilotagePage user={user} leads={leads}/>
            : (tab==="stats"&&user.email===FINANCE_EMAIL)
            ? <StatsPage leads={leads}/>
            : (tab==="finance"&&user.email===FINANCE_EMAIL)
            ? <FinancePage user={user} leads={leads} addToast={addToast} isMobile={isMobile}/>
            : (tab==="archives"&&user.email===FINANCE_EMAIL)
            ? <ArchivesPage leads={leads} lettres={lettres} addToast={addToast} isMobile={isMobile}/>
            : tab==="partenaires"
            ? <PartenairesPage user={user} addToast={addToast}/>
            : tab==="biens"
            ? <BiensPage user={user} newsletter={newsletter} leads={leads} addToast={addToast}/>
            : tab==="newsletter"
            ? <NewsletterPage user={user} rows={newsletter} addToast={addToast}/>
            : (<>
              <div className="topbar">
                <div>
                  <div className="pt">{tab==="pipeline"?"Pipeline":"Recherche"}</div>
                  <div className="ps">{tab==="pipeline"?pipelineLeads.length+" lead"+(pipelineLeads.length!==1?"s":"")+" au total":"Recherches en cours en un coup d'œil"}</div>
                </div>
                <div className="tb-right">
                  <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
                  {tab==="pipeline"&&isAdmin&&(
                    <div className="seg" style={{flexShrink:0}}>
                      <button type="button" className={"seg-btn"+(pipeFilter==="all"?" active":"")} onClick={()=>setPipeFilter("all")}>Tous</button>
                      <button type="button" className={"seg-btn"+(pipeFilter==="emmy"?" active":"")} style={pipeFilter==="emmy"?{background:ASSIGNEES.emmy.color,borderColor:ASSIGNEES.emmy.color,color:"#fff"}:{}} onClick={()=>setPipeFilter("emmy")}>Emmy</button>
                      <button type="button" className={"seg-btn"+(pipeFilter==="aya"?" active":"")} style={pipeFilter==="aya"?{background:ASSIGNEES.aya.color,borderColor:ASSIGNEES.aya.color,color:"#fff"}:{}} onClick={()=>setPipeFilter("aya")}>Aya</button>
                    </div>
                  )}
                  {tab==="pipeline"&&<button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un lead</button>}
                  <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
                </div>
              </div>
              <div className="main">
                {tab==="pipeline"
                  ? <><TodayPanel leads={filteredLeads} role={myRole} filter={pipeFilter} onOpen={lead=>setModal({type:"detail",lead})} onDone={markTodoDone}/><KanbanBoard leads={pipelineLeads} onOpen={lead=>setModal({type:"detail",lead})} onMove={moveLead} onRelanceAction={relanceAction} onTogglePaid={togglePaid} isMobile={isMobile} dupeIds={dupeIds} isAdmin={isAdmin}/></>
                  : <RechercheTable leads={filteredLeads} search={search}/>}
              </div>
            </>)}
        </div>

        <nav className="bottom-nav">
          <button className={"bn-item"+(tab==="pipeline"?" active":"")} onClick={()=>setTab("pipeline")}><Ic n="trendUp" s={21}/>Pipeline</button>
          <button className={"bn-item"+(tab==="recherche"?" active":"")} onClick={()=>setTab("recherche")}><Ic n="table" s={21}/>Recherche</button>
          <button className={"bn-item"+(tab==="newsletter"?" active":"")} onClick={()=>setTab("newsletter")}><Ic n="mail" s={21}/>News</button>
          <button className={"bn-item"+(tab==="biens"?" active":"")} onClick={()=>setTab("biens")}><Ic n="home" s={21}/>Biens</button>
          <button className={"bn-item"+(tab==="partenaires"?" active":"")} onClick={()=>setTab("partenaires")}><Ic n="users" s={21}/>Agents</button>
          <button className={"bn-item"+(tab==="registre"?" active":"")} onClick={()=>setTab("registre")}><Ic n="fileText" s={21}/>Registre</button>
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="pilotage"?" active":"")} onClick={()=>setTab("pilotage")}><Ic n="trendUp" s={21}/>Pilotage</button>}
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="stats"?" active":"")} onClick={()=>setTab("stats")}><Ic n="chart" s={21}/>Stats</button>}
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="finance"?" active":"")} onClick={()=>setTab("finance")}><Ic n="wallet" s={21}/>Finance</button>}
          {user.email===FINANCE_EMAIL&&<button className={"bn-item"+(tab==="archives"?" active":"")} onClick={()=>setTab("archives")}><Ic n="folder" s={21}/>Archives</button>}
        </nav>
      </div>

      {modal?.type==="add"&&<AddLeadModal onSave={addLead} onClose={()=>setModal(null)}/>}
      {(modal?.type==="detail"||modal?.type==="gate")&&
        <LeadDetailModal lead={modal.lead} gateTarget={modal.type==="gate"} onClose={()=>setModal(null)} onSave={saveDetail} onDelete={deleteLead}
          dupePartners={partnersOf(modal.lead)} onMerge={(p)=>setModal({type:"merge",a:modal.lead,b:p})} isAdmin={isAdmin} onAddNewsletter={addToNewsletter} onPapernest={(l)=>setModal({type:"papernest",lead:l})}/>}
      {modal?.type==="merge"&&
        <MergeModal leadA={modal.a} leadB={modal.b} onClose={()=>setModal(null)} onConfirm={mergeLeads}/>}
      {modal?.type==="papernest"&&
        <PapernestModal lead={modal.lead} user={user} onClose={()=>setModal(null)} addToast={addToast}/>}
      {modal?.type==="envoi"&&
        <EnvoiModal lead={modal.lead} user={user} onClose={()=>setModal(null)} addToast={addToast} onSent={copyLeadToNewsletter}/>}
      {modal?.type==="nlkeep"&&
        <NewsletterKeepModal lead={modal.lead} nlId={modal.nlId} onClose={()=>setModal(null)} addToast={addToast}/>}

      <div className="toast-wrap">
        {toasts.map(t=><div key={t.id} className={"toast"+(t.type==="error"?" error":"")}>{t.text}</div>)}
      </div>
    </>
  );
}

function boot(){
  const fb = window.__fb;
  auth = fb.auth; db = fb.db;
  fsOnAuthStateChanged = fb.onAuthStateChanged;
  fsSignIn = fb.signInWithEmailAndPassword;
  fsSignOut = fb.signOut;
  fsCollection = fb.collection;
  fsOnSnapshot = fb.onSnapshot;
  fsAddDoc = fb.addDoc;
  fsDocRef = fb.doc;
  fsUpdateDoc = fb.updateDoc;
  fsDeleteDoc = fb.deleteDoc;
  fsSetDoc = fb.setDoc;
  fsGetDoc = fb.getDoc;
  fsRunTransaction = fb.runTransaction;
  // Le remplissage automatique du navigateur (Chrome « adresses ») injectait les infos de l'utilisateur
  // dans les fiches clients : on le coupe partout sauf sur l'écran de connexion.
  // Chrome ignore « off » et les valeurs inventées pour ses suggestions d'adresses ; une valeur reconnue
  // mais sans rapport (« one-time-code ») remplace sa détection par libellé (Prénom, Email…).
  const noAutofill=()=>document.querySelectorAll("#root input, #root textarea").forEach(el=>{
    if(el.closest(".login-card")||el.getAttribute("autocomplete")==="one-time-code") return;
    if(["checkbox","radio","date","datetime-local","number","file"].includes(el.type)) return;
    el.setAttribute("autocomplete","one-time-code");
    el.setAttribute("name","crm-"+Math.random().toString(36).slice(2));
  });
  new MutationObserver(noAutofill).observe(document.getElementById("root"),{childList:true,subtree:true});
  // Photos de biens supprimées (7 jours) : on masque l'image cassée plutôt que l'icône d'erreur
  document.addEventListener("error",e=>{
    const t=e.target; if(!t||t.tagName!=="IMG") return;
    const src=t.src||"", m=src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);
    if(m && !t.dataset.retry){ t.dataset.retry="1"; t.referrerPolicy="no-referrer"; t.src="https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600"; return; }
    if(/googleusercontent|drive\.google|ibb\.co/.test(src)) t.style.visibility="hidden";
  },true);
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
}
if(window.__fb) boot(); else window.addEventListener("fbready", boot, {once:true});
</script>
<script>
// Démarrage rapide : le code du CRM est traduit (Babel) une seule fois puis gardé en mémoire
// dans le navigateur. Il n'est retraduit que si le code change (mise à jour du CRM).
(function(){
  var src = document.getElementById("app-source").textContent;
  var KEY = "soloc-crm-compiled-v1";
  var h = 2166136261; for (var i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }
  var hash = (h >>> 0).toString(36) + "-" + src.length;
  function run(code){ var s = document.createElement("script"); s.text = code; document.body.appendChild(s); }
  try {
    var cached = JSON.parse(localStorage.getItem(KEY) || "null");
    if (cached && cached.hash === hash && cached.code) { run(cached.code); return; }
  } catch (e) {}
  var b = document.createElement("script");
  b.src = "https://unpkg.com/@babel/standalone/babel.min.js";
  b.onload = function(){
    var out = Babel.transform(src, { presets: [["react",{runtime:"classic"}]] }).code;
    try { localStorage.setItem(KEY, JSON.stringify({ hash: hash, code: out })); } catch (e) {}
    run(out);
  };
  document.head.appendChild(b);
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
