}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-size:14px;line-height:1.5;}
.brand-font{font-family:"Sora",sans-serif;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ardoise);}
.login-card{background:var(--surface);border-radius:20px;padding:38px 36px;width:360px;box-shadow:var(--sh-lg);}
.login-logo{width:50px;height:50px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;margin:0 auto 18px;font-family:"Sora",sans-serif;}
.login-title{font-family:"Sora",sans-serif;font-weight:800;font-size:21px;text-align:center;color:var(--text);margin-bottom:4px;letter-spacing:-.02em;}
.login-sub{text-align:center;font-size:12px;color:var(--text3);margin-bottom:26px;}
.login-err{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;padding:9px 12px;border-radius:9px;margin-bottom:14px;text-align:center;}

/* LAYOUT */
.app{display:flex;min-height:100vh;}
.sb{width:222px;min-height:100vh;background:var(--ardoise);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
.sb-brand{padding:22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:"Sora",sans-serif;}
.sb-name{font-weight:800;font-size:17px;color:#fff;font-family:"Sora",sans-serif;letter-spacing:-.02em;}
.sb-sub{font-size:10px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.06em;}
.sb-nav{padding:14px 10px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.65);cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.sb-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08);}
.sb-user{font-size:12px;color:rgba(255,255,255,.85);font-weight:700;margin-bottom:8px;}
.logout-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.75);padding:8px 11px;border-radius:9px;cursor:pointer;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;width:100%;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,.16);color:#fff;}

.content{display:flex;flex-direction:column;flex:1;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.pt{font-size:21px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;}
.ps{color:var(--text3);font-size:12px;font-weight:500;margin-top:2px;}
.tb-right{display:flex;align-items:center;gap:10px;}
.main{padding:24px 28px;overflow-y:auto;flex:1;}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 13px;width:230px;color:var(--text3);}
.search-bar input{border:none;background:transparent;outline:none;font-family:"Inter",sans-serif;font-size:13px;color:var(--text);width:100%;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-family:"Inter",sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(193,97,79,.3);}
.btn-p:hover{background:var(--accent-d);}
.btn-g{background:transparent;border:1.5px solid var(--border2);color:var(--text2);}
.btn-g:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-success{background:var(--green);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.ib{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:8px;transition:all .15s;display:flex;align-items:center;}
.ib:hover{color:var(--accent);background:var(--accent-l);}

/* KANBAN */
.kb-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;}
.kb-col{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:220px;width:220px;flex-shrink:0;transition:all .15s;}
.kb-col.drag-over{background:var(--accent-l);border-color:var(--accent-l2);}
.kb-col-hd{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:0 2px;}
.kb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kb-col-title{font-size:12px;font-weight:700;color:var(--text);flex:1;}
.kb-count{background:var(--border2);color:var(--text2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;}
.kb-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px;cursor:grab;transition:all .15s;}
.kb-card:active{cursor:grabbing;}
.kb-card:hover{box-shadow:var(--sh-md);}
.kb-card.warn{border-left:3px solid var(--orange);}
.kb-card.paid{border-left:3px solid var(--green);background:var(--green-bg);}
.kb-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px;}
.kb-meta{font-size:11px;color:var(--text3);display:flex;flex-direction:column;gap:3px;margin-bottom:6px;}
.kb-crit{font-size:11px;color:var(--text2);font-weight:600;background:var(--surface2);border-radius:6px;padding:3px 7px;display:inline-block;margin-bottom:6px;}
.kb-badges{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;}
.badge.orange{background:var(--orange-bg);color:#92400e;}
.badge.relance{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.badge.green{background:var(--green-bg);color:#166534;}
.kb-empty{text-align:center;padding:18px 0;color:var(--text3);font-size:11px;font-style:italic;}
.relance-act{width:100%;margin-top:7px;padding:6px 0;border-radius:8px;border:1.5px solid var(--orange);background:var(--orange-bg);color:#92400e;font-weight:700;font-size:11px;cursor:pointer;font-family:"Inter",sans-serif;}
.relance-act:hover{background:var(--orange);color:#fff;}
.paid-row{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;}

/* TABLE (Recherche) */
.list-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
.list-table th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:11px 12px;border-bottom:1.5px solid var(--border);text-align:left;background:var(--surface2);}
.list-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);}
.list-table tr:last-child td{border-bottom:none;}
.list-table tr:hover td{background:var(--surface2);}
.td-name{color:var(--text);font-weight:700;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state .es-ic{font-size:34px;margin-bottom:10px;}
.empty-state .es-t{font-weight:700;color:var(--text);margin-bottom:4px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(44,62,80,.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);padding:20px;}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);}
.modal-title{font-size:18px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}
.modal-section{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px;padding-bottom:5px;border-bottom:1.5px solid var(--accent-l2);}
.gate-banner{background:var(--accent-l);border:1.5px solid var(--accent-l2);border-radius:10px;padding:11px 13px;font-size:12px;font-weight:700;color:var(--accent-d);margin-bottom:14px;}

/* FORM */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.fi{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:9px;font-family:"Inter",sans-serif;font-size:13px;font-weight:500;outline:none;transition:all .15s;}
.fi:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-l);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.ferr{color:var(--red);font-size:12px;font-weight:600;margin-bottom:10px;}
.seg{display:flex;gap:7px;}
.seg-btn{flex:1;padding:8px 0;border-radius:9px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text2);font-weight:700;font-size:12px;cursor:pointer;font-family:"Inter",sans-serif;text-align:center;}
.seg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* HISTORY */
.hist-item{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-text{font-size:12px;color:var(--text2);font-weight:600;}
.hist-date{font-size:10px;color:var(--text3);}

/* TOAST */
@keyframes slideIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ardoise);color:#fff;padding:12px 16px;border-radius:11px;box-shadow:var(--sh-lg);font-size:13px;font-weight:600;min-width:240px;animation:slideIn .25s ease;}
.toast.error{background:var(--red);}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* PARTENAIRES */
.pt-actions{display:flex;gap:6px;justify-content:flex-end;}
.agency-badge{background:var(--accent-l);color:var(--accent-d);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;}

/* CALENDLY */
.rdv-bubble{display:flex;align-items:flex-start;gap:7px;background:#EFF6FF;border:1.5px solid #DBEAFE;border-radius:8px;padding:7px 9px;margin-top:6px;}
.rdv-bubble-dot{width:7px;height:7px;border-radius:50%;background:#3B82F6;flex-shrink:0;margin-top:3px;}
.rdv-bubble-date{font-size:11px;color:#1d4ed8;font-weight:700;}
.rdv-bubble-sub{font-size:10px;color:#3b82f6;margin-top:1px;}
.rdv-detail-block{background:#EFF6FF;border:1.5px solid #DBEAFE;border-radius:10px;padding:11px 13px;margin-bottom:8px;}
/* WHATSAPP */
.wa-bubble{display:flex;align-items:flex-start;gap:7px;background:#DCFCE7;border:1.5px solid #86EFAC;border-radius:8px;padding:7px 9px;margin-top:6px;}
.wa-bubble-dot{width:7px;height:7px;border-radius:50%;background:#25D366;flex-shrink:0;margin-top:3px;}
.wa-bubble-date{font-size:11px;color:#15803d;font-weight:700;}
.wa-bubble-sub{font-size:10px;color:#16a34a;margin-top:1px;}
.wa-detail-block{background:#DCFCE7;border:1.5px solid #86EFAC;border-radius:10px;padding:11px 13px;margin-bottom:8px;}
.wa-detail-title{font-size:11px;font-weight:700;color:#15803d;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.wa-detail-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #bbf7d0;font-size:12px;}
.wa-detail-row:last-child{border-bottom:none;}
.wa-detail-key{color:#16a34a;font-weight:500;}
.wa-detail-val{font-weight:700;color:#166534;}
.rdv-detail-title{font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.rdv-detail-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dbeafe;font-size:12px;}
.rdv-detail-row:last-child{border-bottom:none;}
.rdv-detail-key{color:#3b82f6;font-weight:500;}
.rdv-detail-val{font-weight:700;color:#1e40af;}
.rdv-message-block{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap;margin-top:6px;}
.biens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.bien-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .15s;}
.bien-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
.bien-card-photo{width:100%;aspect-ratio:4/3;background:#1e2b38;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:13px;overflow:hidden;}
.bien-card-photo img{width:100%;height:100%;object-fit:contain;background:#1e2b38;}
.bien-card-body{padding:12px 14px;}
.bien-card-type{display:inline-block;background:var(--accent-l);color:var(--accent-d);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;margin-bottom:6px;}
.bien-card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.bien-card-addr{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.bien-card-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px;}
.bien-card-loyer{font-size:16px;font-weight:700;color:var(--accent);}
.bien-card-loyer-sub{font-size:10px;color:var(--text3);font-weight:400;}
.bien-card-attrs{display:flex;gap:8px;font-size:11px;color:var(--text3);}
.bien-card-attr{display:flex;align-items:center;gap:3px;}
.dispo-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.dispo-badge.ok{background:var(--green-bg);color:#166534;}
.dispo-badge.soon{background:var(--orange-bg);color:#92400e;}

/* BIENS — fiche détail */
.bien-detail-wrap{display:flex;gap:0;min-height:0;}
.bien-detail-left{width:42%;flex-shrink:0;border-right:1px solid var(--border);}
.bien-detail-photos{position:relative;background:#2C3E50;}
.bien-detail-main-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.bien-detail-main-placeholder{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(255,255,255,.3);font-size:13px;}
.photo-nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.photo-nav-btn.prev{left:10px;} .photo-nav-btn.next{right:10px;}
.photo-counter-badge{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;}
.thumbs-row{display:flex;gap:4px;padding:6px;background:var(--surface2);overflow-x:auto;}
.thumb-img{width:54px;height:40px;border-radius:6px;object-fit:cover;cursor:pointer;border:2px solid transparent;flex-shrink:0;background:var(--ardoise-l);}
.thumb-img.active{border-color:var(--accent);}
.bien-detail-info{padding:14px 16px;}
.bien-detail-typebadge{display:inline-block;background:var(--accent-l);color:var(--accent-d);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:8px;}
.bien-detail-title{font-size:16px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;margin-bottom:4px;}
.bien-detail-addr{font-size:12px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.bien-detail-attrs{display:flex;gap:14px;font-size:12px;color:var(--text2);border-top:1px solid var(--border);padding-top:10px;}
.bien-detail-attr{display:flex;align-items:center;gap:4px;font-weight:600;}

/* BIENS — 5 cartes droite */
.bien-detail-right{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.bc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;}
.bc-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bc-label{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.bc-val{font-size:20px;font-weight:800;color:var(--accent);font-family:"Sora",sans-serif;}
.bc-sub{font-size:11px;color:var(--text2);margin-top:3px;font-weight:600;}
.annexe-pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--text2);margin:2px;}
.info-item{margin-bottom:5px;}
.info-item-label{font-size:10px;color:var(--text3);font-weight:600;}
.info-item-val{font-size:12px;font-weight:700;color:var(--text);}
.meuble-tag{display:inline-block;background:var(--green-bg);color:#166534;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;}

/* Honoraires simulateur */
.hono-pills{display:flex;gap:6px;margin-bottom:8px;}
.hono-pill{flex:1;padding:7px 4px;border-radius:9px;border:1.5px solid var(--border2);background:var(--surface2);text-align:center;cursor:pointer;transition:all .15s;}
.hono-pill:hover{border-color:var(--accent);}
.hono-pill.active{background:var(--accent-l);border-color:var(--accent);}
.hono-pill-title{font-size:10px;font-weight:700;color:var(--text2);}
.hono-pill.active .hono-pill-title{color:var(--accent-d);}
.hono-pill-price{font-size:13px;font-weight:800;color:var(--accent);}
.hono-recap{background:var(--surface2);border-radius:9px;padding:9px 11px;font-size:12px;}
.hono-recap-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);}
.hono-recap-row:last-child{border-bottom:none;padding-top:5px;margin-top:2px;}
.hono-recap-label{color:var(--text2);}
.hono-recap-val{font-weight:700;color:var(--text);}
.hono-recap-total{font-size:14px;font-weight:800;color:var(--accent);}
.hono-custom-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;color:var(--text2);}
.hono-custom-row input{width:80px;}
.hono-note{font-size:10px;color:var(--text3);text-align:center;margin-top:5px;}

/* Upload zone */
.upload-zone{border:2px dashed var(--border2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;font-size:12px;color:var(--text3);}
.upload-zone:hover{border-color:var(--accent);color:var(--accent);}
.upload-progress{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden;}
.upload-progress-bar{height:100%;background:var(--accent);transition:width .2s;}

/* TO-DO */
.todo-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.todo-date-label{font-size:18px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;}
.todo-date-today-badge{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-l);border-radius:20px;padding:2px 9px;margin-left:8px;vertical-align:middle;}
.todo-progress-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:20px;}
.todo-progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.todo-progress-label{font-size:13px;font-weight:700;color:var(--text);}
.todo-progress-pct{font-size:20px;font-weight:800;font-family:"Sora",sans-serif;}
.todo-progress-bar-bg{background:var(--surface2);border-radius:20px;height:9px;overflow:hidden;}
.todo-progress-bar-fill{height:100%;border-radius:20px;transition:width .3s ease;}
.todo-add-row{display:flex;gap:8px;margin-bottom:18px;}
.todo-add-row input{flex:1;}
.todo-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.todo-item{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 14px;transition:all .15s;}

function useToasts(){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((text,type="info")=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,text,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3400);
  },[]);
  return [toasts,add];
}

function useIsMobile(){
  const [m,setM]=useState(typeof window!=="undefined" && window.innerWidth<=768);
  useEffect(()=>{
    const h=()=>setM(window.innerWidth<=768);
    window.addEventListener("resize",h);
    return ()=>window.removeEventListener("resize",h);
  },[]);
  return m;
}

// ─── LOGIN SCREEN ────────────────────────────────────────────────────────
function LoginScreen(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);

  const submit=(e)=>{
    e.preventDefault();
    setError("");
    if(!email||!password){setError("Renseigne email et mot de passe.");return;}
    setLoading(true);
    fsSignIn(auth,email.trim(),password)
      .catch(err=>{
        const map={
          "auth/invalid-email":"Email invalide.",
          "auth/user-not-found":"Compte introuvable.",
          "auth/wrong-password":"Mot de passe incorrect.",
          "auth/invalid-credential":"Email ou mot de passe incorrect.",
          "auth/too-many-requests":"Trop de tentatives, réessaie plus tard."
        };
        setError(map[err.code]||"Erreur de connexion.");
      })
      .finally(()=>setLoading(false));
  };

  return(
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-logo">S</div>
        <div className="login-title">soloc' CRM</div>
        <div className="login-sub">Connexion à l'espace pro</div>
        {error&&<div className="login-err">{error}</div>}
        <div className="fg">
          <label className="fl">Email</label>
          <input className="fi" type="email" value={email} onChange={e=>setEmail(e.target.value)} autoFocus/>
        </div>
        <div className="fg">
          <label className="fl">Mot de passe</label>
          <input className="fi" type="password" value={password} onChange={e=>setPassword(e.target.value)}/>
        </div>
        <button className="btn btn-p btn-block" type="submit" disabled={loading} style={{marginTop:8}}>
          {loading?"Connexion…":"Se connecter"}
        </button>
      </form>
    </div>
  );
}

// ─── LEAD CARD ───────────────────────────────────────────────────────────
function LeadCard({lead, onOpen, onDragStart, onRelanceAction, onTogglePaid, isDupe}){
  const stale = ACTIVE_ALERT_COLS.includes(lead.column) && daysSince(lead.lastActivity)>=3;
  const cls = ["kb-card"];
  if(stale) cls.push("warn");
  if(lead.column==="valide"&&lead.paid) cls.push("paid");
  const typoArr = asArray(lead.criteria && lead.criteria.typologie);
  const critSummary = typoArr.length ? (typoArr.join("/")+" · "+(lead.criteria.secteur||"—")+" · "+(lead.criteria.loyer?lead.criteria.loyer+"€":"—")) : null;

  return(
    <div className={cls.join(" ")} draggable onDragStart={e=>onDragStart(e,lead.id)} onClick={()=>onOpen(lead)}>
      <div className="kb-card-name">{lead.name}</div>
      <div className="kb-meta">
        {lead.phone&&<span>📞 {lead.phone}</span>}
        {lead.email&&<span>✉️ {lead.email}</span>}
      </div>
      {critSummary&&<div className="kb-crit">{critSummary}</div>}
      <div className="kb-badges">
        {lead.assignedTo&&ASSIGNEES[lead.assignedTo]&&<span className="badge" style={{background:ASSIGNEES[lead.assignedTo].color,color:"#fff"}}>{ASSIGNEES[lead.assignedTo].label}</span>}
        {!lead.assignedTo&&<span className="badge" style={{background:"var(--surface2)",color:"var(--text3)",border:"1px solid var(--border2)"}}>Non assigné</span>}
        {isDupe&&<span className="badge orange">⚠ Doublon possible</span>}
        {lead.column==="relance"&&lead.relanceCount>0&&<span className="badge relance">Relance {lead.relanceCount}/3</span>}
        {stale&&<span className="badge orange">⚠ {Math.floor(daysSince(lead.lastActivity))}j sans suivi</span>}
        {lead.column==="valide"&&lead.paid&&<span className="badge green">✓ Payé</span>}
      </div>
      {lead.column==="relance"&&(
        <button className="relance-act" onClick={e=>{e.stopPropagation();onRelanceAction(lead);}}>Pas de réponse</button>
      )}
      {lead.column==="valide"&&(
        <div className="paid-row" onClick={e=>{e.stopPropagation();onTogglePaid(lead);}}>
          <input type="checkbox" checked={!!lead.paid} onChange={()=>{}} readOnly/> Marquer payé
        </div>
      )}
      {lead.calendlyRdv&&(
        <div className="rdv-bubble">
          <div className="rdv-bubble-dot"></div>
          <div>
            <div className="rdv-bubble-date">📅 {lead.calendlyRdv.dateLabel}</div>
            <div className="rdv-bubble-sub">RDV Calendly · {lead.calendlyRdv.eventName||"Appel"}</div>
          </div>
        </div>
      )}
      {lead.whatsappContact&&(
        <div className="wa-bubble">
          <div className="wa-bubble-dot"></div>
          <div>
            <div className="wa-bubble-date">💬 {lead.whatsappContact.dateLabel}</div>
            <div className="wa-bubble-sub">Envoyé sur WhatsApp</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── KANBAN BOARD ────────────────────────────────────────────────────────
function KanbanBoard({leads, onOpen, onMove, onRelanceAction, onTogglePaid, isMobile, dupeIds}){
  const [dragOver,setDragOver]=useState(null);
  const [selStage,setSelStage]=useState("premier_contact");
  const dragId=useRef(null);

  const sortCol=(colLeads)=>{
    return [...colLeads].sort((a,b)=>{
      const sa = ACTIVE_ALERT_COLS.includes(a.column)&&daysSince(a.lastActivity)>=3;
      const sb = ACTIVE_ALERT_COLS.includes(b.column)&&daysSince(b.lastActivity)>=3;
      if(sa&&!sb) return -1;
      if(sb&&!sa) return 1;
      if(sa&&sb) return daysSince(b.lastActivity)-daysSince(a.lastActivity);
      return new Date(b.lastActivity||0)-new Date(a.lastActivity||0);
    });
  };

  if(isMobile){
    const counts={};
    PIPELINE_COLS.forEach(c=>{counts[c.id]=leads.filter(l=>l.column===c.id).length;});
    const colLeads=sortCol(leads.filter(l=>l.column===selStage));
    return(
      <div>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:12,marginBottom:6}}>
          {PIPELINE_COLS.map(col=>{
            const on=selStage===col.id;
            return(
              <button key={col.id} onClick={()=>setSelStage(col.id)} style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:on?"var(--accent)":"var(--border2)",background:on?"var(--accent)":"var(--surface2)",color:on?"#fff":"var(--text2)",fontSize:12,fontWeight:700,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6,fontFamily:"'Inter',sans-serif",cursor:"pointer",flexShrink:0}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:col.color,display:"inline-block"}}></span>{col.label}
                <span style={{background:on?"rgba(255,255,255,.25)":"var(--border2)",borderRadius:20,padding:"0 6px",fontSize:11}}>{counts[col.id]}</span>
              </button>
            );
          })}
        </div>
        {colLeads.length===0
          ?<div style={{textAlign:"center",padding:"40px 0",color:"var(--text3)",fontSize:13,fontStyle:"italic"}}>Aucun lead à cette étape</div>
          :colLeads.map(lead=>(
            <LeadCard key={lead.id} lead={lead} onOpen={onOpen} onDragStart={()=>{}} onRelanceAction={onRelanceAction} onTogglePaid={onTogglePaid} isDupe={dupeIds&&dupeIds.has(lead.id)}/>
          ))}
      </div>
    );
  }

  return(
    <div className="kb-wrap">
      {PIPELINE_COLS.map(col=>{
        const colLeads = sortCol(leads.filter(l=>l.column===col.id));
        return(
          <div key={col.id} className={"kb-col"+(dragOver===col.id?" drag-over":"")}
            onDragOver={e=>{e.preventDefault();setDragOver(col.id);}}
            onDragLeave={()=>setDragOver(null)}
            onDrop={e=>{e.preventDefault();setDragOver(null);if(dragId.current)onMove(dragId.current,col.id);dragId.current=null;}}>
            <div className="kb-col-hd">
              <span className="kb-dot" style={{background:col.color}}/>
              <span className="kb-col-title">{col.label}</span>
              <span className="kb-count">{colLeads.length}</span>
            </div>
            {colLeads.length===0&&<div className="kb-empty">Aucun lead</div>}
            {colLeads.map(lead=>(
              <LeadCard key={lead.id} lead={lead} onOpen={onOpen}
                onDragStart={(e,id)=>{dragId.current=id;e.dataTransfer.setData("text",id);}}
                onRelanceAction={onRelanceAction} onTogglePaid={onTogglePaid} isDupe={dupeIds&&dupeIds.has(lead.id)}/>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// ─── ADD LEAD MODAL ──────────────────────────────────────────────────────
function AddLeadModal({onSave,onClose}){
  const [form,setForm]=useState({firstName:"",lastName:"",phone:"",email:"",assignedTo:""});
  const [err,setErr]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const submit=()=>{
    const hasIdentity = form.firstName.trim()||form.lastName.trim();
    const hasContact = form.phone.trim()||form.email.trim();
    if(!hasIdentity){setErr("Renseigne au moins un prénom ou un nom.");return;}
    if(!hasContact){setErr("Renseigne au moins un téléphone ou un email.");return;}
    if(!form.assignedTo){setErr("Choisis qui suit ce lead : Emmy ou Aya.");return;}
    onSave(form);
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Ajouter un lead</div>
        <div className="modal-sub">Le lead sera créé directement dans la colonne « Premier contact ».</div>
        {err&&<div className="ferr">{err}</div>}
        <div className="fr">
          <div className="fg"><label className="fl">Prénom</label><input className="fi" autoFocus value={form.firstName} onChange={e=>set("firstName",e.target.value)}/></div>
          <div className="fg"><label className="fl">NOM</label><input className="fi" value={form.lastName} onChange={e=>set("lastName",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>
        <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
        <div className="fg">
          <label className="fl">Assigné à *</label>
          <div className="seg">
            {Object.keys(ASSIGNEES).map(k=>(
              <button key={k} type="button" className={"seg-btn"+(form.assignedTo===k?" active":"")} style={form.assignedTo===k?{background:ASSIGNEES[k].color,borderColor:ASSIGNEES[k].color,color:"#fff"}:{}} onClick={()=>set("assignedTo",k)}>{ASSIGNEES[k].label}</button>

          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={submit}><Ic n="check" s={13}/>Ajouter</button>
        </div>
      </div>
    </div>
  );
}

// ─── MERGE MODAL (fusion de doublons) ────────────────────────────────────
function MergeModal({leadA, leadB, onClose, onConfirm}){
  const [keepId,setKeepId]=useState(null);
  const colLabel=(id)=>{const c=PIPELINE_COLS.find(x=>x.id===id);return c?c.label:(id||"—");};
  const critSum=(l)=>{const t=asArray(l.criteria&&l.criteria.typologie);return t.length?(t.join("/")+" · "+((l.criteria&&l.criteria.secteur)||"—")):"—";};
  const canal=(l)=>{ if(l.calendlyRdv&&l.whatsappContact) return "Calendly + WhatsApp"; if(l.calendlyRdv) return "Calendly"; if(l.whatsappContact) return "WhatsApp"; return "Manuel"; };
  const card=(l)=>{
    const sel=keepId===l.id;
    return(
      <div onClick={()=>setKeepId(l.id)} style={{border:"2px solid",borderColor:sel?"var(--accent)":"var(--border)",borderRadius:12,padding:13,cursor:"pointer",background:"var(--surface)"}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:8}}>{l.name}</div>
        <div style={{fontSize:11,color:"var(--text2)",lineHeight:1.9}}>
          <div>📞 {l.phone||"—"}</div>
          <div>✉️ {l.email||"—"}</div>
          <div>Étape : <b>{colLabel(l.column)}</b></div>
          <div>Critères : {critSum(l)}</div>
          <div>Canal : {canal(l)}</div>
          <div>Créée le {fmtDate(l.createdAt)}</div>
        </div>
        <div style={{marginTop:10,padding:7,borderRadius:8,textAlign:"center",fontSize:12,fontWeight:700,background:sel?"var(--accent)":"var(--surface2)",color:sel?"#fff":"var(--text2)"}}>{sel?"✓ Principal":"Garder comme principal"}</div>
      </div>
    );
  };
  const keep = keepId===leadA.id?leadA:(keepId===leadB.id?leadB:null);
  const drop = keep?(keep.id===leadA.id?leadB:leadA):null;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Fusionner les doublons</div>
        <div className="modal-sub">Choisis la fiche à conserver comme principale. L'autre sera fusionnée dedans puis supprimée.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          {card(leadA)}
          {card(leadB)}
        </div>
        <div style={{background:"var(--surface2)",borderRadius:9,padding:"11px 13px",fontSize:12,color:"var(--text2)",lineHeight:1.6,marginBottom:14}}>
          {keep
            ? "Fiche conservée : "+keep.name+" (étape "+colLabel(keep.column)+"). On complète ses champs vides depuis l'autre, on cumule les critères, on garde les canaux Calendly/WhatsApp, on fusionne historiques et remarques, puis « "+drop.name+" » est supprimée."
            : "Sélectionne la fiche principale ci-dessus pour voir le résultat."}
        </div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" disabled={!keep} onClick={()=>onConfirm(keep,drop)}><Ic n="check" s={13}/>Fusionner</button>
        </div>
      </div>
    </div>
  );
}

const ATOUTS_LIST = ["Ascenseur","Balcon","Terrasse","Cave","Parking","Garage","Cuisine équipée","Gardien","Interphone","Dernier étage","Lumineux","Traversant","Calme","Rénové","Parquet","Fibre"];
const HONO_AGENCE_M2 = 13.2;
const HONO_SOLOC_DEF = 890;
const bienLoc = (b)=>b.secteur||b.titre||"";
const bienRue = (b)=>b.rue||"";
const bienLoyerCC = (b)=>b.loyerCC||b.loyer||"";
const bienAtouts = (b)=>asArray((b.atouts&&b.atouts.length)?b.atouts:b.annexes);
const bienTitre = (b)=>{ const parts=[b.typologie,b.surface?b.surface+" m²":""].filter(Boolean); const loc=bienLoc(b); return (parts.join(" · ")+(loc?" · "+loc:""))||"Bien"; };
const honoAgenceOf = (b)=>Math.round((parseFloat(b.surface)||0)*HONO_AGENCE_M2);
const honoSolocOf = (b)=>{ const v=parseFloat(b.honoSoloc); return isNaN(v)?HONO_SOLOC_DEF:v; };
const depotOf = (b)=>{ const hc=parseFloat(b.loyerHC||b.loyer)||0; return Math.round(hc*(b.meuble?2:1)); };
const FRAIS_PAR_M2 = 13.12;

// ─── HONORAIRES CALC ─────────────────────────────────────────────────────
function HonorairesCalc({surface, onSelect}){
  const [profil,setProfil]=useState(null);
  const [customVal,setCustomVal]=useState("");
  const frais = Math.round((parseFloat(surface)||0)*FRAIS_PAR_M2);
  const honos = profil==="etudiant"?890:profil==="cdi"?990:profil==="autre"?(parseInt(customVal)||null):null;
  const total = (honos&&frais)?honos+frais:null;
  const labelMap={"etudiant":"Étudiant","cdi":"CDI essai validé","autre":"Autre profil"};
  useEffect(()=>{
    if(onSelect) onSelect({profil,label:profil?labelMap[profil]:null,honos,frais,total});
  },[profil,customVal]);
  return(
    <div>
      <div className="hono-pills">
        {[["etudiant","Étudiant","890 €"],["cdi","CDI essai validé","990 €"],["autre","Autre profil","Sur devis"]].map(([k,l,p])=>(
          <div key={k} className={"hono-pill"+(profil===k?" active":"")} onClick={()=>setProfil(k)}>
            <div className="hono-pill-title">{l}</div>
            <div className="hono-pill-price">{p}</div>
          </div>
        ))}
      </div>
      {profil==="autre"&&(
        <div className="hono-custom-row">
          <span>Nos honoraires :</span>
          <input className="fi" type="number" value={customVal} onChange={e=>setCustomVal(e.target.value)} placeholder="ex: 750"/>
          <span>€</span>
        </div>
      )}
      {profil&&(profil!=="autre"||customVal)?(
        <div className="hono-recap">
          <div className="hono-recap-row"><span className="hono-recap-label">Honoraires SOLOC'</span><span className="hono-recap-val">{honos} €</span></div>
          <div className="hono-recap-row"><span className="hono-recap-label">Frais d'agence ({surface||"?"} m² × 13,12 €)</span><span className="hono-recap-val">{frais} €</span></div>
          <div className="hono-recap-row"><span className="hono-recap-label" style={{fontWeight:700,color:"var(--text)"}}>Total client</span><span className="hono-recap-val hono-recap-total">{total} €</span></div>
        </div>
      ):(
        profil&&<div style={{fontSize:11,color:"var(--text3)",textAlign:"center",padding:"6px 0"}}>Saisis le montant pour voir le récap</div>
      )}
      <div className="hono-note">Paiement au résultat · Zéro frais avant signature du bail</div>
    </div>
  );
}

    var css="@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;background:#fff;color:#2C3E50;font-size:14px;}.page{max-width:800px;margin:0 auto;border:1px solid #E5D9C6;}.header{background:#2C3E50;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;}.hleft{display:flex;align-items:center;gap:12px;}.logo{width:40px;height:40px;background:#C1614F;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;font-family:'Sora',sans-serif;}.brand{color:#fff;font-size:18px;font-weight:800;font-family:'Sora',sans-serif;}.brand-sub{color:rgba(255,255,255,.5);font-size:9px;letter-spacing:.08em;}.hbadge{background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;}.hero{width:100%;height:300px;overflow:hidden;background:#E7E0D4;}.hero img{width:100%;height:100%;object-fit:cover;display:block;}.thumbs{display:flex;gap:3px;}.thumb{flex:1;height:96px;overflow:hidden;background:#E7E0D4;position:relative;}.thumb img{width:100%;height:100%;object-fit:cover;display:block;}.thumb-more{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(44,62,80,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:'Sora',sans-serif;}.body{padding:20px 30px;}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}.t-rue{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;color:#2C3E50;line-height:1.1;}.t-loc{font-size:13px;color:#9AA7B2;font-weight:600;margin-top:4px;}.t-loyer{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;color:#C1614F;line-height:1;text-align:right;white-space:nowrap;}.t-loyer-sub{font-size:11px;color:#9AA7B2;font-weight:600;margin-top:3px;text-align:right;}.stats-bar{display:flex;border:1px solid #E5D9C6;border-radius:12px;overflow:hidden;margin-top:16px;}.stat{flex:1;padding:12px 8px;text-align:center;border-right:1px solid #E5D9C6;}.stat:last-child{border-right:none;}.statfirst{background:#FBF7F0;}.stat-label{font-size:9px;color:#9AA7B2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}.stat-val{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;color:#2C3E50;}.sec{font-size:10px;font-weight:800;color:#C1614F;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 7px;}.pill{display:inline-block;background:#F2E8DA;color:#5A6B7B;border:1px solid #E5D9C6;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;margin:3px 4px 0 0;}.desc{font-size:13px;color:#5A6B7B;line-height:1.65;}.hono{margin-top:16px;background:#FBF7F0;border:1px solid #E5D9C6;border-radius:12px;padding:14px;}.hono-grid{display:flex;gap:8px;}.hono-box{flex:1;background:#fff;border:1px solid #E5D9C6;border-radius:9px;padding:9px;text-align:center;}.hb-label{font-size:9px;color:#9AA7B2;margin-bottom:3px;}.hb-val{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:#2C3E50;}.hono-note{font-size:10px;color:#9AA7B2;text-align:center;margin-top:9px;}.footer{background:#2C3E50;padding:13px 30px;display:flex;align-items:center;justify-content:space-between;}.footer-brand{color:#fff;font-weight:700;font-size:12px;}.footer-contact{color:rgba(255,255,255,.6);font-size:10px;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.page{max-width:100%;border:none;}}";
    var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><title>Fiche - '+titre+'</title><style>'+css+'</style></head><body><div class="page">';

    html+=honoHtml;
    html+='</div>';
    html+='<div class="footer"><div class="footer-brand">SOLOC\' - Chasseur locatif Lyon</div><div class="footer-contact">solocimmo.fr - contact@solocimmo.fr</div></div></div>';
    html+='<script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script>';
    html+='</body></html>';
    var blob=new Blob([html],{type:"text/html;charset=utf-8"});
    var url=URL.createObjectURL(blob);

    if(!w){
      var a=document.createElement("a");

      a.style.display="none"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      addToast("Fiche téléchargée — ouvre le fichier et Cmd+P pour PDF");

  };

  return(

            {onSend&&<button className="btn btn-p btn-sm" onClick={onSend}><Ic n="mail" s={12}/>Envoyer</button>}

        <div className="bien-detail-wrap">

              {photos.length>1&&<>
                <button className="photo-nav-btn prev" onClick={prev}><Ic n="chevL" s={13}/></button>
                <button className="photo-nav-btn next" onClick={next}><Ic n="chevR" s={13}/></button>
                <div className="photo-counter-badge">{photoIdx+1} / {photos.length}</div>

            {photos.length>1&&(
              <div className="thumbs-row">
                {photos.map((u,i)=>(
                  <img key={i} src={u} className={"thumb-img"+(i===photoIdx?" active":"")} onClick={()=>setPhotoIdx(i)} alt={"photo "+(i+1)}/>
                ))}
              </div>
            )}
            <div className="bien-detail-info">
              <span className="bien-detail-typebadge">{bien.typologie||"—"} · {bien.surface||"?"} m²</span>
              <div className="bien-detail-title">{titre}</div>
              <div className="bien-detail-addr"><Ic n="pin" s={13}/>{addr||"Secteur non renseigné"}</div>
              {bien.video&&<a href={bien.video} target="_blank" rel="noreferrer" className="bien-detail-attr" style={{marginTop:8,display:"inline-flex",color:"var(--accent)"}}><Ic n="upload" s={12}/>Voir la vidéo</a>}
            </div>
          </div>
          <div className="bien-detail-right">
            <div className="bc-row2">
              <div className="bc">
                <div className="bc-label"><Ic n="plus" s={12}/>Loyer</div>
                <div className="bc-val">{loyerCC} €</div>
                <div className="bc-sub">Charges comprises</div>
                <div className="bc-sub" style={{marginTop:4}}>Dépôt de garantie : {depot} €</div>
              </div>
              <div className="bc">
                <div className="bc-label"><Ic n="building" s={12}/>Atouts</div>
                {atouts.length>0
                  ?<div style={{marginTop:4}}>{atouts.map(a=><span key={a} className="annexe-pill">{a}</span>)}</div>
                  :<div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Aucun atout</div>}

            <div className="bc-row2">

                {bien.etage&&<div className="info-item"><div className="info-item-label">Étage</div><div className="info-item-val">{bien.etage}</div></div>}
                <div className="info-item"><div className="info-item-label">État</div><div className="info-item-val"><span className={bien.meuble?"meuble-tag":""} style={bien.meuble?{}:{fontWeight:700}}>{bien.meuble?"Meublé":"Vide"}</span></div></div>

// ─── ENVOI D'UN BIEN PAR MAIL ────────────────────────────────────────────
function SendBienModal({bien, newsletter, leads, user, onClose, addToast}){
  const typo = bien.typologie;
  const nlMatch = (newsletter||[]).filter(n=>asArray(n.typologie).includes(typo) && (n.email||"").trim());
  const missionMatch = (leads||[]).filter(l=>l.column==="en_recherche" && asArray(l.criteria&&l.criteria.typologie).includes(typo) && (l.email||"").trim());
  const myRole = roleOfEmail(user.email);
  const [sendNl,setSendNl]=useState(true);
  const [sendMi,setSendMi]=useState(true);
  const [sender,setSender]=useState((myRole==="emmy"||myRole==="aya")?myRole:"equipe");
  const [sending,setSending]=useState(false);
  const total = (sendNl?nlMatch.length:0)+(sendMi?missionMatch.length:0);
  const senderLabels={emmy:"Emmy",aya:"Aya",equipe:"Équipe SOLOC'"};

  const send=()=>{
    if(!SEND_BIEN_WEBAPP_URL){ addToast("Envoi non configuré (URL manquante)","error"); return; }
    if(!sendNl&&!sendMi){ addToast("Coche au moins une liste","error"); return; }
    if(total===0){ addToast("Aucun destinataire ne correspond","error"); return; }
    setSending(true); addToast("Envoi en cours…");
    fetch(SEND_BIEN_WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({bienId:bien.id, newsletter:sendNl, mission:sendMi, sender:sender})})
      .then(()=>{ setTimeout(()=>{ setSending(false); addToast("✓ Bien envoyé à "+total+" destinataire"+(total>1?"s":"")); onClose(); },1000); })
      .catch(()=>{ setSending(false); addToast("Erreur d'envoi","error"); });
  };

  const box=(checked,setF,title,sub)=>(
    <label style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",border:"1.5px solid",borderColor:checked?"var(--accent)":"var(--border2)",borderRadius:10,marginBottom:8,cursor:"pointer",background:checked?"var(--accent-l)":"var(--surface)"}}>
      <input type="checkbox" checked={checked} onChange={e=>setF(e.target.checked)}/>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{title}</div><div style={{fontSize:11,color:"var(--text3)"}}>{sub}</div></div>
    </label>
  );

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Envoyer le bien</div>
        <div className="modal-sub">{bienTitre(bien)} · typologie {typo||"—"}</div>
        <div className="modal-section">À qui ?</div>
        {box(sendNl,setSendNl,"Newsletter",nlMatch.length+" contact"+(nlMatch.length!==1?"s":"")+" qui cherche"+(nlMatch.length!==1?"nt":"")+" du "+(typo||"—"))}
        {box(sendMi,setSendMi,"Lettre de Mission (En recherche)",missionMatch.length+" client"+(missionMatch.length!==1?"s":"")+" suivi"+(missionMatch.length!==1?"s":"")+" · honoraires selon profil")}
        <div className="modal-section">Signature du mail</div>
        <div className="seg">
          {["emmy","aya","equipe"].map(s=>(
            <button key={s} type="button" className={"seg-btn"+(sender===s?" active":"")} onClick={()=>setSender(s)}>{senderLabels[s]}</button>
          ))}
        </div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>Envoi depuis hello@solocimmo.fr — un mail personnalisé par destinataire (honoraires selon profil).</div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>{total===0?"Fermer":"Annuler"}</button>
          <button className="btn btn-p" onClick={send} disabled={sending||total===0}><Ic n="mail" s={13}/>{sending?"Envoi…":"Envoyer ("+total+")"}</button>
        </div>
      </div>
    </div>
  );
}

function BiensPage({user, newsletter, leads, addToast}){
  const [biens,setBiens]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null); // null | {type:'add'} | {type:'edit',bien} | {type:'detail',bien}

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"biens"),snap=>{
      const data=snap.docs.map(d=>({id:d.id,...d.data()}));
      data.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
      setBiens(data); setLoading(false);
    },()=>addToast("Erreur chargement biens","error"));
    return unsub;
  },[]);

  const saveBien=(form)=>{
    if(modal?.type==="edit"){
      fsUpdateDoc(fsDocRef(db,"biens",modal.bien.id),{...form,updatedAt:nowISO()})
        .then(()=>{addToast("✓ Bien mis à jour");setModal(null);})
        .catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"biens"),{...form,createdAt:nowISO()})
        .then(ref=>{addToast("✓ Bien ajouté");setModal({type:"send",bien:{...form,id:ref.id}});})
        .catch(()=>addToast("Erreur","error"));
    }
  };

  const deleteBien=(bien)=>{
    if(!confirm("Supprimer ce bien ?")) return;
    fsDeleteDoc(fsDocRef(db,"biens",bien.id))
      .then(()=>{addToast("Bien supprimé");setModal(null);})
      .catch(()=>addToast("Erreur","error"));
  };

  const q=search.toLowerCase();
  const rows=biens.filter(b=>!q||bienLoc(b).toLowerCase().includes(q)||bienRue(b).toLowerCase().includes(q)||(b.typologie||"").toLowerCase().includes(q));

  const BienThumb=({b})=>{
    const cover=b.photos&&b.photos[0];
    const typ=b.typologie&&b.surface?`${b.typologie} · ${b.surface} m²`:(b.typologie||"Bien");
    const dispo=b.dispoAsap?"Dispo maintenant":(b.dateDisponibilite?"Dès le "+fmtDate(b.dateDisponibilite):"");
    return(
      <div className="bien-card" onClick={()=>setModal({type:"detail",bien:b})}>
        <div className="bien-card-photo">
          {cover?<img src={cover} alt={typ}/>:<><Ic n="img" s={28}/></>}
        </div>
        <div className="bien-card-body">
          <span className="bien-card-type">{typ}</span>
          <div className="bien-card-title">{bienLoc(b)||bienRue(b)||"—"}</div>
          <div className="bien-card-addr"><Ic n="pin" s={12}/>{bienRue(b)||"Rue non renseignée"}</div>
          <div className="bien-card-bottom">
            <div><span className="bien-card-loyer">{bienLoyerCC(b)} €</span><span className="bien-card-loyer-sub"> CC/mois</span></div>
            <div className="bien-card-attrs">
              {b.surface&&<span className="bien-card-attr"><Ic n="search" s={11}/>{b.surface} m²</span>}
              {b.meuble!==undefined&&<span className={b.meuble?"dispo-badge ok":"dispo-badge soon"}>{b.meuble?"Meublé":"Vide"}</span>}
            </div>
          </div>
        </div>
      </div>
    );
  };

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Biens disponibles</div>
          <div className="ps">{biens.length} bien{biens.length!==1?"s":""} en portefeuille</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un bien</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading&&<div className="empty-state"><div className="es-t">Chargement…</div></div>}
        {!loading&&rows.length===0&&(
          <div className="empty-state">
            <div className="es-ic">🏠</div>
            <div className="es-t">{search?"Aucun résultat":"Aucun bien en portefeuille"}</div>
            <div>{search?"Essaie un autre terme.":"Ajoute tes premiers biens disponibles."}</div>
          </div>
        )}
        {!loading&&rows.length>0&&<div className="biens-grid">{rows.map(b=><BienThumb key={b.id} b={b}/>)}</div>}
      </div>

      {(modal?.type==="add"||modal?.type==="edit")&&(
        <BienFormModal bien={modal.type==="edit"?modal.bien:null} onSave={saveBien} onClose={()=>setModal(null)} onDelete={deleteBien}/>
      )}
      {modal?.type==="detail"&&(
        <BienDetailModal bien={modal.bien} onClose={()=>setModal(null)} addToast={addToast}
          onEdit={()=>setModal({type:"edit",bien:modal.bien})} onSend={()=>setModal({type:"send",bien:modal.bien})}/>
      )}
      {modal?.type==="send"&&(
        <SendBienModal bien={modal.bien} newsletter={newsletter} leads={leads} user={user} onClose={()=>setModal(null)} addToast={addToast}/>
      )}
    </>
  );
}

// ─── PARTENAIRE MODAL ────────────────────────────────────────────────────
function PartenaireModal({partenaire, onSave, onClose}){
  const editing = !!partenaire;
  const [form,setForm]=useState({
    agence: partenaire?.agence||"",
    prenom: partenaire?.prenom||"",
    nom:    partenaire?.nom||"",
    phone:  partenaire?.phone||"",
    email:  partenaire?.email||"",
  });
  const [err,setErr]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const submit=()=>{
    if(!form.prenom.trim()&&!form.nom.trim()){setErr("Renseigne au moins un prénom ou un nom.");return;}
    if(!form.agence.trim()){setErr("Le nom de l'agence est obligatoire.");return;}
    setErr("");
    onSave(form);
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{editing?"Modifier le partenaire":"Ajouter un partenaire"}</div>
        <div className="modal-sub">Les informations seront visibles de Charles et Emmy.</div>
        {err&&<div className="ferr">{err}</div>}
        <div className="fg"><label className="fl">Agence *</label><input className="fi" autoFocus value={form.agence} onChange={e=>set("agence",e.target.value)} placeholder="Ex: Foncia Part-Dieu"/></div>
        <div className="fr">
          <div className="fg"><label className="fl">Prénom</label><input className="fi" value={form.prenom} onChange={e=>set("prenom",e.target.value)}/></div>
          <div className="fg"><label className="fl">NOM</label><input className="fi" value={form.nom} onChange={e=>set("nom",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
        <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={submit}><Ic n="check" s={13}/>{editing?"Enregistrer":"Ajouter"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── PARTENAIRES PAGE ────────────────────────────────────────────────────
function PartenairesPage({user, addToast}){
  const [partenaires,setPartenaires]=useState([]);
  const [modal,setModal]=useState(null); // null | {type:'add'} | {type:'edit', p}
  const [search,setSearch]=useState("");
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"partenaires"),snap=>{
      const data=snap.docs.map(d=>({id:d.id,...d.data()}));
      data.sort((a,b)=>(a.agence||"").localeCompare(b.agence||""));
      setPartenaires(data);
      setLoading(false);
    },()=>addToast("Erreur chargement partenaires","error"));
    return unsub;
  },[]);

  const savePartenaire=(form)=>{
    if(modal?.type==="edit"){
      fsUpdateDoc(fsDocRef(db,"partenaires",modal.p.id),form)
        .then(()=>{addToast("✓ Partenaire mis à jour");setModal(null);})
        .catch(()=>addToast("Erreur de mise à jour","error"));
    } else {
      fsAddDoc(fsCollection(db,"partenaires"),{...form, createdBy:user.email, createdAt:nowISO()})
        .then(()=>{addToast("✓ "+form.prenom+" "+form.nom+" ajouté");setModal(null);})
        .catch(()=>addToast("Erreur d'ajout","error"));
    }
  };

  const deletePartenaire=(p)=>{
    const name=[p.prenom,p.nom].filter(Boolean).join(" ")||p.agence;
    if(!confirm("Supprimer "+name+" ?")) return;
    fsDeleteDoc(fsDocRef(db,"partenaires",p.id))
      .then(()=>addToast(name+" supprimé"))
      .catch(()=>addToast("Erreur de suppression","error"));

  // Charles voit tout le réseau ; les autres voient leurs agents + ceux partagés par Charles
  const isAdmin = user.email===FINANCE_EMAIL;
  const visibles = isAdmin ? partenaires : partenaires.filter(p=>
    p.createdBy===user.email || PARTENAIRES_PARTAGES.indexOf(normEmail(p.email))!==-1

  const q=search.toLowerCase();

    (p.agence||"").toLowerCase().includes(q)||
    (p.prenom||"").toLowerCase().includes(q)||
    (p.nom||"").toLowerCase().includes(q)||
    (p.phone||"").includes(q)||
    (p.email||"").toLowerCase().includes(q)
  );

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Partenaires</div>
          <div className="ps">{visibles.length} agent{visibles.length!==1?"s":""} partenaire{visibles.length!==1?"s":""}{isAdmin?"":" — ton réseau"}</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un partenaire</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading&&<div className="empty-state"><div className="es-t">Chargement…</div></div>}
        {!loading&&rows.length===0&&(
          <div className="empty-state">
            <div className="es-ic">🤝</div>
            <div className="es-t">{search?"Aucun résultat":"Aucun partenaire enregistré"}</div>
            <div>{search?"Essaie un autre terme.":"Ajoute tes agents partenaires pour les retrouver ici."}</div>

        {!loading&&rows.length>0&&(

                  <td>{p.email?<a href={"mailto:"+p.email} style={{color:"var(--accent)",fontWeight:700,textDecoration:"none"}}>{p.email}</a>:"—"}</td>
