// Photo compressée dans le navigateur (1280 px max, JPEG), envoyée au script qui la range dans
// le Drive de hello@ et renvoie une adresse visible par lien (CRM + mails). Supprimée après 7 jours.
const compressImage = (file, max=1280, quality=0.8) => new Promise((resolve, reject) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(/hei[cf]/i.test(file.name||file.type||"") ? "photo HEIC illisible par ce navigateur (utilise Safari, ou exporte la photo en JPEG)" : "image illisible")); };
  img.src = url;
});
// Message lisible quand Google renvoie une page d'erreur HTML au lieu de la réponse du script
const erreurLisible = (t) => {
  const s = String(t||"").trim();
  if (/^<!DOCTYPE|^<html/i.test(s)) { const m = s.match(/<title>([^<]*)<\/title>/i); return "Google a renvoyé une page d'erreur" + (m&&m[1] ? " (« "+m[1].trim()+" »)" : ""); }
  return s.replace(/^ERREUR\s*:?\s*/i, "").slice(0, 200) || "réponse inattendue";
};
const envoyerPhotoUneFois = (data, name) =>
  fetchTimeout(SEND_BIEN_WEBAPP_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify({ action:"uploadPhoto", name, data }) }, 90000)
  .then(r => r.text()).then(t => {
    let j = null; try { j = JSON.parse(t); } catch(e) {}
    if (j && j.ok && j.url) return j.url;
    throw new Error(erreurLisible(t));
  });
// Jusqu'à 3 essais (pause 2 s puis 5 s) : les coupures réseau ou pages d'erreur Google sont souvent passagères
const uploadPhoto = (file) => compressImage(file).then(data => {
  const name = (file.name||"photo").replace(/\.[^.]*$/, "") + ".jpg";

});

const localMonthKey = (iso) => { const d=iso?new Date(iso):new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const validatedISO = (l) => {
  if(l.validatedAt) return l.validatedAt;

};
const archiveMonthOf = (l) => l.archiveMonth || localMonthKey(validatedISO(l));
const readyToArchive = (l) => l.column==="valide" && l.paid===true && !l.archived && archiveMonthOf(l) < localMonthKey();
// Découpe « Prénom Nom » en cherchant le mot qui ressemble le plus à un prénom (liste officielle
// de prénoms, prenoms.js). Mots EN MAJUSCULES mêlés à des minuscules = nom de famille
// (« TOUZANI Farah » → Farah). Particules (Da, El, De…) suivies d'un nom = nom de famille
// (« Da Rocha » reste entier). Aucun prénom reconnu → 1er mot. Prénom TOUT EN MAJUSCULES → « Karima ».
const PRENOMS = new Set(String(window.PRENOMS_FR||"").split("\n").filter(Boolean));
const PARTICULES = new Set(["DA","DE","DI","DU","DOS","DES","EL","AL","LE","LA","VAN","VON","DEL","BEN","BIN","OULD","MAC","MC"]);
const nameKey = (t) => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z-]/g,"");
const isPrenomWord = (t) => { const k=nameKey(t); return !!k && k.split("-").filter(Boolean).every(x=>PRENOMS.has(x)); };
const titleCase = (s) => /[a-zà-ÿ]/.test(s) ? s : String(s).toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const splitFullName = (full) => { const r=splitFullNameRaw(full); return { prenom:titleCase(r.prenom), nom:r.nom }; };
const splitFullNameRaw = (full) => {
  const w=String(full||"").trim().split(/\s+/).filter(Boolean);
  if(w.length<=1) return { prenom:w[0]||"", nom:"" };
  const caps=(t)=>t.length>1 && t===t.toUpperCase() && /[A-ZÀ-Þ]/.test(t);
  const up=w.filter(caps), low=w.filter(t=>!caps(t));
  if(up.length && low.length){
    let pr=PRENOMS.size ? low.filter(isPrenomWord) : low;
    if(!pr.length) pr=low;
    return { prenom:pr.join(" "), nom:w.filter(t=>!pr.includes(t)).join(" ") };
  }
  if(!PRENOMS.size) return { prenom:w[0], nom:w.slice(1).join(" ") };
  const flags=w.map((t,i)=>isPrenomWord(t) && !(PARTICULES.has(nameKey(t)) && i+1<w.length && !isPrenomWord(w[i+1])));
  const i=flags.indexOf(true);
  if(i<0) return PARTICULES.has(nameKey(w[0])) ? { prenom:w.join(" "), nom:"" } : { prenom:w[0], nom:w.slice(1).join(" ") };
  let j=i; while(j+1<w.length && flags[j+1]) j++;
  if(i===0 && j===w.length-1) j=0; // tous les mots ressemblent à des prénoms : le 1er est le prénom
  return { prenom:w.slice(i,j+1).join(" "), nom:w.slice(0,i).concat(w.slice(j+1)).join(" ") };
};
// Prénom mal rempli = vide, ou nom complet rangé dans le prénom (import Calendly / WhatsApp…)
const badFirstName = (o) => { const f=String(o.firstName||"").trim(), n=String(o.name||"").trim();
  return !f || (/\s/.test(f) && (!String(o.lastName||"").trim() || f===n)); };
const splitName = (l) => {

  const rest=String(l.name||"").trim().split(/\s+/).filter(w=>w.toLowerCase()!==f.toLowerCase()).join(" ");
  return { prenom:f, nom:l.lastName||rest };
};

    if(mNum!==montant) upd.montantArchive=mNum;
    fsUpdateDoc(fsDocRef(db,"leads",lead.id),upd).then(()=>{ addToast("✓ Dossier mis à jour"); onClose(); }).catch(()=>addToast("Erreur","error"));
  };
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Modifier le dossier</div>
        <div className="fr">

        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={f.phone} onChange={e=>set("phone",e.target.value)}/></div>
          <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={f.email} onChange={e=>set("email",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Montant de la prestation TTC (€)</label><input className="fi" type="number" value={f.montant} onChange={e=>set("montant",e.target.value)}/></div>
        <div className="fg"><label className="fl">Adresse du bien loué</label><input className="fi" placeholder="N°, rue, code postal, ville" value={f.adresse} onChange={e=>set("adresse",e.target.value)}/></div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={save}><Ic n="check" s={13}/>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

// ─── CSS ─────────────────────────────────────────────────────────────────
const CSS = `@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap");
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FBF7F0;--surface:#FFFFFF;--surface2:#F2E8DA;
  --border:#E5D9C6;--border2:#D8C7AE;
  --ardoise:#2C3E50;--ardoise-l:#3D5266;
  --text:#2C3E50;--text2:#5A6B7B;--text3:#9AA7B2;
  --accent:#C1614F;--accent-d:#A14E3F;--accent-l:#F5E2DD;--accent-l2:#EBC6BB;
  --green:#16A34A;--green-bg:#DCFCE7;
  --red:#DC2626;--red-bg:#FEE2E2;
  --orange:#D97706;--orange-bg:#FEF3C7;
  --sh:0 2px 14px rgba(44,62,80,.07);--sh-md:0 6px 24px rgba(44,62,80,.12);--sh-lg:0 10px 44px rgba(44,62,80,.18);
}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-size:14px;line-height:1.5;}
.brand-font{font-family:"Sora",sans-serif;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ardoise);}
.login-card{background:var(--surface);border-radius:20px;padding:38px 36px;width:360px;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:var(--sh-lg);}
.login-card .login-in{font-size:16px;} /* iPhone : pas de zoom automatique sur le champ */
.login-logo{width:50px;height:50px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;margin:0 auto 18px;font-family:"Sora",sans-serif;}
.login-title{font-family:"Sora",sans-serif;font-weight:800;font-size:21px;text-align:center;color:var(--text);margin-bottom:4px;letter-spacing:-.02em;}
.login-sub{text-align:center;font-size:12px;color:var(--text3);margin-bottom:26px;}
.login-err{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;padding:9px 12px;border-radius:9px;margin-bottom:14px;text-align:center;}

/* LAYOUT */
.app{display:flex;min-height:100vh;}
.sb{width:222px;min-height:100vh;background:var(--ardoise);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
.sb-brand{padding:22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:"Sora",sans-serif;}
.sb-name{font-weight:800;font-size:17px;color:#fff;font-family:"Sora",sans-serif;letter-spacing:-.02em;}
.sb-sub{font-size:10px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.06em;}
.sb-nav{padding:14px 10px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.65);cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.sb-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08);}
.sb-user{font-size:12px;color:rgba(255,255,255,.85);font-weight:700;margin-bottom:8px;}
.logout-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.75);padding:8px 11px;border-radius:9px;cursor:pointer;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;width:100%;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,.16);color:#fff;}

.content{display:flex;flex-direction:column;flex:1;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.pt{font-size:21px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;}
.ps{color:var(--text3);font-size:12px;font-weight:500;margin-top:2px;}
.tb-right{display:flex;align-items:center;gap:10px;}
.main{padding:24px 28px;overflow-y:auto;flex:1;}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 13px;width:230px;color:var(--text3);}
.search-bar input{border:none;background:transparent;outline:none;font-family:"Inter",sans-serif;font-size:13px;color:var(--text);width:100%;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-family:"Inter",sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(193,97,79,.3);}
.btn-p:hover{background:var(--accent-d);}
.btn-g{background:transparent;border:1.5px solid var(--border2);color:var(--text2);}
.btn-g:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-success{background:var(--green);color:#fff;}
.btn-block{width:100%;justify-content:center;}
.ib{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:8px;transition:all .15s;display:flex;align-items:center;}
.ib:hover{color:var(--accent);background:var(--accent-l);}

/* KANBAN */
.kb-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;}
.kb-col{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:220px;width:220px;flex-shrink:0;transition:all .15s;}
.kb-col.drag-over{background:var(--accent-l);border-color:var(--accent-l2);}
.kb-col-hd{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:0 2px;}
.kb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kb-col-title{font-size:12px;font-weight:700;color:var(--text);flex:1;}
.kb-count{background:var(--border2);color:var(--text2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;}
.kb-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px;cursor:grab;transition:all .15s;}
.kb-card:active{cursor:grabbing;}
.kb-card:hover{box-shadow:var(--sh-md);}
.kb-card.warn{border-left:3px solid var(--orange);}
.kb-card.paid{border-left:3px solid var(--green);background:var(--green-bg);}
.kb-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px;}
.kb-meta{font-size:11px;color:var(--text3);display:flex;flex-direction:column;gap:3px;margin-bottom:6px;}
.kb-crit{font-size:11px;color:var(--text2);font-weight:600;background:var(--surface2);border-radius:6px;padding:3px 7px;display:inline-block;margin-bottom:6px;}
.kb-badges{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;}
.badge.orange{background:var(--orange-bg);color:#92400e;}
.badge.relance{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.badge.green{background:var(--green-bg);color:#166534;}
.kb-empty{text-align:center;padding:18px 0;color:var(--text3);font-size:11px;font-style:italic;}
.relance-act{width:100%;margin-top:7px;padding:6px 0;border-radius:8px;border:1.5px solid var(--orange);background:var(--orange-bg);color:#92400e;font-weight:700;font-size:11px;cursor:pointer;font-family:"Inter",sans-serif;}
.relance-act:hover{background:var(--orange);color:#fff;}
.paid-row{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;}

/* TABLE (Recherche) */
.list-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
.list-table th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:11px 12px;border-bottom:1.5px solid var(--border);text-align:left;background:var(--surface2);}
.list-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);}
.list-table tr:last-child td{border-bottom:none;}
.list-table tr:hover td{background:var(--surface2);}
.td-name{color:var(--text);font-weight:700;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state .es-ic{font-size:34px;margin-bottom:10px;}
.empty-state .es-t{font-weight:700;color:var(--text);margin-bottom:4px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(44,62,80,.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);padding:20px;}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);}
.modal-title{font-size:18px;font-weight:800;color:var(--text);font-family:"Sora",sans-serif;letter-spacing:-.02em;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}
.modal-section{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px;padding-bottom:5px;border-bottom:1.5px solid var(--accent-l2);}
.gate-banner{background:var(--accent-l);border:1.5px solid var(--accent-l2);border-radius:10px;padding:11px 13px;font-size:12px;font-weight:700;color:var(--accent-d);margin-bottom:14px;}

/* FORM */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.fi{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:9px;font-family:"Inter",sans-serif;font-size:13px;font-weight:500;outline:none;transition:all .15s;}
.fi:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-l);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

function useToasts(){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((text,type="info")=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,text,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),type==="error"?10000:3400); // erreurs : 10 s pour avoir le temps de lire
  },[]);
  return [toasts,add];
}

function useIsMobile(){
  const [m,setM]=useState(typeof window!=="undefined" && window.innerWidth<=768);
  useEffect(()=>{
    const h=()=>setM(window.innerWidth<=768);
    window.addEventListener("resize",h);
    return ()=>window.removeEventListener("resize",h);
  },[]);
  return m;
}

function LoginScreen(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  // Sur téléphone (et surtout dans l'appli installée sur l'écran d'accueil iPhone), le focus automatique
  // bloque les champs : on ne le garde que sur ordinateur.
  const sansAutoFocus = (window.matchMedia && window.matchMedia("(pointer:coarse)").matches) || window.navigator.standalone===true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

  const submit=(e)=>{
    e.preventDefault();
    setError("");
    if(!email||!password){setError("Renseigne email et mot de passe.");return;}
    setLoading(true);
    fsSignIn(auth,email.trim(),password)
      .catch(err=>{
        const map={
          "auth/invalid-email":"Email invalide.",
          "auth/user-not-found":"Compte introuvable.",
          "auth/wrong-password":"Mot de passe incorrect.",
          "auth/invalid-credential":"Email ou mot de passe incorrect.",
          "auth/too-many-requests":"Trop de tentatives, réessaie plus tard."
        };
        setError(map[err.code]||"Erreur de connexion.");
      })
      .finally(()=>setLoading(false));
  };

  return(
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <img src="logo-soloc-couleur.svg" alt="Soloc'" style={{height:44,display:"block",margin:"0 auto 14px"}}/>
        <div className="login-sub">Connexion à l'espace pro</div>

        <div className="fg">

          <input id="login-email" className="fi login-in" type="email" name="email" autoComplete="username" inputMode="email" autoCapitalize="none" autoCorrect="off" value={email} onChange={e=>setEmail(e.target.value)} autoFocus={!sansAutoFocus}/>
        </div>
        <div className="fg">
          <label className="fl" htmlFor="login-password">Mot de passe</label>
          <input id="login-password" className="fi login-in" type="password" name="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)}/>
        </div>
        <button className="btn btn-p btn-block" type="submit" disabled={loading} style={{marginTop:8}}>
          {loading?"Connexion…":"Se connecter"}
        </button>
      </form>
    </div>
  );
}

// ─── LEAD CARD ───────────────────────────────────────────────────────────
// ─── SECTEUR RÉSUMÉ (pastille compacte « En recherche ») ─────────────────
// « Croix-Rousse, Pentes » → LYON 4 · « Lyon 2, Lyon 3 » → LYON 2/3 · 3 arrondissements ou + → LYON
const QUARTIERS_LYON = [
  ["pentes de la croix-rousse",1],["pentes de la croix rousse",1],
  ["presqu'ile",2],["presquile",2],["bellecour",2],["perrache",2],["confluence",2],["ainay",2],["cordeliers",2],["jacobins",2],["celestins",2],
  ["terreaux",1],["hotel de ville",1],["pentes",1],
  ["part-dieu",3],["part dieu",3],["montchat",3],["villette",3],["sans souci",3],["dauphine",3],["prefecture",3],["paul bert",3],["garibaldi",3],["saxe",3],
  ["croix-rousse",4],["croix rousse",4],
  ["vieux lyon",5],["vieux-lyon",5],["saint-jean",5],["saint jean",5],["st jean",5],["fourviere",5],["point du jour",5],["saint-just",5],["saint just",5],["menival",5],
  ["brotteaux",6],["foch",6],["massena",6],["tete d'or",6],["cite internationale",6],
  ["jean mace",7],["jean-mace",7],["gerland",7],["guillotiere",7],["berthelot",7],
  ["monplaisir",8],["etats-unis",8],["etats unis",8],["bachut",8],["mermoz",8],["grange blanche",8],["laennec",8],
  ["vaise",9],["gorge de loup",9],["duchere",9],["valmy",9],["saint-rambert",9],["ile barbe",9]
];
const MOTS_VIDES_SECTEUR = /^(lyon|lyon centre|centre|centre ville|arrondissement|arrondissements|arr|secteur|proche|idealement|de preference|quartier|quartiers|ou|et|peu importe|tous|tout|)$/;
function secteurCourt(txt){
  if(!txt) return "";
  let s = String(txt).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'");
  const arrs = new Set(); let lyonGeneral = false;
  const addN = n => { n=parseInt(n,10); if(n>=1&&n<=9) arrs.add(n); };
  // « Lyon 3 », « Lyon 3e », « Lyon 2, 3 et 7 », « lyon 9 Lyon 7 »
  s = s.replace(/lyon\s*((?:\d{1,2}\s*(?:er|eme|e)?\b\s*(?:[,/&+-]|et|ou)?\s*)+)/g, (m,nums)=>{ (nums.match(/\d{1,2}/g)||[]).forEach(addN); return ","; });
  // codes postaux 69001…69009 et « 3e arrondissement »
  s = s.replace(/\b6900(\d)\b/g, (m,n)=>{ addN(n); return ","; });
  s = s.replace(/\b(\d)\s*(?:er|eme|e)\s*(?:arr\w*)?\b/g, (m,n)=>{ addN(n); return ","; });
  // quartiers de Lyon
  QUARTIERS_LYON.forEach(([q,n])=>{ if(s.includes(q)){ arrs.add(n); s = s.split(q).join(","); } });
  const autres = [];
  s.split(/[,;/+&\n()]|\bet\b|\bou\b/).map(p=>p.replace(/[.\-]+$/,"").replace(/^[\s.\-]+/,"").replace(/\s+/g," ").trim()).forEach(p=>{
    if(!p) return;
    if(/^lyon\b/.test(p) && MOTS_VIDES_SECTEUR.test(p.replace(/^lyon\s*/,""))){ lyonGeneral = true; return; }
    if(MOTS_VIDES_SECTEUR.test(p) || /^\d+$/.test(p) || /^((de|la|le|les|du|des|l'|d'|a|au|aux|sur|pres|cote|vers)\s*)+$/.test(p)) return;
    const up = p.toUpperCase();
    if(!autres.includes(up)) autres.push(up);
  });
  const liste = [...arrs].sort((a,b)=>a-b);
  let lyon = "";
  if(liste.length===1) lyon = "LYON "+liste[0];
  else if(liste.length===2) lyon = "LYON "+liste.join("/");
  else if(liste.length>2 || lyonGeneral) lyon = "LYON";
  const tout = (lyon?[lyon]:[]).concat(autres);
  if(tout.length<=2) return tout.join(" / ");
  return tout.slice(0,2).join(" / ")+" +"+(tout.length-2);
}

function LeadCard({lead, onOpen, onDragStart, onRelanceAction, onTogglePaid, isDupe, isAdmin}){
  const stale = ACTIVE_ALERT_COLS.includes(lead.column) && daysSince(lead.lastActivity)>=3;
  const cls = ["kb-card"];
  if(stale) cls.push("warn");
  if(isAdmin&&lead.column==="valide"&&lead.paid) cls.push("paid");
  const typoArr = asArray(lead.criteria && lead.criteria.typologie);
  // « En recherche » : critères résumés en une ligne TYPOLOGIE · BUDGET · SECTEUR (le détail reste dans la fiche)
  const cr = lead.criteria||{};
  const critSummary = lead.column==="en_recherche"
    ? ([typoArr.join("/"), cr.loyer?(/€/.test(String(cr.loyer))?String(cr.loyer):cr.loyer+"€"):"", secteurCourt(cr.secteur)].filter(Boolean).join(" · ") || null)
    : (typoArr.length ? (typoArr.join("/")+" · "+(cr.secteur||"—")+" · "+(cr.loyer?cr.loyer+"€":"—")) : null);
  const chip=(bg,fg)=>({fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:20,background:bg,color:fg,whiteSpace:"nowrap"});

  return(
    <div className={cls.join(" ")} draggable onDragStart={e=>onDragStart(e,lead.id)} onClick={()=>onOpen(lead)}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,marginBottom:critSummary?4:5}}>
        <div className="kb-card-name" style={{margin:0}}>{lead.name}</div>
        {asArray(lead.assignedTo).length>0
          ? <span style={{display:"flex",gap:3,flexShrink:0}}>{asArray(lead.assignedTo).filter(a=>ASSIGNEES[a]).map(a=><span key={a} className="badge" style={{background:ASSIGNEES[a].color,color:"#fff"}}>{ASSIGNEES[a].label}</span>)}</span>
          : <span className="badge" style={{background:"var(--surface2)",color:"var(--text3)",border:"1px solid var(--border2)",flexShrink:0}}>Non assigné</span>}
      </div>
      {critSummary&&<div style={{fontSize:lead.column==="en_recherche"?12:11,color:"var(--text2)",fontWeight:lead.column==="en_recherche"?700:600,marginBottom:5,...(lead.column==="en_recherche"?{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}:{})}} title={lead.column==="en_recherche"?cr.secteur:undefined}>{critSummary}</div>}
      {lead.phone&&<div style={{fontSize:10.5,color:"var(--text3)"}}>📞 {lead.phone}</div>}
      {lead.column!=="en_recherche"&&<div className="kb-badges" style={{marginTop:5}}>

// ─── À FAIRE AUJOURD'HUI (en haut du Pipeline) ───────────────────────────
// Emmy / Aya : uniquement leurs clients. Charles : tout le monde (selon le filtre Tous / Emmy / Aya),
// + les dossiers non assignés et les validés non payés.
const isToday = (iso) => { if(!iso) return false; const d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); };
function todayTasks(leads, role, filter){
  const mine = leads.filter(l=>{
    const a=asArray(l.assignedTo);
    if(role!=="admin") return a.includes(role);
    if(filter && filter!=="all") return a.includes(filter);
    return true;
  });
  const groups=[
    {key:"rdv",    icon:"📅", label:"RDV aujourd'hui", color:"#1d4ed8", bg:"#EFF6FF", done:true, hint:"disparaît dès que la fiche est mise à jour ou déplacée après le RDV",
     test:l=>l.calendlyRdv&&l.calendlyRdv.startTime&&isToday(l.calendlyRdv.startTime)
       && !(new Date(l.lastActivity||0).getTime() >= new Date(l.calendlyRdv.startTime).getTime()), // traité après le début du RDV → retiré
     why:l=>"RDV "+(l.calendlyRdv.timeLabel||"")},
    {key:"relance",icon:"📞", label:"À relancer", color:"#b45309", bg:"#FEF3C7", done:true, hint:"disparaît après « Pas de réponse », un déplacement ou ✓ (jusqu'à demain)",
     test:l=>l.column==="relance" && !isToday(l.lastActivity), why:l=>"Prochaine relance : "+((l.relanceCount||0)+1)+"/3"},
    {key:"envoye", icon:"✉️", label:"Dossier envoyé incomplet", color:"#7c3aed", bg:"#F3E8FF", done:true, hint:"disparaît quand formulaire + lettre sont faits, au déplacement, ou ✓ (3 jours)",
     test:l=>l.column==="envoye" && daysSince(l.envoyeAt||l.lastActivity)>=3 && (!l.formulaireRempli||!l.lettreSignee),
     why:l=>"Envoyé il y a "+Math.floor(daysSince(l.envoyeAt||l.lastActivity))+" j — manque "+[!l.formulaireRempli&&"formulaire",!l.lettreSignee&&"lettre"].filter(Boolean).join(" + ")+(l.relanceAutoCount>0?" · 🔁 relance auto "+l.relanceAutoCount+"/3":"")},
    {key:"stale",  icon:"⏳", label:"Sans nouvelles depuis 3 jours ou +", color:"#92400e", bg:"#FFF7ED", done:true, hint:"disparaît dès que la fiche bouge, ou ✓",
     test:l=>ACTIVE_ALERT_COLS.includes(l.column) && daysSince(l.lastActivity)>=3,
     why:l=>(PIPELINE_COLS.find(c=>c.id===l.column)||{}).label+" · "+Math.floor(daysSince(l.lastActivity))+" j sans mouvement"},
    {key:"nonassigne", icon:"👤", label:"Non assignés", color:"#475569", bg:"#F1F5F9", adminOnly:true, hint:"disparaît quand Emmy ou Aya est assignée",
     test:l=>asArray(l.assignedTo).length===0 && !["sans_suite","valide"].includes(l.column), why:l=>"À attribuer à Emmy ou Aya"},
    {key:"nonpaye",icon:"💶", label:"Validés non payés", color:"#15803d", bg:"#DCFCE7", adminOnly:true, hint:"disparaît quand « Payé » est coché",
     test:l=>l.column==="valide" && !l.paid, why:l=>"Validé le "+fmtDate(l.validatedAt||l.lastActivity)}
  ];
  const used=new Set();
  return groups.filter(g=>!g.adminOnly||role==="admin").map(g=>{
    const pool = g.key==="nonassigne" ? (role==="admin"&&(!filter||filter==="all") ? leads : []) : mine;
    const items = pool.filter(l=>!used.has(l.id) && g.test(l) && !todoSnoozed(l,g.key));
    items.forEach(l=>used.add(l.id));
    return {...g, items};
  }).filter(g=>g.items.length);
}
// ✓ « Fait » : la tâche est masquée (RDV : définitivement pour ce RDV ; relance : jusqu'à demain ;
// dossier envoyé / sans nouvelles : 3 jours). La fiche est aussi marquée comme « bougée ».
const todoSnoozeKey = (l,key) => key==="rdv" ? "rdv:"+((l.calendlyRdv&&l.calendlyRdv.startTime)||"") : key;
const todoSnoozed = (l,key) => { const z=l.todoSnooze; return !!(z && z.key===todoSnoozeKey(l,key) && Date.now() < new Date(z.until).getTime()); };
const todoSnoozeUntil = (key) => { const d=new Date();
  if(key==="relance"){ d.setHours(23,59,59,0); return d.toISOString(); }
  if(key==="rdv") return new Date(Date.now()+30*86400000).toISOString();
  return new Date(Date.now()+3*86400000).toISOString(); };
function TodayPanel({leads, role, filter, onOpen, onDone}){

  return(

        : <div style={{padding:"0 16px 12px",display:"grid",gap:12}}>
            {groups.map(g=>{

                  <div style={{fontSize:11,fontWeight:800,color:g.color,textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>{g.icon} {g.label} ({g.items.length}) {g.hint&&<span style={{textTransform:"none",letterSpacing:0,fontWeight:600,color:"var(--text3)"}}>· {g.hint}</span>}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {g.items.slice(0,lim).map(l=>(
                      <div key={l.id} style={{display:"flex",alignItems:"stretch",background:g.bg,borderRadius:10,overflow:"hidden"}}>
                        <button type="button" onClick={()=>onOpen(l)} style={{display:"flex",alignItems:"center",gap:7,background:"transparent",border:"none",padding:"6px 10px",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                          <span style={{fontSize:12.5,fontWeight:800,color:"var(--text)"}}>{l.name}</span>
                          <span style={{fontSize:11,color:"var(--text2)"}}>{g.why(l)}</span>
                          {role==="admin"&&asArray(l.assignedTo).filter(a=>ASSIGNEES[a]).map(a=><span key={a} className="badge" style={{background:ASSIGNEES[a].color,color:"#fff"}}>{ASSIGNEES[a].label}</span>)}
                        </button>
                        {g.done&&onDone&&<button type="button" title="Marquer comme fait" onClick={()=>onDone(l,g)} style={{border:"none",borderLeft:"1px solid rgba(0,0,0,.08)",background:"rgba(255,255,255,.55)",color:g.color,fontWeight:900,fontSize:14,padding:"0 10px",cursor:"pointer"}}>✓</button>}
                      </div>
                    ))}
                    {g.items.length>5&&<button type="button" className="btn btn-g btn-sm" onClick={()=>setShowAll(p=>({...p,[g.key]:!p[g.key]}))}>{showAll[g.key]?"Voir moins":"+ "+(g.items.length-5)+" autres"}</button>}
                  </div>
                </div>
              );
            })}
          </div>)}
    </div>
  );
}

function KanbanBoard({leads, onOpen, onMove, onRelanceAction, onTogglePaid, isMobile, dupeIds, isAdmin}){
  const [dragOver,setDragOver]=useState(null);
  const [selStage,setSelStage]=useState("premier_contact");
  const dragId=useRef(null);

  const sortCol=(colLeads)=>{
    return [...colLeads].sort((a,b)=>{
      const sa = ACTIVE_ALERT_COLS.includes(a.column)&&daysSince(a.lastActivity)>=3;
      const sb = ACTIVE_ALERT_COLS.includes(b.column)&&daysSince(b.lastActivity)>=3;
      if(sa&&!sb) return -1;
      if(sb&&!sa) return 1;
      if(sa&&sb) return daysSince(b.lastActivity)-daysSince(a.lastActivity);
      return new Date(b.lastActivity||0)-new Date(a.lastActivity||0);
    });
  };

  if(isMobile){
    const counts={};
    PIPELINE_COLS.forEach(c=>{counts[c.id]=leads.filter(l=>l.column===c.id).length;});
    const colLeads=sortCol(leads.filter(l=>l.column===selStage));
    return(
      <div>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:12,marginBottom:6}}>
          {PIPELINE_COLS.map(col=>{
            const on=selStage===col.id;
            return(
              <button key={col.id} onClick={()=>setSelStage(col.id)} style={{padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:on?"var(--accent)":"var(--border2)",background:on?"var(--accent)":"var(--surface2)",color:on?"#fff":"var(--text2)",fontSize:12,fontWeight:700,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6,fontFamily:"'Inter',sans-serif",cursor:"pointer",flexShrink:0}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:col.color,display:"inline-block"}}></span>{col.label}
                <span style={{background:on?"rgba(255,255,255,.25)":"var(--border2)",borderRadius:20,padding:"0 6px",fontSize:11}}>{counts[col.id]}</span>
              </button>
            );
          })}
        </div>
        {colLeads.length===0
          ?<div style={{textAlign:"center",padding:"40px 0",color:"var(--text3)",fontSize:13,fontStyle:"italic"}}>Aucun lead à cette étape</div>
          :colLeads.map(lead=>(
            <LeadCard key={lead.id} lead={lead} onOpen={onOpen} onDragStart={()=>{}} onRelanceAction={onRelanceAction} onTogglePaid={onTogglePaid} isDupe={dupeIds&&dupeIds.has(lead.id)} isAdmin={isAdmin}/>
          ))}
      </div>
    );
  }

  return(
    <div className="kb-wrap">
      {PIPELINE_COLS.map(col=>{
        const colLeads = sortCol(leads.filter(l=>l.column===col.id));
        return(
          <div key={col.id} className={"kb-col"+(dragOver===col.id?" drag-over":"")}
            onDragOver={e=>{e.preventDefault();setDragOver(col.id);}}
            onDragLeave={()=>setDragOver(null)}
            onDrop={e=>{e.preventDefault();setDragOver(null);if(dragId.current)onMove(dragId.current,col.id);dragId.current=null;}}>
            <div className="kb-col-hd">
              <span className="kb-dot" style={{background:col.color}}/>
              <span className="kb-col-title">{col.label}</span>
              <span className="kb-count">{colLeads.length}</span>
            </div>
            {colLeads.length===0&&<div className="kb-empty">Aucun lead</div>}
            {colLeads.map(lead=>(
              <LeadCard key={lead.id} lead={lead} onOpen={onOpen}
                onDragStart={(e,id)=>{dragId.current=id;e.dataTransfer.setData("text",id);}}
                onRelanceAction={onRelanceAction} onTogglePaid={onTogglePaid} isDupe={dupeIds&&dupeIds.has(lead.id)} isAdmin={isAdmin}/>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// ─── MERGE MODAL (fusion de doublons) ────────────────────────────────────
function MergeModal({leadA, leadB, onClose, onConfirm}){
  const [keepId,setKeepId]=useState(null);
  const colLabel=(id)=>{const c=PIPELINE_COLS.find(x=>x.id===id);return c?c.label:(id||"—");};
  const critSum=(l)=>{const t=asArray(l.criteria&&l.criteria.typologie);return t.length?(t.join("/")+" · "+((l.criteria&&l.criteria.secteur)||"—")):"—";};
  const canal=(l)=>{ if(l.calendlyRdv&&l.whatsappContact) return "Calendly + WhatsApp"; if(l.calendlyRdv) return "Calendly"; if(l.whatsappContact) return "WhatsApp"; return "Manuel"; };
  const card=(l)=>{
    const sel=keepId===l.id;
    return(
      <div onClick={()=>setKeepId(l.id)} style={{border:"2px solid",borderColor:sel?"var(--accent)":"var(--border)",borderRadius:12,padding:13,cursor:"pointer",background:"var(--surface)"}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:8}}>{l.name}</div>
        <div style={{fontSize:11,color:"var(--text2)",lineHeight:1.9}}>
          <div>📞 {l.phone||"—"}</div>
          <div>✉️ {l.email||"—"}</div>
          <div>Étape : <b>{colLabel(l.column)}</b></div>
          <div>Critères : {critSum(l)}</div>
          <div>Canal : {canal(l)}</div>
          <div>Créée le {fmtDate(l.createdAt)}</div>
        </div>
        <div style={{marginTop:10,padding:7,borderRadius:8,textAlign:"center",fontSize:12,fontWeight:700,background:sel?"var(--accent)":"var(--surface2)",color:sel?"#fff":"var(--text2)"}}>{sel?"✓ Principal":"Garder comme principal"}</div>
      </div>
    );
  };
  const keep = keepId===leadA.id?leadA:(keepId===leadB.id?leadB:null);
  const drop = keep?(keep.id===leadA.id?leadB:leadA):null;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Fusionner les doublons</div>
        <div className="modal-sub">Choisis la fiche à conserver comme principale. L'autre sera fusionnée dedans puis supprimée.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          {card(leadA)}
          {card(leadB)}
        </div>
        <div style={{background:"var(--surface2)",borderRadius:9,padding:"11px 13px",fontSize:12,color:"var(--text2)",lineHeight:1.6,marginBottom:14}}>
          {keep
            ? "Fiche conservée : "+keep.name+" (étape "+colLabel(keep.column)+"). On complète ses champs vides depuis l'autre, on cumule les critères, on garde les canaux Calendly/WhatsApp, on fusionne historiques et remarques, puis « "+drop.name+" » est supprimée."
            : "Sélectionne la fiche principale ci-dessus pour voir le résultat."}
        </div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" disabled={!keep} onClick={()=>onConfirm(keep,drop)}><Ic n="check" s={13}/>Fusionner</button>
        </div>
      </div>
    </div>
  );
}

// ─── RECHERCHE TABLE ─────────────────────────────────────────────────────

  const q=search.toLowerCase();

  if(rows.length===0){
    return(
      <div className="empty-state">
        <div className="es-ic">🔍</div>
        <div className="es-t">Aucune recherche en cours</div>
        <div>Les clients passés en « En recherche » dans le Pipeline apparaîtront ici.</div>
      </div>

  return(
    <div style={{overflowX:"auto"}}>
    <table className="list-table">
      <thead><tr>
        <th>Client</th><th>Suivi par</th><th>Statut</th><th>Typologie</th><th>Surface</th><th>Loyer max</th><th>Secteur</th><th>Logement</th><th>État</th><th>Entrée souhaitée</th><th>Prestations supp.</th>

            <td>{l.criteria.statutClient}{l.criteria.statutClient==="CDI"&&(l.criteria.periodeEssaiValidee?" (essai validé)":" (essai en cours)")}{l.criteria.statutClient==="Colocation"&&(" ("+(parseInt(l.criteria.nbColoc)||2)+" pers.)")}</td>
            <td>{asArray(l.criteria.typologie).join(", ")||"—"}</td>
            <td>{l.criteria.surface} m²</td>
            <td>{l.criteria.loyer} €</td>
            <td>{l.criteria.secteur}</td>
            <td>{asArray(l.criteria.etatLogement).join(" / ")||"Indifférent"}</td>
            <td>{asArray(l.criteria.etatBien).join(" / ")||"—"}</td>
            <td>{l.criteria.dateAsap?"⚡ Dès que possible":fmtDate(l.criteria.dateEntreeSouhaitee)}</td>
            <td>{l.criteria.prestationsSupp||"—"}</td>

        ))}

    </div>
  );

const ATOUTS_LIST = ["Ascenseur","Balcon","Terrasse","Cave","Parking","Garage","Cuisine équipée","Gardien","Interphone","Dernier étage","Lumineux","Traversant","Calme","Rénové","Parquet","Fibre"];
const HONO_AGENCE_M2 = 13.2;
const HONO_SOLOC_DEF = 890;
const bienLoc = (b)=>b.secteur||b.titre||"";
const bienRue = (b)=>b.rue||"";
const bienLoyerCC = (b)=>b.loyerCC||b.loyer||"";
const bienAtouts = (b)=>asArray((b.atouts&&b.atouts.length)?b.atouts:b.annexes);
const bienTitre = (b)=>{ const parts=[b.typologie,b.surface?b.surface+" m²":""].filter(Boolean); const loc=bienLoc(b); return (parts.join(" · ")+(loc?" · "+loc:""))||"Bien"; };
const honoAgenceOf = (b)=>Math.round((parseFloat(b.surface)||0)*HONO_AGENCE_M2);
const honoSolocOf = (b)=>{ const v=parseFloat(b.honoSoloc); return isNaN(v)?HONO_SOLOC_DEF:v; };
const depotOf = (b)=>{ const hc=parseFloat(b.loyerHC||b.loyer)||0; return Math.round(hc*(b.meuble?2:1)); };
const FRAIS_PAR_M2 = 13.12;

// ─── HONORAIRES CALC ─────────────────────────────────────────────────────
function HonorairesCalc({surface, onSelect}){
  const [profil,setProfil]=useState(null);
  const [customVal,setCustomVal]=useState("");
  const frais = Math.round((parseFloat(surface)||0)*FRAIS_PAR_M2);
  const honos = profil==="etudiant"?890:profil==="cdi"?990:profil==="autre"?(parseInt(customVal)||null):null;
  const total = (honos&&frais)?honos+frais:null;
  const labelMap={"etudiant":"Étudiant","cdi":"CDI essai validé","autre":"Autre profil"};
  useEffect(()=>{
    if(onSelect) onSelect({profil,label:profil?labelMap[profil]:null,honos,frais,total});
  },[profil,customVal]);
  return(
    <div>
      <div className="hono-pills">
        {[["etudiant","Étudiant","890 €"],["cdi","CDI essai validé","990 €"],["autre","Autre profil","Sur devis"]].map(([k,l,p])=>(
          <div key={k} className={"hono-pill"+(profil===k?" active":"")} onClick={()=>setProfil(k)}>
            <div className="hono-pill-title">{l}</div>
            <div className="hono-pill-price">{p}</div>
          </div>
        ))}
      </div>
      {profil==="autre"&&(
        <div className="hono-custom-row">
          <span>Nos honoraires :</span>
          <input className="fi" type="number" value={customVal} onChange={e=>setCustomVal(e.target.value)} placeholder="ex: 750"/>
          <span>€</span>
        </div>
      )}
      {profil&&(profil!=="autre"||customVal)?(
        <div className="hono-recap">
          <div className="hono-recap-row"><span className="hono-recap-label">Honoraires SOLOC'</span><span className="hono-recap-val">{honos} €</span></div>
          <div className="hono-recap-row"><span className="hono-recap-label">Frais d'agence ({surface||"?"} m² × 13,12 €)</span><span className="hono-recap-val">{frais} €</span></div>
          <div className="hono-recap-row"><span className="hono-recap-label" style={{fontWeight:700,color:"var(--text)"}}>Total client</span><span className="hono-recap-val hono-recap-total">{total} €</span></div>
        </div>
      ):(
        profil&&<div style={{fontSize:11,color:"var(--text3)",textAlign:"center",padding:"6px 0"}}>Saisis le montant pour voir le récap</div>
      )}

// ─── BIEN FORM MODAL ─────────────────────────────────────────────────────
const blankBien = {typologie:"",surface:"",loyerCC:"",loyerHC:"",rue:"",secteur:"",etage:"",dispoAsap:true,dateDisponibilite:"",meuble:false,atouts:[],description:"",honoSoloc:"890",photos:[],video:""};

function BienFormModal({bien, onSave, onClose, onDelete}){
  const editing=!!bien;
  const [form,setForm]=useState(editing?{...blankBien,...bien, atouts:bienAtouts(bien), loyerCC:bienLoyerCC(bien), secteur:bienLoc(bien), rue:bienRue(bien), dispoAsap:bien.dispoAsap!==undefined?bien.dispoAsap:!bien.dateDisponibilite}:{...blankBien});
  const [uploading,setUploading]=useState(false);
  const [uploadPct,setUploadPct]=useState(0);
  const [uploadMsg,setUploadMsg]=useState("");
  const [uploadErr,setUploadErr]=useState("");
  const [err,setErr]=useState("");
  const fileRef=useRef();
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const toggleAtout=(a)=>setForm(p=>{const cur=asArray(p.atouts);return {...p,atouts:cur.includes(a)?cur.filter(x=>x!==a):[...cur,a]};});
  const eur=(n)=>Math.round(n).toLocaleString("fr-FR")+" €";

  // Photos envoyées une par une : chaque photo réussie est ajoutée tout de suite,
  // une photo en échec n'annule pas les autres, et l'erreur s'affiche sous la zone photos.
  const uploadPhotos=async(files)=>{
    if(!files||!files.length) return;
    const arr=Array.from(files); const errs=[];
    setUploading(true); setUploadErr(""); setUploadPct(0);
    for(let i=0;i<arr.length;i++){
      const f=arr[i], t0=Date.now();
      setUploadMsg("Photo "+(i+1)+"/"+arr.length+" — envoi…"); setUploadPct(Math.round(i/arr.length*100));
      try{
        const url=await uploadPhoto(f);
        setForm(p=>({...p,photos:[...(p.photos||[]),url]}));
        console.log("[photos] OK "+f.name+" en "+((Date.now()-t0)/1000).toFixed(1)+" s → "+url);
      }catch(e){
        const m=(e&&e.message)==="timeout"?"pas de réponse du script en 90 s":((e&&e.message)||"erreur inconnue");
        errs.push(f.name+" : "+m);
        console.warn("[photos] ÉCHEC "+f.name+" après "+((Date.now()-t0)/1000).toFixed(1)+" s : "+m, e);
      }
    }
    setUploading(false); setUploadPct(0); setUploadMsg("");
    if(errs.length) setUploadErr(errs.length+" photo"+(errs.length>1?"s":"")+" non ajoutée"+(errs.length>1?"s":"")+" — "+errs.join(" · "));
  };
  const removePhoto=(idx)=>setForm(p=>({...p,photos:p.photos.filter((_,i)=>i!==idx)}));

  const surf=parseFloat(form.surface)||0;
  const hc=parseFloat(form.loyerHC)||0;
  const honoAgence=Math.round(surf*HONO_AGENCE_M2);
  const depot=Math.round(hc*(form.meuble?2:1));

  const submit=()=>{
    if(!form.typologie){setErr("Choisis une typologie.");return;}
    if(!form.loyerCC){setErr("Le loyer charges comprises est obligatoire.");return;}
    if(!(form.secteur||"").trim()){setErr("Renseigne l'arrondissement / ville.");return;}
    setErr("");
    onSave(form);
  };

  const chipStyle=(active)=>({padding:"7px 13px",borderRadius:20,border:"1.5px solid",borderColor:active?"var(--accent)":"var(--border2)",background:active?"var(--accent-l)":"var(--surface2)",color:active?"var(--accent-d)":"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"});
  const atoutStyle=(active)=>({padding:"7px 12px",borderRadius:9,border:"1.5px solid",borderColor:active?"var(--green)":"var(--border2)",background:active?"var(--green-bg)":"var(--surface)",color:active?"#166534":"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"});

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{editing?"Modifier le bien":"Ajouter un bien"}</div>
        {err&&<div className="ferr">{err}</div>}

        <div className="modal-section">Le bien</div>
        <div className="fg">
          <label className="fl">Typologie *</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {TYPOLOGIES.map(t=>(
              <button key={t} type="button" style={chipStyle(form.typologie===t)} onClick={()=>set("typologie",t)}>{t}</button>
            ))}
          </div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Surface (m²)</label><input className="fi" type="number" value={form.surface} onChange={e=>set("surface",e.target.value)}/></div>
          <div className="fg"><label className="fl">Loyer charges comprises (€) *</label><input className="fi" type="number" value={form.loyerCC} onChange={e=>set("loyerCC",e.target.value)}/></div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Loyer HORS charges (€) — interne</label><input className="fi" type="number" value={form.loyerHC} onChange={e=>set("loyerHC",e.target.value)}/></div>
          <div className="fg"><label className="fl">Étage</label><input className="fi" value={form.etage} onChange={e=>set("etage",e.target.value)} placeholder="3e"/></div>
        </div>
        <div className="fr">
          <div className="fg"><label className="fl">Rue (sans numéro) — proposée</label><input className="fi" value={form.rue} onChange={e=>set("rue",e.target.value)} placeholder="rue Béchevelin"/></div>
          <div className="fg"><label className="fl">Arrondissement / Ville *</label><input className="fi" value={form.secteur} onChange={e=>set("secteur",e.target.value)} placeholder="Lyon 7 · Villeurbanne"/></div>
        </div>
        <div className="fr">
          <div className="fg">
            <label className="fl">Disponibilité</label>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button type="button" style={atoutStyle(form.dispoAsap)} onClick={()=>set("dispoAsap",!form.dispoAsap)}>⚡ Dès maintenant</button>
              {!form.dispoAsap&&<input className="fi" type="date" style={{flex:1}} value={form.dateDisponibilite} onChange={e=>set("dateDisponibilite",e.target.value)}/>}
            </div>
          </div>
          <div className="fg">
            <label className="fl">État</label>
            <div className="seg">
              <button type="button" className={"seg-btn"+(!form.meuble?" active":"")} onClick={()=>set("meuble",false)}>Vide</button>
              <button type="button" className={"seg-btn"+(form.meuble?" active":"")} onClick={()=>set("meuble",true)}>Meublé</button>
            </div>
          </div>
        </div>

        <div className="modal-section">Atouts — coche ce qui s'applique</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {ATOUTS_LIST.map(a=>(
            <button key={a} type="button" style={atoutStyle(asArray(form.atouts).includes(a))} onClick={()=>toggleAtout(a)}>{a}</button>
          ))}
        </div>

        <div className="modal-section">Honoraires &amp; dépôt — automatiques</div>
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"4px 15px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid var(--border)",fontSize:13}}>
            <span>Honoraires agence partenaire <span style={{color:"var(--text3)",fontWeight:600}}>(surface × 13,2 €)</span></span>
            <span className="brand-font" style={{fontWeight:800}}>{surf>0?eur(honoAgence):"—"}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid var(--border)",fontSize:13}}>
            <span>Honoraires SOLOC' <span style={{color:"var(--text3)",fontWeight:600}}>(modifiable)</span></span>
            <input className="fi" type="number" value={form.honoSoloc} onChange={e=>set("honoSoloc",e.target.value)} style={{width:110,textAlign:"right",fontWeight:800}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",fontSize:13}}>
            <span>Dépôt de garantie <span style={{color:"var(--text3)",fontWeight:600}}>{form.meuble?"(2× loyer HC — meublé)":"(1× loyer HC — vide)"}</span></span>
            <span className="brand-font" style={{fontWeight:800,color:"var(--accent)"}}>{hc>0?eur(depot):"—"}</span>
          </div>
        </div>

        <div className="modal-section">Description</div>
        <textarea className="fi" rows="2" value={form.description} onChange={e=>set("description",e.target.value)} placeholder="Points forts ET négatifs, infos utiles…"/>

        <div className="modal-section">Médias — optionnel</div>
        <div className="upload-zone" onClick={()=>!uploading&&fileRef.current.click()}>
          <Ic n="upload" s={18}/><br/>
          {uploading?(uploadMsg||`Upload en cours… ${uploadPct}%`):"Cliquer pour ajouter des photos (plusieurs possibles)"}
          {uploading&&<div className="upload-progress"><div className="upload-progress-bar" style={{width:uploadPct+"%"}}/></div>}
        </div>
        {uploadErr&&<div className="ferr" style={{marginTop:8}}>{uploadErr}</div>}
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ const fl=e.target.files; uploadPhotos(fl&&Array.from(fl)); e.target.value=""; }}/>
        {form.photos&&form.photos.length>0&&(
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8,marginBottom:8}}>
            {form.photos.map((url,i)=>(
              <div key={i} style={{position:"relative"}}>
                <img src={url} referrerPolicy="no-referrer" style={{width:72,height:54,objectFit:"cover",borderRadius:7,border:"1px solid var(--border)"}}/>
                <button onClick={()=>removePhoto(i)} style={{position:"absolute",top:-5,right:-5,background:"var(--red)",border:"none",color:"#fff",width:18,height:18,borderRadius:"50%",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
              </div>
            ))}
          </div>
        )}
        <div className="fg" style={{marginTop:8}}><label className="fl">Lien vidéo (YouTube, Drive…) — optionnel</label><input className="fi" value={form.video} onChange={e=>set("video",e.target.value)} placeholder="https://…"/></div>

        <div className="fa">
          {editing&&<button className="btn btn-g" style={{color:"var(--red)"}} onClick={()=>onDelete(bien)}><Ic n="trash" s={13}/>Supprimer</button>}
          <button className="btn btn-g" onClick={onClose}>Annuler</button>
          <button className="btn btn-p" onClick={submit} disabled={uploading}><Ic n="check" s={13}/>{editing?"Enregistrer":"Ajouter & envoyer"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── ENVOI D'UN BIEN PAR MAIL ────────────────────────────────────────────
function SendBienModal({bien, newsletter, leads, user, onClose, addToast}){
  const typo = bien.typologie;
  const nlMatch = (newsletter||[]).filter(n=>asArray(n.typologie).includes(typo) && (n.email||"").trim());
  const missionMatch = (leads||[]).filter(l=>l.column==="en_recherche" && asArray(l.criteria&&l.criteria.typologie).includes(typo) && (l.email||"").trim());
  const myRole = roleOfEmail(user.email);
  const [sendNl,setSendNl]=useState(true);
  const [sendMi,setSendMi]=useState(true);
  // Signature imposée : la personne qui a créé le bien (bandeau + son numéro dans le mail).
  // Biens anciens sans créateur connu : la personne qui envoie. Charles / autre compte : l'équipe.
  const creatorRole = bien.createdBy ? roleOfEmail(bien.createdBy) : myRole;
  const sender = (creatorRole==="emmy"||creatorRole==="aya") ? creatorRole : "equipe";
  const [sending,setSending]=useState(false);
  const [result,setResult]=useState(null); // {statut, message, envoyes, echecs}
  const total = (sendNl?nlMatch.length:0)+(sendMi?missionMatch.length:0);
  const senderLabels={emmy:"Emmy",aya:"Aya",equipe:"Équipe SOLOC'"};

  const send=()=>{
    if(!SEND_BIEN_WEBAPP_URL){ addToast("Envoi non configuré (URL manquante)","error"); return; }
    if(!sendNl&&!sendMi){ addToast("Coche au moins une liste","error"); return; }
    if(total===0){ addToast("Aucun destinataire ne correspond","error"); return; }
    setSending(true); addToast("Envoi en cours…");
    // Le script répond « OK - x/y … », « PARTIEL - x/y … — raison » ou « ERREUR : … » (délai max 90 s : un mail par destinataire)
    fetchTimeout(SEND_BIEN_WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({bienId:bien.id, newsletter:sendNl, mission:sendMi, sender:sender})},90000)
      .then(r=>r.text())
      .then(txt=>{
        const full=String(txt).trim();
        const cut=full.indexOf("\n@@");
        const t=cut>=0?full.slice(0,cut).trim():full;
        let det={envoyes:[],echecs:[]};
        if(cut>=0){ try{ det=JSON.parse(full.slice(cut+3)); }catch(e){} }
        setSending(false);
        // Historique des envois sur le bien (qui a reçu quoi, quand, par qui)
        if(asArray(det.envoyes).length||asArray(det.echecs).length){
          const entry={at:nowISO(), by:user.email, envoyes:asArray(det.envoyes), echecs:asArray(det.echecs)};
          fsUpdateDoc(fsDocRef(db,"biens",bien.id),{envois:[...asArray(bien.envois),entry]}).catch(()=>{});
        }
        if(/^ERREUR/i.test(t)){ setResult({statut:"ko",message:t.replace(/^ERREUR\s*:?\s*/i,""),...det}); return; }
        if(/^PARTIEL/i.test(t)){ setResult({statut:"partiel",message:t.replace(/^PARTIEL\s*-\s*/i,""),...det}); return; }
        if(/^OK/i.test(t)){ setResult({statut:"ok",message:t.replace(/^OK\s*-\s*/i,""),...det}); return; }
        addToast("⚠ Réponse inattendue du script d'envoi — vérifie que le bien est bien parti","error"); onClose();
      })
      .catch(e=>{ setSending(false); addToast(e&&e.message==="timeout"
        ? "⚠ Pas de réponse du script d'envoi après 90 s — le bien n'est peut-être PAS parti (script à redéployer ?)"
        : "✗ Bien NON envoyé — script d'envoi injoignable","error"); });
  };

  const box=(checked,setF,title,sub)=>(
    <label style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",border:"1.5px solid",borderColor:checked?"var(--accent)":"var(--border2)",borderRadius:10,marginBottom:8,cursor:"pointer",background:checked?"var(--accent-l)":"var(--surface)"}}>
      <input type="checkbox" checked={checked} onChange={e=>setF(e.target.checked)}/>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{title}</div><div style={{fontSize:11,color:"var(--text3)"}}>{sub}</div></div>
    </label>
  );

  if(result){
    const env=asArray(result.envoyes), ech=asArray(result.echecs);
    return(
      <div className="overlay" onClick={onClose}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <div className="modal-title" style={{color:result.statut==="ok"?"var(--green)":"var(--red)"}}>
            {result.statut==="ok"?"✓ Bien envoyé à "+env.length+" personne"+(env.length>1?"s":""):result.statut==="partiel"?"⚠ Envoi partiel":"✗ Bien NON envoyé"}
          </div>
          <div className="modal-sub">{bienTitre(bien)} · {result.message}</div>
          {env.length>0&&<><div className="modal-section">Envoyé à</div>
            <div style={{maxHeight:260,overflowY:"auto",fontSize:12.5,lineHeight:1.7}}>
              {env.map((r,i)=><div key={i}>✓ <b>{r.nom||"—"}</b> <span style={{color:"var(--text3)"}}>· {r.email} · {r.liste}</span></div>)}
            </div></>}
          {ech.length>0&&<><div className="modal-section" style={{color:"var(--red)"}}>Non envoyé</div>
            <div style={{fontSize:12.5,lineHeight:1.7,color:"var(--red)"}}>{ech.map((r,i)=><div key={i}>✗ {r.nom||"—"} · {r.email} — {r.erreur}</div>)}</div></>}
          <div style={{fontSize:11,color:"var(--text3)",marginTop:10}}>Un récapitulatif a aussi été envoyé à hello@solocimmo.fr. L'envoi est gardé dans l'historique de la fiche du bien.</div>
          <div className="fa"><button className="btn btn-p" onClick={onClose}>Fermer</button></div>
        </div>
      </div>
    );
  }

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Envoyer le bien</div>
        <div className="modal-sub">{bienTitre(bien)} · typologie {typo||"—"}</div>
        <div className="modal-section">À qui ?</div>
        {box(sendNl,setSendNl,"Newsletter",nlMatch.length+" contact"+(nlMatch.length!==1?"s":"")+" qui cherche"+(nlMatch.length!==1?"nt":"")+" du "+(typo||"—"))}
        {box(sendMi,setSendMi,"Lettre de Mission (En recherche)",missionMatch.length+" client"+(missionMatch.length!==1?"s":"")+" suivi"+(missionMatch.length!==1?"s":"")+" · honoraires selon profil")}
        <div className="modal-section">Signature du mail</div>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",border:"1.5px solid var(--border2)",borderRadius:10,background:"var(--surface2)"}}>
          <span className="badge" style={{background:(ASSIGNEES[sender]||{}).color||"var(--ardoise)",color:"#fff"}}>{senderLabels[sender]}</span>
          <span style={{fontSize:12,color:"var(--text2)"}}>{sender==="equipe"
            ? (bien.createdBy?"bien créé par Charles : signature « L'équipe SOLOC' » (sans numéro de téléphone).":"signature « L'équipe SOLOC' » (sans numéro de téléphone).")
            : (bien.createdBy?"a créé ce bien : le mail est signé à son nom, avec son numéro de téléphone.":"signature de la personne qui envoie, avec son numéro de téléphone.")}</span>
        </div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>Envoi depuis hello@solocimmo.fr — un mail personnalisé par destinataire (honoraires selon profil).</div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>{total===0?"Fermer":"Annuler"}</button>
          <button className="btn btn-p" onClick={send} disabled={sending||total===0}><Ic n="mail" s={13}/>{sending?"Envoi…":"Envoyer ("+total+")"}</button>
        </div>
      </div>
    </div>
  );
}

function BiensPage({user, newsletter, leads, addToast}){
  const [biens,setBiens]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null); // null | {type:'add'} | {type:'edit',bien} | {type:'detail',bien}

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"biens"),snap=>{
      const data=snap.docs.map(d=>({id:d.id,...d.data()}));
      data.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
      setBiens(data); setLoading(false);
    },()=>addToast("Erreur chargement biens","error"));
    return unsub;
  },[]);

  const saveBien=(form)=>{
    if(modal?.type==="edit"){
      fsUpdateDoc(fsDocRef(db,"biens",modal.bien.id),{...form,updatedAt:nowISO()})
        .then(()=>{addToast("✓ Bien mis à jour");setModal(null);})
        .catch(()=>addToast("Erreur","error"));
    } else {
      fsAddDoc(fsCollection(db,"biens"),{...form,createdBy:user.email,createdAt:nowISO()})
        .then(ref=>{addToast("✓ Bien ajouté");setModal({type:"send",bien:{...form,createdBy:user.email,id:ref.id}});})
        .catch(()=>addToast("Erreur","error"));
    }
  };

  const deleteBien=(bien)=>{
    if(!confirm("Supprimer ce bien ?")) return;
    fsDeleteDoc(fsDocRef(db,"biens",bien.id))
      .then(()=>{addToast("Bien supprimé");setModal(null);})
      .catch(()=>addToast("Erreur","error"));
  };

  const q=search.toLowerCase();
  const rows=biens.filter(b=>!q||bienLoc(b).toLowerCase().includes(q)||bienRue(b).toLowerCase().includes(q)||(b.typologie||"").toLowerCase().includes(q));

  const BienThumb=({b})=>{
    const cover=b.photos&&b.photos[0];
    const typ=b.typologie&&b.surface?`${b.typologie} · ${b.surface} m²`:(b.typologie||"Bien");
    const dispo=b.dispoAsap?"Dispo maintenant":(b.dateDisponibilite?"Dès le "+fmtDate(b.dateDisponibilite):"");
    return(
      <div className="bien-card" onClick={()=>setModal({type:"detail",bien:b})}>
        <div className="bien-card-photo">
          {cover?<img src={cover} referrerPolicy="no-referrer" alt={typ}/>:<><Ic n="img" s={28}/></>}
        </div>
        <div className="bien-card-body">
          <span className="bien-card-type">{typ}</span>
          <div className="bien-card-title">{bienLoc(b)||bienRue(b)||"—"}</div>
          <div className="bien-card-addr"><Ic n="pin" s={12}/>{bienRue(b)||"Rue non renseignée"}</div>
          <div className="bien-card-bottom">
            <div><span className="bien-card-loyer">{bienLoyerCC(b)} €</span><span className="bien-card-loyer-sub"> CC/mois</span></div>
            <div className="bien-card-attrs">
              {b.surface&&<span className="bien-card-attr"><Ic n="search" s={11}/>{b.surface} m²</span>}
              {b.meuble!==undefined&&<span className={b.meuble?"dispo-badge ok":"dispo-badge soon"}>{b.meuble?"Meublé":"Vide"}</span>}
            </div>
          </div>
        </div>
      </div>
    );
  };

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Biens disponibles</div>
          <div className="ps">{biens.length} bien{biens.length!==1?"s":""} en portefeuille</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un bien</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading&&<div className="empty-state"><div className="es-t">Chargement…</div></div>}
        {!loading&&rows.length===0&&(
          <div className="empty-state">
            <div className="es-ic">🏠</div>
            <div className="es-t">{search?"Aucun résultat":"Aucun bien en portefeuille"}</div>
            <div>{search?"Essaie un autre terme.":"Ajoute tes premiers biens disponibles."}</div>
          </div>
        )}
        {!loading&&rows.length>0&&<div className="biens-grid">{rows.map(b=><BienThumb key={b.id} b={b}/>)}</div>}
      </div>

      {(modal?.type==="add"||modal?.type==="edit")&&(
        <BienFormModal bien={modal.type==="edit"?modal.bien:null} onSave={saveBien} onClose={()=>setModal(null)} onDelete={deleteBien}/>
      )}
      {modal?.type==="detail"&&(
        <BienDetailModal bien={modal.bien} onClose={()=>setModal(null)} addToast={addToast}
          onEdit={()=>setModal({type:"edit",bien:modal.bien})} onSend={()=>setModal({type:"send",bien:modal.bien})}/>
      )}
      {modal?.type==="send"&&(
        <SendBienModal bien={modal.bien} newsletter={newsletter} leads={leads} user={user} onClose={()=>setModal(null)} addToast={addToast}/>
      )}
    </>
  );
}

function PartenaireModal({partenaire, isAdmin, defaultOwner, onSave, onClose}){
  const editing = !!partenaire;
  const [form,setForm]=useState({
    agence: partenaire?.agence||"",
    prenom: partenaire?.prenom||"",
    nom:    partenaire?.nom||"",
    phone:  partenaire?.phone||"",
    email:  partenaire?.email||"",
    owner:  defaultOwner||"charles",
  });
  const [err,setErr]=useState("");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const submit=()=>{
    if(!form.prenom.trim()&&!form.nom.trim()){setErr("Renseigne au moins un prénom ou un nom.");return;}
    if(!form.agence.trim()){setErr("Le nom de l'agence est obligatoire.");return;}
    setErr("");
    onSave(form);
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{editing?"Modifier le partenaire":"Ajouter un partenaire"}</div>
        {err&&<div className="ferr">{err}</div>}
        <div className="fg"><label className="fl">Agence *</label><input className="fi" autoFocus value={form.agence} onChange={e=>set("agence",e.target.value)} placeholder="Ex: Foncia Part-Dieu"/></div>
        <div className="fr">
          <div className="fg"><label className="fl">Prénom</label><input className="fi" value={form.prenom} onChange={e=>set("prenom",e.target.value)}/></div>
          <div className="fg"><label className="fl">NOM</label><input className="fi" value={form.nom} onChange={e=>set("nom",e.target.value)}/></div>
        </div>
        <div className="fg"><label className="fl">Téléphone</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
        <div className="fg"><label className="fl">Email</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></div>

// ─── PARTENAIRES PAGE ────────────────────────────────────────────────────
function PartenairesPage({user, addToast}){
  const [partenaires,setPartenaires]=useState([]);
  const [modal,setModal]=useState(null); // null | {type:'add'} | {type:'edit', p}
  const [search,setSearch]=useState("");
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    const unsub=fsOnSnapshot(fsCollection(db,"partenaires"),snap=>{
      const data=snap.docs.map(d=>({id:d.id,...d.data()}));
      data.sort((a,b)=>(a.agence||"").localeCompare(b.agence||""));
      setPartenaires(data);
      setLoading(false);
    },()=>addToast("Erreur chargement partenaires","error"));
    return unsub;
  },[]);

  const isAdmin = user.email===FINANCE_EMAIL;
  const myRole = emailToRole(user.email);

  const savePartenaire=(form)=>{
    if(modal?.type==="edit"){
      const upd={agence:form.agence, prenom:form.prenom, nom:form.nom, phone:form.phone, email:form.email};
      if(isAdmin) upd.owner = form.owner||partnerOwner(modal.p); // seul l'admin change le propriétaire
      fsUpdateDoc(fsDocRef(db,"partenaires",modal.p.id),upd)
        .then(()=>{addToast("✓ Partenaire mis à jour");setModal(null);})
        .catch(()=>addToast("Erreur de mise à jour","error"));
    } else {
      const owner = isAdmin ? (form.owner||myRole) : myRole;
      fsAddDoc(fsCollection(db,"partenaires"),{agence:form.agence, prenom:form.prenom, nom:form.nom, phone:form.phone, email:form.email, owner, createdBy:user.email, createdAt:nowISO()})
        .then(()=>{addToast("✓ "+form.prenom+" "+form.nom+" ajouté");setModal(null);})
        .catch(()=>addToast("Erreur d'ajout","error"));
    }
  };

  const deletePartenaire=(p)=>{
    const name=[p.prenom,p.nom].filter(Boolean).join(" ")||p.agence;
    if(!confirm("Supprimer "+name+" ?")) return;
    fsDeleteDoc(fsDocRef(db,"partenaires",p.id))
      .then(()=>addToast(name+" supprimé"))
      .catch(()=>addToast("Erreur de suppression","error"));
  };

  // Charles voit tout le réseau ; Emmy et Aya ne voient QUE leurs propres partenaires
  const visibles = isAdmin ? partenaires : partenaires.filter(p=>partnerOwner(p)===myRole);

  const q=search.toLowerCase();
  const rows=visibles.filter(p=>!q||
    (p.agence||"").toLowerCase().includes(q)||
    (p.prenom||"").toLowerCase().includes(q)||
    (p.nom||"").toLowerCase().includes(q)||
    (p.phone||"").includes(q)||
    (p.email||"").toLowerCase().includes(q)
  );

  return(
    <>
      <div className="topbar">
        <div>
          <div className="pt">Partenaires</div>
          <div className="ps">{visibles.length} agent{visibles.length!==1?"s":""} partenaire{visibles.length!==1?"s":""}{isAdmin?"":" — ton réseau"}</div>
        </div>
        <div className="tb-right">
          <div className="search-bar"><Ic n="search" s={14}/><input placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn btn-p" onClick={()=>setModal({type:"add"})}><Ic n="plus" s={13}/>Ajouter un partenaire</button>
          <button className="mobile-logout" onClick={()=>fsSignOut(auth)} title="Se déconnecter"><Ic n="logout" s={18}/></button>
        </div>
      </div>
      <div className="main">
        {loading&&<div className="empty-state"><div className="es-t">Chargement…</div></div>}
        {!loading&&rows.length===0&&(
          <div className="empty-state">
            <div className="es-ic">🤝</div>
            <div className="es-t">{search?"Aucun résultat":"Aucun partenaire enregistré"}</div>
            <div>{search?"Essaie un autre terme.":"Ajoute tes agents partenaires pour les retrouver ici."}</div>
          </div>
        )}
        {!loading&&rows.length>0&&(
          <div style={{overflowX:"auto"}}>
          <table className="list-table">
            <thead><tr>
              <th>Agence</th><th>Propriétaire</th><th>Prénom</th><th>NOM</th><th>Téléphone</th><th>Email</th><th style={{width:80}}></th>
            </tr></thead>
            <tbody>
              {rows.map(p=>(
                <tr key={p.id}>
                  <td><span className="agency-badge">{p.agence||"—"}</span></td>
                  <td>{(function(){var o=partnerOwner(p);var cfg=OWNERS[o]||OWNERS.charles;return <span className="badge" style={{background:cfg.color,color:"#fff"}}>{cfg.label}</span>;})()}</td>
                  <td>{p.prenom||"—"}</td>
                  <td className="td-name">{p.nom||"—"}</td>
                  <td>{p.phone?<a href={"tel:"+p.phone} style={{color:"var(--accent)",fontWeight:700,textDecoration:"none"}}>{p.phone}</a>:"—"}</td>
                  <td>{p.email?<a href={"mailto:"+p.email} style={{color:"var(--accent)",fontWeight:700,textDecoration:"none"}}>{p.email}</a>:"—"}</td>
                  <td>
                    <div className="pt-actions">
                      <button className="ib" title="Modifier" onClick={()=>setModal({type:"edit",p})}><Ic n="edit" s={14}/></button>
                      <button className="ib" title="Supprimer" style={{color:"var(--red)"}} onClick={()=>deletePartenaire(p)}><Ic n="trash" s={14}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
      {modal&&<PartenaireModal partenaire={modal.type==="edit"?modal.p:null} isAdmin={isAdmin} defaultOwner={modal.type==="edit"?partnerOwner(modal.p):myRole} onSave={savePartenaire} onClose={()=>setModal(null)}/>}
    </>
  );
}

// ─── POPUP ENVOYÉ : mail des 3 liens (formulaire + lettre + documents) ───
function EnvoiModal({lead, user, onClose, addToast, onSent}){
  const c0 = lead.criteria||{};
  const [email,setEmail]=useState(lead.email||"");
  const PROFILS = [
    {key:"etudiant", label:"Étudiant",    statut:"Étudiant",    essai:null},
    {key:"cdi",      label:"CDI",         statut:"CDI",         essai:true},
    {key:"cdi_essai",label:"CDI essai",   statut:"CDI",         essai:false},
    {key:"cdd",      label:"CDD",         statut:"CDD",         essai:null},
    {key:"indep",    label:"Indépendant", statut:"Indépendant", essai:null},
    {key:"coloc",    label:"Colocation",  statut:"Colocation",  essai:null}
  ];
  const initKey=(function(){ var s=c0.statutClient, e=c0.periodeEssaiValidee;
    if(s==="Étudiant") return "etudiant";
    if(s==="CDI") return e===false ? "cdi_essai" : "cdi";
    if(s==="CDD") return "cdd";
    if(s==="Indépendant") return "indep";
    if(s==="Colocation") return "coloc";
    return ""; })();
  const [profilKey,setProfilKey]=useState(initKey);
  const [nbColoc,setNbColoc]=useState(c0.nbColoc||2);
  const [sending,setSending]=useState(false);
  const prenom=prenomOf(lead);
  const sender=(function(){ const r=roleOfEmail(user.email); return (r==="emmy"||r==="aya")?r:"equipe"; })();

  const cur = PROFILS.find(p=>p.key===profilKey);
  const statut = cur?cur.statut:"";
  const essai = cur?cur.essai:null;
  const montant = statut ? honoForProfile(statut,{periodeEssaiValidee:essai,nbColoc:nbColoc}) : null;
  const titre = statut ? letterTitre(statut, essai) : "";
  const profil = docProfil(statut);
  const B = CLIENT_BASE_URL;
  const linkForm = B+"formulaire.html?id="+lead.id+"&n="+encodeURIComponent(lead.name||"");
  const linkLettre = B+"lettre.html?id="+lead.id;
  const linkDocs = B+"documents.html?id="+lead.id+"&p="+profil;

  const send=()=>{
    const cleanEmail=String(email||"").replace(/[\s\u200B-\u200D\uFEFF]/g,"");
    if(cleanEmail!==email) setEmail(cleanEmail);
    if(!cleanEmail){ addToast("Renseigne un email pour envoyer","error"); return; }
    if(!/^[^@]+@[^@]+\.[a-z]{2,}$/i.test(cleanEmail)){ addToast("Email invalide : "+cleanEmail,"error"); return; }
    if(!statut){ addToast("Choisis un statut (il fixe la lettre et le montant)","error"); return; }
    if(!ENVOI_WEBAPP_URL){ addToast("Envoi non configuré (URL manquante)","error"); return; }
    setSending(true);
    const critMaj = {...c0, statutClient:statut, periodeEssaiValidee:essai, nbColoc:nbColoc};
    // Déplacement en Envoyé + MàJ fiche : seulement une fois le mail confirmé par le script
    const markSent=()=>{
      fsUpdateDoc(fsDocRef(db,"leads",lead.id),{ column:"envoye", envoyeAt:nowISO(), lastActivity:nowISO(), email:cleanEmail, criteria:critMaj, envoiEnvoye:true, envoiAt:nowISO(), history:[...(lead.history||[]),mkEvent("✉️","Dossier envoyé")] }).then(()=>{ if(onSent) onSent({...lead,email:cleanEmail,criteria:critMaj}); }).catch(()=>{});
      // Config de la lettre (montant fixé côté base = non modifiable par le client)
      fsSetDoc(fsDocRef(db,"lettres",lead.id),{ status:"a_signer", titre:titre, montant:montant, profil:profil, nom:lead.name||"", email:cleanEmail, createdAt:nowISO() }).catch(()=>{});
    };
    // Envoi du mail des 3 liens : on lit la réponse du script ("OK …" ou "ERREUR : …")
    fetchTimeout(ENVOI_WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({ email:cleanEmail, prenom:prenom, sender:sender, linkForm:linkForm, linkLettre:linkLettre, linkDocs:linkDocs })},20000)
      .then(r=>r.text())
      .then(txt=>{
        if(/^ERREUR/i.test(String(txt).trim())){
          setSending(false);
          addToast("✗ Mail NON envoyé — "+String(txt).replace(/^ERREUR\s*:?\s*/i,""),"error");
          return;
        }
        markSent(); setSending(false); addToast("✓ Mail envoyé à "+cleanEmail); onClose();
      })
      .catch(()=>{
        // Réponse illisible (réseau / navigateur) : le script a pu envoyer quand même → comportement d'avant
        markSent(); setSending(false); addToast("Mail transmis à "+cleanEmail+" (confirmation indisponible)"); onClose();
      });
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Envoyer le mail de démarrage ✉️</div>
        <div className="modal-sub">{lead.name} passe en Envoyé. Vérifie l'email et le statut, puis envoie les 3 liens (formulaire, lettre, documents).</div>

        <div className="fg">
          <label className="fl">Email du client *</label>
          <input className="fi" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="client@mail.com"/>
        </div>
        <div className="fg">
          <label className="fl">Statut / profil * <span style={{fontWeight:400,color:"var(--text3)"}}>(fixe la lettre et le montant)</span></label>
          <div className="seg" style={{flexWrap:"wrap"}}>
            {PROFILS.map(p=>(
              <button key={p.key} type="button" className={"seg-btn"+(profilKey===p.key?" active":"")} onClick={()=>setProfilKey(p.key)}>{p.label}</button>
            ))}
          </div>
        </div>
        {statut==="Colocation"&&(
          <div className="fg">
            <label className="fl">Nombre de colocataires</label>
            <input className="fi" type="number" min="2" value={nbColoc} onChange={e=>setNbColoc(parseInt(e.target.value)||2)} style={{width:100}}/>
          </div>
        )}

        {statut&&(
          <div style={{background:"var(--accent-l)",border:"1px solid var(--accent-l2)",borderRadius:10,padding:"11px 13px",marginTop:6,fontSize:12.5,color:"var(--accent-d)"}}>
            Lettre : <b>{titre}</b> · Montant : <b>{montant} € TTC</b> · Checklist : <b>{profil}</b>
          </div>
        )}

        <div style={{fontSize:11,color:"var(--text3)",marginTop:10}}>Signature du mail : <b>{sender==="equipe"?"Équipe SOLOC'":(sender==="emmy"?"Emmy":"Aya")}</b> · envoi depuis hello@solocimmo.fr</div>

        <div className="fa">
          <button className="btn btn-g" onClick={onClose}>Plus tard</button>
          <button className="btn btn-p" onClick={send} disabled={sending}><Ic n="mail" s={13}/>{sending?"Envoi…":"Envoyer l'email de dossier"}</button>
        </div>
      </div>
    </div>
  );
}
